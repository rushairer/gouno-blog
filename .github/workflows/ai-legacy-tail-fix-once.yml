name: AI legacy tail fix once

on:
  push:
    branches:
      - ui/ai-legacy-class-cleanup-20260913

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace remaining legacy mono hooks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of [
            'blog-frontend/src/pages/admin/PageEditor.tsx',
            'blog-frontend/src/pages/admin/PostEditor.tsx',
          ]) {
            const source = fs.readFileSync(path, 'utf8');
            const before = 'className="editor-body mono"';
            if (!source.includes(before)) throw new Error(`${path}: expected editor-body mono anchor missing`);
            fs.writeFileSync(path, source.replace(before, 'className="editor-body font-mono"'));
          }
          NODE
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Verify frontend quality
        working-directory: blog-frontend
        run: npm run quality
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/admin/PageEditor.tsx blog-frontend/src/pages/admin/PostEditor.tsx
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): replace remaining legacy mono hooks"
          git push

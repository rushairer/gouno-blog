name: Phase 37A migrate WorkflowWorkspace

on:
  push:
    branches:
      - ui/workflow-workspace-canonical-phase37

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/workflow-workspace-canonical-phase37
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate outer WorkflowWorkspace shell
        working-directory: blog-frontend
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/components/agent/WorkflowWorkspace.tsx';
          let text = fs.readFileSync(path, 'utf8');

          const oldCore = `import {\n  Checkbox,\n  CheckboxField,\n  Field,\n  Input,\n  SearchField,\n  Textarea,\n} from "@gouno/ui/core";`;
          const nextCore = `import {\n  ButtonLink,\n  Checkbox,\n  CheckboxField,\n  Empty,\n  Field,\n  Input,\n  Modal,\n  SearchField,\n  Textarea,\n} from "@gouno/ui/core";`;
          if (!text.includes(oldCore)) throw new Error('canonical import block not found');
          text = text.replace(oldCore, nextCore);

          const oldLegacy = `import {\n  Button,\n  ButtonLink,\n  ConfirmDialog,\n  EditorPanel,\n  EmptyState,\n  Feedback,\n  FilterBar,\n  FormActions,\n  FormLayout,\n  IconButton,\n  PanelHeader,\n  Select,\n  WorkspacePanel,\n} from "@gouno/ui-legacy";`;
          const nextLegacy = `import {\n  Button,\n  EditorPanel,\n  Feedback,\n  FormActions,\n  FormLayout,\n  IconButton,\n  PanelHeader,\n  Select,\n} from "@gouno/ui-legacy";`;
          if (!text.includes(oldLegacy)) throw new Error('legacy import block not found');
          text = text.replace(oldLegacy, nextLegacy);

          text = text.replace('<WorkspacePanel className="workflow-workspace">', '<div className="workflow-workspace">');
          text = text.replace('</WorkspacePanel>', '</div>');
          text = text.replace('<FilterBar className="workflow-list-toolbar">', '<div className="workflow-list-toolbar flex flex-wrap items-center gap-3">');
          text = text.replace('</FilterBar>', '</div>');

          text = text.replace(/<ButtonLink\b[^>]*>/g, (tag) => tag.replace('variant="secondary"', 'variant="outline"'));

          const emptyStatePattern = /<EmptyState\s+label=\{([\s\S]*?)\}\s*\/>/;
          const emptyMatch = text.match(emptyStatePattern);
          if (!emptyMatch) throw new Error('EmptyState block not found');
          text = text.replace(emptyStatePattern, '<Empty title={$1} />');

          const confirmPattern = /<ConfirmDialog\s+open=\{deleteTarget !== null\}[\s\S]*?onConfirm=\{deleteWorkflow\}\s*\/>/;
          const confirmMatch = text.match(confirmPattern);
          if (!confirmMatch) throw new Error('ConfirmDialog block not found');
          text = text.replace(confirmPattern, `<Modal\n        open={deleteTarget !== null}\n        title={locale === "zh" ? "删除 Workflow？" : "Delete workflow?"}\n        description={\n          deleteTarget\n            ? locale === "zh"\n              ? \`删除“\${deleteTarget.name}”后将停止后续运行。历史版本和运行审计会保留。\`\n              : \`Deleting “\${deleteTarget.name}” stops future runs. Version history and run audits are retained.\`\n            : ""\n        }\n        okText={locale === "zh" ? "删除 Workflow" : "Delete workflow"}\n        cancelText={locale === "zh" ? "取消" : "Cancel"}\n        confirmLoading={deleting}\n        onOpenChange={(open) => {\n          if (!open && !deleting) setDeleteTarget(null);\n        }}\n        onOk={deleteWorkflow}\n        okButtonProps={{ variant: "solid", color: "error" }}\n        closeOnBackdrop\n      />`);

          fs.writeFileSync(path, text);

          const allowPath = 'scripts/legacy-ui-allowlist.json';
          const allow = JSON.parse(fs.readFileSync(allowPath, 'utf8'));
          const target = 'src/components/agent/WorkflowWorkspace.tsx';
          for (const symbol of ['ButtonLink', 'ConfirmDialog', 'EmptyState', 'FilterBar', 'WorkspacePanel']) {
            const entries = allow.allowedLegacyImports[symbol];
            if (!entries || !entries.includes(target)) throw new Error(`allowlist entry missing: ${symbol}`);
            const next = entries.filter((item) => item !== target);
            if (next.length) allow.allowedLegacyImports[symbol] = next;
            else delete allow.allowedLegacyImports[symbol];
          }
          fs.writeFileSync(allowPath, JSON.stringify(allow, null, 2) + '\n');
          NODE
      - name: Format and focused gates
        working-directory: blog-frontend
        run: |
          npm ci
          npx prettier --write src/components/agent/WorkflowWorkspace.tsx scripts/legacy-ui-allowlist.json
          npm run lint:ui
          npx tsc -b
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/components/agent/WorkflowWorkspace.tsx blog-frontend/scripts/legacy-ui-allowlist.json
          git diff --cached --quiet && exit 0
          git commit -m "refactor(ui): migrate workflow workspace outer shell"
          git push origin HEAD:ui/workflow-workspace-canonical-phase37

# Temporary toolchain supply-chain probe; remove after recording the immutable index digest.
name: Resolve Patched Go Builder Digest
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-go-builder-digest.yml"
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Go 1.27.2 Alpine manifest index
        run: |
          set -eu
          docker buildx imagetools inspect docker.io/library/golang:1.27.2-alpine

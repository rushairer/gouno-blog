name: Format Blog Admin Greenfield Shell

on:
  push:
    branches:
      - ui/blog-admin-greenfield-shell
    paths:
      - .github/workflows/format-blog-admin-greenfield-shell.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/blog-admin-greenfield-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Format migrated UI files
        working-directory: blog-frontend
        run: |
          npx prettier --write \
            src/utils/navigation.tsx \
            src/layouts/AdminShell.tsx \
            src/components/agent/WorkflowLauncher.tsx \
            src/components/agent/__tests__/WorkflowLauncher.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/utils/navigation.tsx \
            blog-frontend/src/layouts/AdminShell.tsx \
            blog-frontend/src/components/agent/WorkflowLauncher.tsx \
            blog-frontend/src/components/agent/__tests__/WorkflowLauncher.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ui): format Blog Admin greenfield shell"
          git push origin HEAD:ui/blog-admin-greenfield-shell

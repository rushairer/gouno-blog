name: Migrate Blog Comments Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-comments-once.yml

permissions:
  contents: write

concurrency:
  group: migrate-blog-comments-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Apply canonical Comments migration and verify
        shell: bash
        run: |
          set -euo pipefail
          cp .github/migrations/Comments.tsx blog-frontend/src/pages/admin/Comments.tsx
          cp .github/migrations/Comments.test.tsx blog-frontend/src/pages/admin/__tests__/Comments.test.tsx

          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'blog-frontend/scripts/legacy-ui-allowlist.json';
          const targetFiles = new Set([
            'src/pages/admin/Comments.tsx',
            'src/pages/admin/__tests__/Comments.test.tsx',
          ]);
          const allowlist = JSON.parse(await readFile(path, 'utf8'));
          allowlist.canonicalSourceSha = '0ba9fabda8e61f3a278b3fb5f37b8f671c167abb';

          let removedPairs = 0;
          for (const [symbol, files] of Object.entries(allowlist.allowedLegacyImports ?? {})) {
            const next = files.filter((file) => {
              if (!targetFiles.has(file)) return true;
              removedPairs += 1;
              return false;
            });
            if (next.length) allowlist.allowedLegacyImports[symbol] = next;
            else delete allowlist.allowedLegacyImports[symbol];
          }

          if (removedPairs !== 15) {
            throw new Error(`Expected to ratchet exactly 15 Comments legacy symbol-file pairs, removed ${removedPairs}`);
          }
          for (const files of Object.values(allowlist.allowedLegacyImports ?? {})) {
            for (const file of files) {
              if (targetFiles.has(file)) throw new Error(`Comments legacy allowlist entry remains: ${file}`);
            }
          }

          await writeFile(path, `${JSON.stringify(allowlist, null, 2)}\n`);
          EOF

          cd blog-frontend
          npm ci
          npx prettier --write \
            src/pages/admin/Comments.tsx \
            src/pages/admin/__tests__/Comments.test.tsx \
            scripts/legacy-ui-allowlist.json
          npm run quality
          cd ..
          docker build -f blog-frontend/Dockerfile blog-frontend

      - name: Commit verified migration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-comments-once.yml
          rm .github/migrations/Comments.tsx .github/migrations/Comments.test.tsx

          if grep -R "@gouno/ui-legacy" -n \
            blog-frontend/src/pages/admin/Comments.tsx \
            blog-frontend/src/pages/admin/__tests__/Comments.test.tsx; then
            echo "Comments migration still imports legacy UI" >&2
            exit 1
          fi

          git add \
            blog-frontend/src/pages/admin/Comments.tsx \
            blog-frontend/src/pages/admin/__tests__/Comments.test.tsx \
            blog-frontend/scripts/legacy-ui-allowlist.json \
            .github/workflows/migrate-comments-once.yml \
            .github/migrations/Comments.tsx \
            .github/migrations/Comments.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ui): migrate Blog comments to canonical Gouno UI"
          git push origin HEAD:main

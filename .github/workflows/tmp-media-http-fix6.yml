name: Temporary Media HTTP Ownership Migration Fix 6

on:
  push:
    branches: [refactor/media-http-ownership]
    paths:
      - blog-backend/internal/media/controller/media_type_test.go
      - .github/workflows/tmp-media-http-fix6.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/media-http-ownership
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Apply migration and test ownership fixes
        run: |
          python3 scripts/tmp-media-http-fix.py
          python3 scripts/tmp-media-http-fix2.py
          python3 scripts/tmp-media-http-fix4.py
          python3 scripts/tmp-media-http-migration.py
          python3 scripts/tmp-media-http-fix5.py
          test -f blog-backend/internal/controller/growth_controller_media_test.go
          rm blog-backend/internal/controller/growth_controller_media_test.go

      - name: Format and verify backend
        run: |
          gofmt -w \
            blog-backend/internal/media/controller \
            blog-backend/internal/controller/growth_controller.go \
            blog-backend/internal/controllerutil/response.go \
            blog-backend/internal/agent/generation.go \
            blog-backend/internal/agent/approval.go \
            blog-backend/router/web.go \
            blog-backend/router/web_test.go \
            blog-backend/cmd/gouno/web.go
          cd blog-backend
          go test ./...
          go vet ./...

      - name: Verify Media runtime ownership boundary
        run: |
          test -f blog-backend/internal/media/controller/controller.go
          test -f blog-backend/internal/media/controller/svg_security.go
          test -f blog-backend/internal/media/controller/media_type_test.go
          test ! -e blog-backend/internal/controller/svg_security.go
          test ! -e blog-backend/internal/controller/svg_security_test.go
          test ! -e blog-backend/internal/controller/growth_controller_media_test.go
          ! grep -q 'func (ctrl \*GrowthController) ListMedia' blog-backend/internal/controller/growth_controller.go
          ! grep -q 'func (ctrl \*GrowthController) UploadMedia' blog-backend/internal/controller/growth_controller.go
          ! grep -q 's\.growth\.CreateMedia' blog-backend/internal/agent/generation.go
          ! grep -q 's\.growth\.ListMedia' blog-backend/internal/agent/approval.go
          ! grep -q 'service\.ErrMedia' blog-backend/internal/controllerutil/response.go
          grep -q 'author.GET("/admin/media", mediaCtrl.List)' blog-backend/router/web.go
          grep -q 'internal/media/controller' blog-backend/router/web_test.go
          grep -q 'MediaSvc: mediaSvc' blog-backend/cmd/gouno/web.go
          grep -q 'type mediaAssetGateway interface' blog-backend/internal/agent/approval.go

      - name: Remove migration scaffolding
        run: |
          rm scripts/tmp-media-http-migration.py scripts/tmp-media-http-fix.py scripts/tmp-media-http-fix2.py scripts/tmp-media-http-fix3.py scripts/tmp-media-http-fix4.py scripts/tmp-media-http-fix5.py
          rm .github/workflows/tmp-media-http.yml .github/workflows/tmp-media-http-fix.yml .github/workflows/tmp-media-http-fix2.yml .github/workflows/tmp-media-http-fix3.yml .github/workflows/tmp-media-http-fix4.yml .github/workflows/tmp-media-http-fix5.yml .github/workflows/tmp-media-http-fix6.yml

      - name: Commit migrated runtime ownership
        run: |
          git config user.name Aben
          git config user.email 5195693+rushairer@users.noreply.github.com
          git add -A
          git commit -m 'refactor(media): move HTTP and runtime ownership to capability'
          git push origin HEAD:refactor/media-http-ownership

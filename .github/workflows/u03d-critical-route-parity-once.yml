name: U03d critical route parity once

on:
  push:
    branches:
      - ui/u03d-critical-route-parity-20260913

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Align Dashboard error state to Showcase
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dashboardPath = 'blog-frontend/src/pages/admin/Dashboard.tsx';
          let dashboard = fs.readFileSync(dashboardPath, 'utf8');
          const stateBefore = `  const [summary, setSummary] = useState<Summary | null>(null);\n  const [error, setError] = useState(\"\");\n  const [clearingAlerts, setClearingAlerts] = useState(false);`;
          const stateAfter = `  const [summary, setSummary] = useState<Summary | null>(null);\n  const [error, setError] = useState(\"\");\n  const [reloadKey, setReloadKey] = useState(0);\n  const [clearingAlerts, setClearingAlerts] = useState(false);`;
          if (!dashboard.includes(stateBefore)) throw new Error('Dashboard state anchor not found');
          dashboard = dashboard.replace(stateBefore, stateAfter);
          const effectBefore = `  useEffect(() => {\n    if (!allowed) return;\n    analyticsApi\n      .getSummary()\n      .then((data) => setSummary(data as unknown as Summary))\n      .catch((reason: Error) => setError(reason.message));\n  }, [allowed]);`;
          const effectAfter = `  useEffect(() => {\n    if (!allowed) return;\n    setError(\"\");\n    analyticsApi\n      .getSummary()\n      .then((data) => {\n        setSummary(data as unknown as Summary);\n        setError(\"\");\n      })\n      .catch((reason: Error) => setError(reason.message));\n  }, [allowed, reloadKey]);\n\n  const reload = () => {\n    setSummary(null);\n    setError(\"\");\n    setReloadKey((key) => key + 1);\n  };`;
          if (!dashboard.includes(effectBefore)) throw new Error('Dashboard effect anchor not found');
          dashboard = dashboard.replace(effectBefore, effectAfter);
          const errorBefore = `      {error ? <Alert type=\"error\" showIcon title={error} /> : null}\n\n      {summary ? (`;
          const errorAfter = `      {error && !summary ? (\n        <Alert\n          type=\"error\"\n          showIcon\n          title=\"数据概览加载失败\"\n          description={error}\n          action={\n            <Button size=\"small\" onClick={reload}>\n              重新载入\n            </Button>\n          }\n        />\n      ) : error ? (\n        <Alert type=\"error\" showIcon title={error} />\n      ) : null}\n\n      {summary ? (`;
          if (!dashboard.includes(errorBefore)) throw new Error('Dashboard error anchor not found');
          dashboard = dashboard.replace(errorBefore, errorAfter);
          fs.writeFileSync(dashboardPath, dashboard);
          const testPath = 'blog-frontend/src/pages/admin/__tests__/Dashboard.test.tsx';
          let test = fs.readFileSync(testPath, 'utf8');
          const closing = '\n});\n';
          const closingIndex = test.lastIndexOf(closing);
          if (closingIndex < 0) throw new Error('Dashboard test closing anchor not found');
          const retryTest = `\n\n  it(\"uses the Showcase error surface and retries dashboard loading\", async () => {\n    const user = userEvent.setup();\n    let analyticsAttempts = 0;\n    vi.mocked(apiFetch).mockImplementation(async (url) => {\n      if (String(url).includes(\"/api/admin/analytics\")) {\n        analyticsAttempts += 1;\n        if (analyticsAttempts === 1) throw new Error(\"analytics unavailable\");\n        return Response.json({ data: mockSummary });\n      }\n      return Response.json({ data: null });\n    });\n\n    render(\n      <BrowserRouter>\n        <Dashboard />\n      </BrowserRouter>,\n    );\n\n    expect(await screen.findByText(\"数据概览加载失败\")).toBeInTheDocument();\n    expect(screen.getByText(\"analytics unavailable\")).toBeInTheDocument();\n    await user.click(screen.getByRole(\"button\", { name: \"重新载入\" }));\n    expect(await screen.findByText(\"AI 运营提醒\")).toBeInTheDocument();\n    expect(analyticsAttempts).toBe(2);\n  });`;
          test = `${test.slice(0, closingIndex)}${retryTest}${test.slice(closingIndex)}`;
          fs.writeFileSync(testPath, test);
          NODE
      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Verify Blog frontend quality
        working-directory: blog-frontend
        run: npm run quality
      - name: Commit parity fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/admin/Dashboard.tsx blog-frontend/src/pages/admin/__tests__/Dashboard.test.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): align Dashboard error state with Showcase"
          git push

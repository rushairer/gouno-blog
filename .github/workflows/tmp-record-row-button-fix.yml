name: Temporary Record Row Button Fix
on:
  push:
    branches: [ui/blog-admin-final-parity-ai-ops-records-v2]
    paths: [.github/workflows/tmp-record-row-button-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/blog-admin-final-parity-ai-ops-records-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: node scripts/tmp-patch-record-row-buttons.mjs
        working-directory: blog-frontend
      - run: |
          npm ci
          npx prettier --write src/components/agent/AgentRunRecords.tsx src/components/agent/WorkflowRunRecords.tsx
          npm run lint:ui
          npx vitest run src/components/agent/__tests__/AgentRunRecords.test.tsx src/components/agent/__tests__/WorkflowRunRecords.test.tsx
          npx tsc -b
        working-directory: blog-frontend
      - run: |
          rm .github/workflows/tmp-record-row-button-fix.yml blog-frontend/scripts/tmp-patch-record-row-buttons.mjs
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ui): align AI Operations records surfaces"
          git push origin HEAD:ui/blog-admin-final-parity-ai-ops-records-v2

name: Temporary Media Repository Ownership Migration

on:
  push:
    branches: [refactor/media-repository-ownership]
    paths:
      - scripts/tmp-media-repository-migration.py
      - .github/workflows/tmp-media-repository.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/media-repository-ownership
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Move Media persistence ownership to capability
        run: python3 scripts/tmp-media-repository-migration.py

      - name: Format and verify backend
        run: |
          gofmt -w \
            blog-backend/internal/media/repository/repository.go \
            blog-backend/internal/media/repository/repository_integration_test.go \
            blog-backend/internal/repository/growth_repository.go \
            blog-backend/internal/repository/growth_repository_integration_test.go
          cd blog-backend
          go test ./...
          go vet ./...

      - name: Verify Media repository ownership boundary
        run: |
          test -f blog-backend/internal/media/repository/repository.go
          test -f blog-backend/internal/media/repository/repository_integration_test.go
          if git grep -n 'media_assets' -- blog-backend/internal/repository/growth_repository.go; then
            echo 'GrowthRepository still owns media_assets SQL' >&2
            exit 1
          fi
          grep -q 'var _ mediarepository.Repository = (\*GrowthRepository)(nil)' blog-backend/internal/repository/growth_repository.go
          grep -q 'var ErrMediaInUse = mediarepository.ErrMediaInUse' blog-backend/internal/repository/growth_repository.go

      - name: Remove migration scaffolding
        run: rm scripts/tmp-media-repository-migration.py .github/workflows/tmp-media-repository.yml

      - name: Commit migrated persistence ownership
        run: |
          git config user.name Aben
          git config user.email 5195693+rushairer@users.noreply.github.com
          git add -A
          git commit -m 'refactor(media): move persistence ownership to capability'
          git push origin HEAD:refactor/media-repository-ownership

name: Starter Pack Coordinator Refactor

on:
  push:
    branches: [refactor/starterpack-coordinator]

permissions:
  contents: write

concurrency:
  group: starterpack-coordinator-refactor
  cancel-in-progress: true

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Apply fail-closed Starter Pack coordinator cutover
        run: python3 .github/scripts/refactor_starterpack_coordinator.py

      - name: Format changed Go files
        run: |
          gofmt -w \
            blog-backend/internal/starterpack/coordinator.go \
            blog-backend/internal/provider/repository/starter.go \
            blog-backend/internal/agent/repository/starter_skill_repository.go \
            blog-backend/internal/agent/repository/starter_definition_repository.go \
            blog-backend/internal/workflow/repository/core_starters.go \
            blog-backend/internal/migrations/starterpack_test_helper_test.go \
            blog-backend/internal/migrations/migrate_integration_test.go \
            blog-backend/internal/migrations/identity_backfill_integration_test.go \
            blog-backend/cmd/gouno/web.go

      - name: Enforce Starter Pack ownership cutover
        run: |
          test ! -e blog-backend/internal/agent/repository/agent_repository.go
          test ! -e blog-backend/internal/agent/repository/workflow_starters.go
          ! grep -R -q 'agentrepository.NewAgentRepository' blog-backend
          ! grep -R -q 'BootstrapStarterPack' blog-backend/internal/agent/repository
          grep -q 'starterpack.NewCoordinator' blog-backend/cmd/gouno/web.go
          grep -q 'StarterPack: starterPackCoordinator' blog-backend/cmd/gouno/web.go
          grep -q 'type Coordinator struct' blog-backend/internal/starterpack/coordinator.go
          grep -q 'SelectStarterProviderIDTx' blog-backend/internal/provider/repository/starter.go
          grep -q 'ListSystemStarterSkillsTx' blog-backend/internal/agent/repository/starter_skill_repository.go
          grep -q 'ReconcileSystemAgentTx' blog-backend/internal/agent/repository/starter_definition_repository.go
          grep -q 'ReconcileCoreStarterWorkflows' blog-backend/internal/workflow/repository/core_starters.go
          grep -q 'Starter Pack application coordinator' blog-backend/ARCHITECTURE_CONVERGENCE.md
          git diff --check

      - name: Test
        working-directory: blog-backend
        run: go test ./...

      - name: Race detector
        working-directory: blog-backend
        run: go test -race ./...

      - name: Vet
        working-directory: blog-backend
        run: go vet ./...

      - name: Check known Go vulnerabilities
        working-directory: blog-backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Commit verified business changes
        run: |
          rm -f .github/scripts/refactor_starterpack_coordinator.py
          rm -f .github/workflows/starterpack-coordinator-refactor.yml
          git add -A
          git diff --cached --check
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git commit -m "refactor(agent): move Starter Pack to application coordinator"
          git push origin HEAD:refactor/starterpack-coordinator

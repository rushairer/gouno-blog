name: One-shot normalize elevation classes

on:
  push:
    branches:
      - migration/blog-admin-semantic-elevation

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Normalize migrated class strings
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { extname, join } from 'node:path';

          const root = 'blog-frontend/src/pages/admin';
          const files = [];
          async function collect(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) await collect(path);
              else if (extname(entry.name) === '.tsx') files.push(path);
            }
          }
          await collect(root);

          const classHint = /(?:^|\s)(?:flex|grid|hidden|block|relative|absolute|group)(?:\s|$)|(?:^|\s)(?:bg|border|overflow|transition|duration|hover|group-hover|md|sm|lg|xl|h|w|p|px|py|text|items|justify|rounded|opacity|min|max|gap|space)-/;
          let changed = 0;
          for (const path of files) {
            const source = await readFile(path, 'utf8');
            const next = source.replace(/"([^"\n]*)"/g, (full, value) => {
              if (!classHint.test(value)) return full;
              if (!value.includes('  ') && !value.startsWith(' ') && !value.endsWith(' ')) return full;
              return `"${value.trim().replace(/ {2,}/g, ' ')}"`;
            });
            if (next !== source) {
              await writeFile(path, next);
              changed += 1;
            }
          }
          console.log(`Normalized migrated class strings in ${changed} Blog Admin files.`);
          NODE
          cd blog-frontend
          npx prettier --write "src/pages/admin/**/*.tsx"
          cd ..
          rm .github/workflows/one-shot-normalize-elevation.yml
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add blog-frontend/src/pages/admin .github/workflows/one-shot-normalize-elevation.yml
          git commit -m "style: normalize semantic elevation classes"
          git push origin HEAD:migration/blog-admin-semantic-elevation

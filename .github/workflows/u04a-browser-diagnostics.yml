name: U04a Browser Diagnostics

on:
  push:
    branches:
      - ui/u04a-browser-acceptance-20260913
    paths:
      - blog-frontend/e2e/u04a-diagnostics.pw.mjs
      - blog-frontend/e2e/playwright.diagnostics.config.mjs
      - .github/workflows/u04a-browser-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install product dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: cd e2e && npm install --package-lock=false

      - name: Install Chromium
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run diagnostics
        run: cd e2e && npx playwright test --config=playwright.diagnostics.config.mjs

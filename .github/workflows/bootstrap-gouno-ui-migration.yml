name: Bootstrap Gouno UI Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-gouno-ui-migration.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Gouno UI branch, tag, or commit
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: bootstrap-gouno-ui-migration
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Vendor canonical Gouno UI and preserve legacy root
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gouno Blog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout Gouno UI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: rushairer/gouno-ui
          ref: ${{ inputs.ref || 'main' }}
          path: .gouno-ui
          persist-credentials: false

      - name: Setup Node.js 24 for Gouno UI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .gouno-ui/package-lock.json

      - name: Build and verify Gouno UI
        working-directory: .gouno-ui
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Pack canonical Gouno UI and record provenance
        shell: bash
        run: |
          set -euo pipefail
          VENDOR="$GITHUB_WORKSPACE/blog-frontend/vendor"
          CANONICAL="$VENDOR/gouno-ui-canonical-0.1.0.tgz"
          cp "$VENDOR/ui-manifest.json" "$VENDOR/legacy-ui-manifest.json"
          rm -f "$CANONICAL"

          PACK_JSON="$(cd .gouno-ui && npm pack --json)"
          PACK_FILE="$(printf '%s' "$PACK_JSON" | node --input-type=module -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const value = JSON.parse(s); if (!value[0]?.filename) process.exit(1); process.stdout.write(value[0].filename); });')"
          cp ".gouno-ui/$PACK_FILE" "$CANONICAL"

          GOUNO_UI_SHA="$(git -C .gouno-ui rev-parse HEAD)"
          SHA256="$(sha256sum "$CANONICAL" | awk '{print $1}')"
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$CANONICAL" | openssl base64 -A)"

          cat > "$VENDOR/gouno-ui-source.txt" <<EOF
          repository=https://github.com/rushairer/gouno-ui
          ref=${{ inputs.ref || 'main' }}
          sha=$GOUNO_UI_SHA
          EOF

          node --input-type=module - "$VENDOR/ui-manifest.json" "$SHA256" "$INTEGRITY" "$GOUNO_UI_SHA" <<'EOF'
          import { writeFile } from 'node:fs/promises';
          const [, , path, sha256, integrity, sourceSha] = process.argv;
          const manifest = {
            name: '@gouno/ui',
            version: '0.1.0',
            archive: 'gouno-ui-canonical-0.1.0.tgz',
            sha256,
            integrity,
            source: 'rushairer/gouno-ui',
            sourceSha,
          };
          await writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`);
          EOF

      - name: Prepare dual-package migration bridge
        working-directory: blog-frontend
        run: |
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';

          const packagePath = './package.json';
          const manifest = JSON.parse(await readFile(packagePath, 'utf8'));
          manifest.dependencies['@gouno/ui'] = 'file:vendor/gouno-ui-canonical-0.1.0.tgz';
          manifest.dependencies['@gouno/ui-legacy'] = 'file:vendor/gouno-ui-0.1.0.tgz';
          await writeFile(packagePath, `${JSON.stringify(manifest, null, 2)}\n`);

          const tsconfigPath = './tsconfig.app.json';
          const tsconfig = JSON.parse(await readFile(tsconfigPath, 'utf8'));
          tsconfig.compilerOptions.paths = {
            ...(tsconfig.compilerOptions.paths || {}),
            '@gouno/ui': ['./node_modules/@gouno/ui-legacy/dist/index.d.ts'],
          };
          await writeFile(tsconfigPath, `${JSON.stringify(tsconfig, null, 2)}\n`);

          const vitePath = './vite.config.ts';
          let vite = await readFile(vitePath, 'utf8');
          const marker = "  plugins: [tailwindcss(), react()],\n";
          if (!vite.includes("@gouno/ui-legacy")) {
            if (!vite.includes(marker)) throw new Error('unable to locate Vite plugin marker');
            vite = vite.replace(
              marker,
              `${marker}  resolve: {\n    alias: [{ find: /^@gouno\\/ui$/, replacement: '@gouno/ui-legacy' }],\n  },\n`,
            );
            await writeFile(vitePath, vite);
          }
          EOF

      - name: Setup Node.js 20 for Blog frontend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Refresh lockfile and verify migration bridge
        working-directory: blog-frontend
        run: |
          set -euo pipefail
          rm -rf node_modules
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          if (lock.packages) {
            delete lock.packages['node_modules/@gouno/ui'];
            delete lock.packages['node_modules/@gouno/ui-legacy'];
          }
          await writeFile('./package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          EOF
          npm install --package-lock-only --ignore-scripts
          npm ci
          node --input-type=module <<'EOF'
          const core = await import('@gouno/ui/core');
          const patterns = await import('@gouno/ui/patterns');
          const gouno = await import('@gouno/ui/gouno');
          const legacy = await import('@gouno/ui-legacy');
          for (const [owner, mod, names] of [
            ['core', core, ['Button', 'Card', 'Alert']],
            ['patterns', patterns, ['BulkActionBar']],
            ['gouno', gouno, ['AppShell', 'PageContainer', 'PageHeader']],
            ['legacy', legacy, ['AdminPage', 'AdminPageHeader', 'AsyncState']],
          ]) {
            for (const name of names) {
              if (!mod[name]) throw new Error(`${owner} package is missing ${name}`);
            }
          }
          EOF
          npm run quality

      - name: Commit bootstrapped migration bridge
        shell: bash
        run: |
          set -euo pipefail
          git add \
            blog-frontend/vendor/gouno-ui-canonical-0.1.0.tgz \
            blog-frontend/vendor/gouno-ui-source.txt \
            blog-frontend/vendor/ui-manifest.json \
            blog-frontend/vendor/legacy-ui-manifest.json \
            blog-frontend/package.json \
            blog-frontend/package-lock.json \
            blog-frontend/tsconfig.app.json \
            blog-frontend/vite.config.ts
          if git diff --cached --quiet; then
            echo "Gouno UI migration bridge is already bootstrapped."
            exit 0
          fi
          GOUNO_UI_SHA="$(git -C .gouno-ui rev-parse --short=12 HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ui): bootstrap gouno ui ${GOUNO_UI_SHA}"
          git push origin HEAD:main

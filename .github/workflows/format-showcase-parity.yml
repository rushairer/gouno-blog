name: Format Showcase parity branch

on:
  push:
    branches:
      - ui/showcase-parity-hardening-20260913

permissions:
  contents: write

concurrency:
  group: format-showcase-parity
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ui/showcase-parity-hardening-20260913

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Format frontend sources
        working-directory: blog-frontend
        run: npm run format

      - name: Remove one-shot formatter workflow
        run: rm .github/workflows/format-showcase-parity.yml

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ui): format showcase parity changes"
          git push origin HEAD:ui/showcase-parity-hardening-20260913

name: Parity Format Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Format touched source files
        working-directory: blog-frontend
        run: npx prettier --write src/pages/admin/Comments.tsx src/pages/admin/Dashboard.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No format diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/admin/Comments.tsx blog-frontend/src/pages/admin/Dashboard.tsx
          git commit -m "style(ui): format parity hardening changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

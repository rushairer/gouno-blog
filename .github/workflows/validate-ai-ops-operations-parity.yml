name: Validate AI Operations Review Parity

on:
  push:
    branches:
      - ui/blog-admin-final-parity-ai-ops-operations

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - working-directory: blog-frontend
        run: npm ci
      - working-directory: blog-frontend
        run: npx prettier --write src/components/agent/OperationsWorkspace.tsx src/components/agent/__tests__/OperationsWorkspace.test.tsx
      - working-directory: blog-frontend
        run: npm run test:run -- src/components/agent/__tests__/OperationsWorkspace.test.tsx
      - working-directory: blog-frontend
        run: npx tsc -b
      - name: Commit verified formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add blog-frontend/src/components/agent/OperationsWorkspace.tsx blog-frontend/src/components/agent/__tests__/OperationsWorkspace.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ui): format AI Operations review parity"
          git push origin HEAD:ui/blog-admin-final-parity-ai-ops-operations

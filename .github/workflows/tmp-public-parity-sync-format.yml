name: Temporary Public Parity Sync Format

on:
  push:
    branches:
      - hardening/blog-public-account-parity

permissions:
  contents: write

jobs:
  sync-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/blog-public-account-parity
          fetch-depth: 0
      - name: Merge current main without discarding parallel work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Format Public and Account hardening sources
        working-directory: blog-frontend
        run: |
          npx prettier --write \
            src/components/MarkdownRenderer.tsx \
            src/components/reading/DiscoveryIndexLoading.tsx \
            src/layouts/PublicShell.tsx \
            src/pages/AccountNotifications.tsx \
            src/pages/Archive.tsx \
            src/pages/Categories.tsx \
            src/pages/CustomPageView.tsx \
            src/pages/PostDetail.tsx \
            src/pages/Tags.tsx
      - name: Commit synchronized formatted branch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-public-parity-sync-format.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No sync or formatting changes required"
          else
            git commit -m "style(ui): sync and format public parity hardening"
          fi
          git push origin HEAD:hardening/blog-public-account-parity

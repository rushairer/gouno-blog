name: PostVersion restore ownership staging

on:
  push:
    branches:
      - refactor/postversion-restore-ownership

permissions:
  contents: write

jobs:
  converge-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Apply PostVersion restore ownership convergence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          backend = root / "blog-backend"

          (backend / "internal" / "post" / "restore.go").write_text(r'''package post

          import (
          	"time"

          	"github.com/rushairer/blog-backend/internal/domain"
          )

          // RestoreSnapshot is the Post-owned command used by cross-capability
          // coordinators to restore Post state without exposing Post persistence.
          type RestoreSnapshot struct {
          	Title          string
          	Slug           string
          	Summary        string
          	Content        string
          	Tags           []string
          	CategoryID     *int64
          	CoverURL       string
          	CoverAlt       string
          	SEOTitle       string
          	SEODescription string
          	Status         domain.PostStatus
          	PublishedAt    *time.Time
          	ScheduledAt    *time.Time
          }
          '''.replace("          ", ""))

          (backend / "internal" / "postversion" / "coordinator.go").write_text(r'''package postversion

          import (
          	"context"
          	"database/sql"

          	"github.com/rushairer/blog-backend/internal/domain"
          	postcapability "github.com/rushairer/blog-backend/internal/post"
          )

          // TransactionRunner is the narrow transaction boundary required by restore.
          // Production composition supplies *dbtx.Transactor.
          type TransactionRunner interface {
          	Run(context.Context, func(*sql.Tx) error) error
          }

          // VersionSnapshotReader exposes only PostVersion-owned snapshot reads inside
          // a caller-owned transaction.
          type VersionSnapshotReader interface {
          	GetVersionTx(context.Context, *sql.Tx, int64, int64) (*domain.PostVersion, error)
          }

          // PostRestoreWriter exposes only the Post-owned restore write inside a
          // caller-owned transaction.
          type PostRestoreWriter interface {
          	RestoreSnapshotTx(context.Context, *sql.Tx, int64, postcapability.RestoreSnapshot) (*domain.Post, error)
          }

          // RestoreCoordinator owns the atomic PostVersion-read -> Post-write use case.
          // Repositories remain capability-local and never call each other.
          type RestoreCoordinator struct {
          	transactor TransactionRunner
          	versions   VersionSnapshotReader
          	posts      PostRestoreWriter
          }

          func NewRestoreCoordinator(transactor TransactionRunner, versions VersionSnapshotReader, posts PostRestoreWriter) *RestoreCoordinator {
          	return &RestoreCoordinator{transactor: transactor, versions: versions, posts: posts}
          }

          func (c *RestoreCoordinator) RestoreVersion(ctx context.Context, postID, versionID int64) (*domain.Post, error) {
          	var restored *domain.Post
          	err := c.transactor.Run(ctx, func(tx *sql.Tx) error {
          		version, err := c.versions.GetVersionTx(ctx, tx, postID, versionID)
          		if err != nil {
          			return err
          		}
          		restored, err = c.posts.RestoreSnapshotTx(ctx, tx, postID, postcapability.RestoreSnapshot{
          			Title:          version.Title,
          			Slug:           version.Slug,
          			Summary:        version.Summary,
          			Content:        version.Content,
          			Tags:           version.Tags,
          			CategoryID:     version.CategoryID,
          			CoverURL:       version.CoverURL,
          			CoverAlt:       version.CoverAlt,
          			SEOTitle:       version.SEOTitle,
          			SEODescription: version.SEODescription,
          			Status:         version.Status,
          			PublishedAt:    version.PublishedAt,
          			ScheduledAt:    version.ScheduledAt,
          		})
          		return err
          	})
          	return restored, err
          }
          '''.replace("          ", ""))

          (backend / "internal" / "postversion" / "repository" / "repository.go").write_text(r'''package repository

          import (
          	"context"
          	"database/sql"

          	"github.com/lib/pq"
          	"github.com/rushairer/blog-backend/internal/domain"
          )

          type Repository interface {
          	ListVersions(context.Context, int64) ([]*domain.PostVersion, error)
          	GetVersionTx(context.Context, *sql.Tx, int64, int64) (*domain.PostVersion, error)
          }

          type PostgresRepository struct {
          	db *sql.DB
          }

          func New(db *sql.DB) Repository {
          	return &PostgresRepository{db: db}
          }

          type rowScanner interface {
          	Scan(...any) error
          }

          func scanVersion(scanner rowScanner) (*domain.PostVersion, error) {
          	var version domain.PostVersion
          	err := scanner.Scan(&version.ID, &version.PostID, &version.Title, &version.Slug, &version.Summary,
          		&version.Content, pq.Array(&version.Tags), &version.CategoryID, &version.CoverURL, &version.CoverAlt,
          		&version.SEOTitle, &version.SEODescription, &version.Status, &version.PublishedAt,
          		&version.ScheduledAt, &version.CreatedAt)
          	return &version, err
          }

          func (r *PostgresRepository) ListVersions(ctx context.Context, postID int64) ([]*domain.PostVersion, error) {
          	rows, err := r.db.QueryContext(ctx, `SELECT id, post_id, title, slug, summary, content, tags, category_id,
          		COALESCE(cover_url, ''), COALESCE(cover_alt, ''), COALESCE(seo_title, ''), COALESCE(seo_description, ''), status,
          		published_at, scheduled_at, created_at
          		FROM post_versions WHERE post_id = $1 ORDER BY created_at DESC, id DESC LIMIT 50`, postID)
          	if err != nil {
          		return nil, err
          	}
          	defer rows.Close()

          	versions := make([]*domain.PostVersion, 0)
          	for rows.Next() {
          		version, err := scanVersion(rows)
          		if err != nil {
          			return nil, err
          		}
          		versions = append(versions, version)
          	}
          	return versions, rows.Err()
          }

          // GetVersionTx reads and locks the PostVersion-owned snapshot in the
          // coordinator's transaction. It never writes Post-owned state.
          func (r *PostgresRepository) GetVersionTx(ctx context.Context, tx *sql.Tx, postID, versionID int64) (*domain.PostVersion, error) {
          	return scanVersion(tx.QueryRowContext(ctx, `SELECT id, post_id, title, slug, summary, content, tags, category_id,
          		COALESCE(cover_url, ''), COALESCE(cover_alt, ''), COALESCE(seo_title, ''), COALESCE(seo_description, ''), status,
          		published_at, scheduled_at, created_at
          		FROM post_versions WHERE post_id = $1 AND id = $2 FOR SHARE`, postID, versionID))
          }
          '''.replace("          ", ""))

          post_repo_path = backend / "internal" / "post" / "repository" / "post_repository.go"
          post_repo = post_repo_path.read_text()
          import_marker = '\t"github.com/lib/pq"\n\t"github.com/rushairer/blog-backend/internal/domain"\n'
          assert import_marker in post_repo
          post_repo = post_repo.replace(import_marker, '\t"github.com/lib/pq"\n\tpostcapability "github.com/rushairer/blog-backend/internal/post"\n\t"github.com/rushairer/blog-backend/internal/domain"\n', 1)
          delete_marker = 'func (r *PostRepository) Delete(ctx context.Context, id int64) error {'
          assert delete_marker in post_repo
          restore_method = r'''// RestoreSnapshotTx applies a Post-owned restore command inside a caller-owned
          // transaction. Cross-capability coordinators may call this port, but Post SQL
          // remains owned by the Post repository.
          func (r *PostRepository) RestoreSnapshotTx(ctx context.Context, tx *sql.Tx, postID int64, snapshot postcapability.RestoreSnapshot) (*domain.Post, error) {
          	row := tx.QueryRowContext(ctx, `UPDATE posts SET
          		title = $2, slug = $3, summary = $4, content = $5, tags = $6,
          		category_id = $7, cover_url = $8, cover_alt = $9,
          		seo_title = $10, seo_description = $11,
          		status = $12, published_at = $13, scheduled_at = $14, updated_at = NOW()
          		WHERE id = $1
          		RETURNING id, title, slug, summary, content, tags, status,
          			views_count, likes_count, published_at, scheduled_at,
          			created_by_principal_id, updated_by_principal_id, created_at, updated_at`,
          		postID, snapshot.Title, snapshot.Slug, snapshot.Summary, snapshot.Content, pq.Array(snapshot.Tags),
          		snapshot.CategoryID, snapshot.CoverURL, snapshot.CoverAlt, snapshot.SEOTitle, snapshot.SEODescription,
          		snapshot.Status, snapshot.PublishedAt, snapshot.ScheduledAt)
          	var restored domain.Post
          	err := row.Scan(&restored.ID, &restored.Title, &restored.Slug, &restored.Summary, &restored.Content, pq.Array(&restored.Tags),
          		&restored.Status, &restored.ViewsCount, &restored.LikesCount, &restored.PublishedAt, &restored.ScheduledAt,
          		&restored.CreatedByPrincipalID, &restored.UpdatedByPrincipalID, &restored.CreatedAt, &restored.UpdatedAt)
          	if err != nil {
          		return nil, err
          	}
          	return &restored, nil
          }

          '''.replace("          ", "")
          post_repo = post_repo.replace(delete_marker, restore_method + delete_marker, 1)
          post_repo_path.write_text(post_repo)

          (backend / "internal" / "postversion" / "service" / "service.go").write_text(r'''package service

          import (
          	"context"
          	"database/sql"
          	"errors"

          	"github.com/rushairer/blog-backend/internal/domain"
          )

          var (
          	ErrPostNotFound   = errors.New("文章不存在或已被删除")
          	ErrInvalidPostID  = errors.New("invalid post id")
          	ErrInvalidVersion = errors.New("invalid version")
          )

          type Service interface {
          	ListVersions(context.Context, int64) ([]*domain.PostVersion, error)
          	RestoreVersion(context.Context, int64, int64) (*domain.Post, error)
          }

          type VersionReader interface {
          	ListVersions(context.Context, int64) ([]*domain.PostVersion, error)
          }

          type Restorer interface {
          	RestoreVersion(context.Context, int64, int64) (*domain.Post, error)
          }

          type postVersionService struct {
          	versions VersionReader
          	restorer Restorer
          }

          func New(versions VersionReader, restorer Restorer) Service {
          	return &postVersionService{versions: versions, restorer: restorer}
          }

          func (s *postVersionService) ListVersions(ctx context.Context, postID int64) ([]*domain.PostVersion, error) {
          	if postID <= 0 {
          		return nil, ErrInvalidPostID
          	}
          	return s.versions.ListVersions(ctx, postID)
          }

          func (s *postVersionService) RestoreVersion(ctx context.Context, postID, versionID int64) (*domain.Post, error) {
          	if postID <= 0 || versionID <= 0 {
          		return nil, ErrInvalidVersion
          	}
          	post, err := s.restorer.RestoreVersion(ctx, postID, versionID)
          	if errors.Is(err, sql.ErrNoRows) {
          		return nil, ErrPostNotFound
          	}
          	return post, err
          }
          '''.replace("          ", ""))

          (backend / "internal" / "postversion" / "service" / "service_test.go").write_text(r'''package service

          import (
          	"context"
          	"database/sql"
          	"errors"
          	"testing"

          	"github.com/rushairer/blog-backend/internal/domain"
          )

          type fakeVersionReader struct {
          	versions []*domain.PostVersion
          	err      error
          	postID   int64
          }

          func (f *fakeVersionReader) ListVersions(_ context.Context, postID int64) ([]*domain.PostVersion, error) {
          	f.postID = postID
          	return f.versions, f.err
          }

          type fakeRestorer struct {
          	restored  *domain.Post
          	err       error
          	postID    int64
          	versionID int64
          }

          func (f *fakeRestorer) RestoreVersion(_ context.Context, postID, versionID int64) (*domain.Post, error) {
          	f.postID = postID
          	f.versionID = versionID
          	return f.restored, f.err
          }

          func TestListVersionsValidatesPostID(t *testing.T) {
          	svc := New(&fakeVersionReader{}, &fakeRestorer{})
          	_, err := svc.ListVersions(context.Background(), 0)
          	if !errors.Is(err, ErrInvalidPostID) {
          		t.Fatalf("err=%v, want ErrInvalidPostID", err)
          	}
          }

          func TestListVersionsDelegatesToRepository(t *testing.T) {
          	reader := &fakeVersionReader{versions: []*domain.PostVersion{{ID: 7, PostID: 3}}}
          	svc := New(reader, &fakeRestorer{})
          	versions, err := svc.ListVersions(context.Background(), 3)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if reader.postID != 3 || len(versions) != 1 || versions[0].ID != 7 {
          		t.Fatalf("unexpected delegation: postID=%d versions=%#v", reader.postID, versions)
          	}
          }

          func TestRestoreVersionValidatesIdentifiers(t *testing.T) {
          	svc := New(&fakeVersionReader{}, &fakeRestorer{})
          	for _, tc := range []struct {
          		postID    int64
          		versionID int64
          	}{{0, 1}, {1, 0}, {-1, 2}} {
          		_, err := svc.RestoreVersion(context.Background(), tc.postID, tc.versionID)
          		if !errors.Is(err, ErrInvalidVersion) {
          			t.Fatalf("RestoreVersion(%d,%d) err=%v, want ErrInvalidVersion", tc.postID, tc.versionID, err)
          		}
          	}
          }

          func TestRestoreVersionMapsMissingSnapshotToPostNotFound(t *testing.T) {
          	svc := New(&fakeVersionReader{}, &fakeRestorer{err: sql.ErrNoRows})
          	_, err := svc.RestoreVersion(context.Background(), 3, 9)
          	if !errors.Is(err, ErrPostNotFound) {
          		t.Fatalf("err=%v, want ErrPostNotFound", err)
          	}
          }

          func TestRestoreVersionReturnsRestoredPost(t *testing.T) {
          	restorer := &fakeRestorer{restored: &domain.Post{ID: 3, Title: "restored"}}
          	svc := New(&fakeVersionReader{}, restorer)
          	post, err := svc.RestoreVersion(context.Background(), 3, 9)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if restorer.postID != 3 || restorer.versionID != 9 || post == nil || post.Title != "restored" {
          		t.Fatalf("unexpected restore: postID=%d versionID=%d post=%#v", restorer.postID, restorer.versionID, post)
          	}
          }
          '''.replace("          ", ""))

          (backend / "internal" / "postversion" / "repository" / "repository_integration_test.go").write_text(r'''package repository

          import (
          	"context"
          	"fmt"
          	"testing"
          	"time"

          	"github.com/rushairer/blog-backend/internal/testsupport"
          )

          func TestPostVersionRepositoryReadsOwnedSnapshots(t *testing.T) {
          	db := testsupport.OpenTestDB(t)
          	defer db.Close()
          	ctx := context.Background()
          	slug := fmt.Sprintf("postversion-integration-%d", time.Now().UnixNano())

          	var postID int64
          	if err := db.QueryRowContext(ctx, `INSERT INTO posts (title, slug, summary, content, tags, status, published_at)
          		VALUES ('Original title', $1, 'Summary', 'Original body', ARRAY['go', 'testing'], 'published', NOW()) RETURNING id`, slug).Scan(&postID); err != nil {
          		t.Fatal(err)
          	}
          	defer db.ExecContext(ctx, `DELETE FROM posts WHERE id = $1`, postID)

          	if _, err := db.ExecContext(ctx, `UPDATE posts SET title = 'Updated title', content = 'Updated body' WHERE id = $1`, postID); err != nil {
          		t.Fatal(err)
          	}

          	repo := New(db)
          	versions, err := repo.ListVersions(ctx, postID)
          	if err != nil || len(versions) != 1 || versions[0].Title != "Original title" {
          		t.Fatalf("version snapshot mismatch: versions=%#v err=%v", versions, err)
          	}

          	tx, err := db.BeginTx(ctx, nil)
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer tx.Rollback()
          	snapshot, err := repo.GetVersionTx(ctx, tx, postID, versions[0].ID)
          	if err != nil || snapshot.Title != "Original title" || snapshot.Content != "Original body" {
          		t.Fatalf("snapshot mismatch: version=%#v err=%v", snapshot, err)
          	}
          }
          '''.replace("          ", ""))

          (backend / "internal" / "postversion" / "coordinator_test.go").write_text(r'''package postversion

          import (
          	"context"
          	"database/sql"
          	"errors"
          	"testing"
          	"time"

          	"github.com/rushairer/blog-backend/internal/domain"
          	postcapability "github.com/rushairer/blog-backend/internal/post"
          )

          type fakeTransactionRunner struct {
          	err    error
          	called bool
          }

          func (f *fakeTransactionRunner) Run(ctx context.Context, fn func(*sql.Tx) error) error {
          	f.called = true
          	if f.err != nil {
          		return f.err
          	}
          	return fn(nil)
          }

          type fakeVersionSnapshotReader struct {
          	version   *domain.PostVersion
          	err       error
          	postID    int64
          	versionID int64
          }

          func (f *fakeVersionSnapshotReader) GetVersionTx(_ context.Context, _ *sql.Tx, postID, versionID int64) (*domain.PostVersion, error) {
          	f.postID = postID
          	f.versionID = versionID
          	return f.version, f.err
          }

          type fakePostRestoreWriter struct {
          	postID   int64
          	snapshot postcapability.RestoreSnapshot
          	result   *domain.Post
          	err      error
          	called   bool
          }

          func (f *fakePostRestoreWriter) RestoreSnapshotTx(_ context.Context, _ *sql.Tx, postID int64, snapshot postcapability.RestoreSnapshot) (*domain.Post, error) {
          	f.called = true
          	f.postID = postID
          	f.snapshot = snapshot
          	return f.result, f.err
          }

          func TestRestoreCoordinatorMapsVersionIntoPostOwnedCommand(t *testing.T) {
          	now := time.Now().UTC()
          	categoryID := int64(17)
          	version := &domain.PostVersion{
          		ID: 9, PostID: 3, Title: "old title", Slug: "old-slug", Summary: "old summary",
          		Content: "old body", Tags: []string{"go", "architecture"}, CategoryID: &categoryID,
          		CoverURL: "/cover.svg", CoverAlt: "cover", SEOTitle: "seo", SEODescription: "description",
          		Status: domain.PostStatusPublished, PublishedAt: &now, ScheduledAt: &now,
          	}
          	runner := &fakeTransactionRunner{}
          	versions := &fakeVersionSnapshotReader{version: version}
          	posts := &fakePostRestoreWriter{result: &domain.Post{ID: 3, Title: "old title"}}
          	coordinator := NewRestoreCoordinator(runner, versions, posts)

          	restored, err := coordinator.RestoreVersion(context.Background(), 3, 9)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if !runner.called || versions.postID != 3 || versions.versionID != 9 || !posts.called || posts.postID != 3 {
          		t.Fatalf("unexpected coordination: runner=%v version=(%d,%d) post=(%v,%d)", runner.called, versions.postID, versions.versionID, posts.called, posts.postID)
          	}
          	if posts.snapshot.Title != version.Title || posts.snapshot.Content != version.Content || posts.snapshot.CategoryID != version.CategoryID || posts.snapshot.SEOTitle != version.SEOTitle {
          		t.Fatalf("snapshot mapping mismatch: %#v", posts.snapshot)
          	}
          	if restored == nil || restored.ID != 3 || restored.Title != "old title" {
          		t.Fatalf("restored=%#v", restored)
          	}
          }

          func TestRestoreCoordinatorStopsBeforePostWriteWhenSnapshotReadFails(t *testing.T) {
          	want := errors.New("snapshot read failed")
          	posts := &fakePostRestoreWriter{}
          	coordinator := NewRestoreCoordinator(&fakeTransactionRunner{}, &fakeVersionSnapshotReader{err: want}, posts)
          	_, err := coordinator.RestoreVersion(context.Background(), 3, 9)
          	if !errors.Is(err, want) || posts.called {
          		t.Fatalf("err=%v postCalled=%v", err, posts.called)
          	}
          }
          '''.replace("          ", ""))

          (backend / "internal" / "postversion" / "coordinator_integration_test.go").write_text(r'''package postversion

          import (
          	"context"
          	"fmt"
          	"testing"
          	"time"

          	postrepository "github.com/rushairer/blog-backend/internal/post/repository"
          	postversionrepository "github.com/rushairer/blog-backend/internal/postversion/repository"
          	"github.com/rushairer/blog-backend/internal/dbtx"
          	"github.com/rushairer/blog-backend/internal/testsupport"
          	"go.uber.org/zap"
          )

          func TestRestoreCoordinatorKeepsVersionReadAndPostWriteAtomic(t *testing.T) {
          	db := testsupport.OpenTestDB(t)
          	defer db.Close()
          	ctx := context.Background()
          	slug := fmt.Sprintf("postversion-coordinator-%d", time.Now().UnixNano())

          	var postID int64
          	if err := db.QueryRowContext(ctx, `INSERT INTO posts (title, slug, summary, content, tags, status, published_at)
          		VALUES ('Original title', $1, 'Summary', 'Original body', ARRAY['go', 'testing'], 'published', NOW()) RETURNING id`, slug).Scan(&postID); err != nil {
          		t.Fatal(err)
          	}
          	defer db.ExecContext(ctx, `DELETE FROM posts WHERE id = $1`, postID)

          	if _, err := db.ExecContext(ctx, `UPDATE posts SET title = 'Updated title', content = 'Updated body' WHERE id = $1`, postID); err != nil {
          		t.Fatal(err)
          	}

          	versions := postversionrepository.New(db)
          	items, err := versions.ListVersions(ctx, postID)
          	if err != nil || len(items) != 1 {
          		t.Fatalf("versions=%#v err=%v", items, err)
          	}
          	posts := postrepository.NewPostRepository(db)
          	coordinator := NewRestoreCoordinator(dbtx.NewTransactor(db, zap.NewNop()), versions, posts)
          	restored, err := coordinator.RestoreVersion(ctx, postID, items[0].ID)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if restored.Title != "Original title" || restored.Content != "Original body" {
          		t.Fatalf("restore mismatch: %#v", restored)
          	}

          	var title, content string
          	if err := db.QueryRowContext(ctx, `SELECT title, content FROM posts WHERE id = $1`, postID).Scan(&title, &content); err != nil {
          		t.Fatal(err)
          	}
          	if title != "Original title" || content != "Original body" {
          		t.Fatalf("persisted restore mismatch: title=%q content=%q", title, content)
          	}
          }
          '''.replace("          ", ""))

          (backend / "internal" / "postversion" / "ownership_test.go").write_text(r'''package postversion

          import (
          	"os"
          	"strings"
          	"testing"
          )

          func TestPostVersionRepositoryDoesNotOwnPostWritesOrTransactions(t *testing.T) {
          	data, err := os.ReadFile("repository/repository.go")
          	if err != nil {
          		t.Fatal(err)
          	}
          	text := string(data)
          	for _, forbidden := range []string{"BeginTx(", "UPDATE posts", "RestoreVersion("} {
          		if strings.Contains(text, forbidden) {
          			t.Errorf("PostVersion repository still owns cross-capability restore behavior %q", forbidden)
          		}
          	}
          	if !strings.Contains(text, "GetVersionTx(") {
          		t.Fatal("PostVersion transaction-aware snapshot reader is missing")
          	}
          }

          func TestPostRepositoryOwnsRestoreWritePort(t *testing.T) {
          	data, err := os.ReadFile("../post/repository/post_repository.go")
          	if err != nil {
          		t.Fatal(err)
          	}
          	text := string(data)
          	if !strings.Contains(text, "RestoreSnapshotTx(") || !strings.Contains(text, "UPDATE posts SET") {
          		t.Fatal("Post repository does not own the restore write port")
          	}
          }

          func TestRestoreCoordinatorOwnsTransactionScope(t *testing.T) {
          	data, err := os.ReadFile("coordinator.go")
          	if err != nil {
          		t.Fatal(err)
          	}
          	text := string(data)
          	if !strings.Contains(text, "c.transactor.Run(") || !strings.Contains(text, "c.versions.GetVersionTx(") || !strings.Contains(text, "c.posts.RestoreSnapshotTx(") {
          		t.Fatal("restore coordinator does not own the expected transaction orchestration")
          	}
          }
          '''.replace("          ", ""))

          (backend / "cmd" / "gouno" / "postversion_composition.go").write_text(r'''package gouno

          import (
          	"database/sql"

          	"github.com/rushairer/blog-backend/internal/dbtx"
          	postrepository "github.com/rushairer/blog-backend/internal/post/repository"
          	"github.com/rushairer/blog-backend/internal/postversion"
          	postversionrepository "github.com/rushairer/blog-backend/internal/postversion/repository"
          	postversionservice "github.com/rushairer/blog-backend/internal/postversion/service"
          )

          func newPostVersionService(db *sql.DB, transactor *dbtx.Transactor, posts *postrepository.PostRepository) postversionservice.Service {
          	versions := postversionrepository.New(db)
          	restorer := postversion.NewRestoreCoordinator(transactor, versions, posts)
          	return postversionservice.New(versions, restorer)
          }
          '''.replace("          ", ""))

          web_path = backend / "cmd" / "gouno" / "web.go"
          web = web_path.read_text()
          old = "\tpostVersionSvc := newPostVersionService(cfg.DB)\n"
          new = "\tpostVersionSvc := newPostVersionService(cfg.DB, transactor, postRepo)\n"
          assert old in web
          web_path.write_text(web.replace(old, new, 1))

          router_test_path = backend / "router" / "web_test.go"
          router_test = router_test_path.read_text()
          router_test = router_test.replace('import (\n\t"net/http"', 'import (\n\t"context"\n\t"net/http"', 1)
          domain_import = '\tcommunityservice "github.com/rushairer/blog-backend/internal/community/service"\n'
          assert domain_import in router_test
          router_test = router_test.replace(domain_import, domain_import + '\t"github.com/rushairer/blog-backend/internal/domain"\n', 1)
          test_marker = 'func TestRegisterWebRouterDoesNotConflictOnPostWildcards(t *testing.T) {'
          assert test_marker in router_test
          stub = '''type routerPostVersionRestorer struct{}\n\nfunc (routerPostVersionRestorer) RestoreVersion(context.Context, int64, int64) (*domain.Post, error) {\n\treturn nil, nil\n}\n\n'''
          router_test = router_test.replace(test_marker, stub + test_marker, 1)
          old_ctor = 'PostVersionSvc:    postversionservice.New(postversionrepository.New(nil)),'
          assert old_ctor in router_test
          router_test = router_test.replace(old_ctor, 'PostVersionSvc:    postversionservice.New(postversionrepository.New(nil), routerPostVersionRestorer{}),', 1)
          router_test_path.write_text(router_test)

          architecture_path = backend / "ARCHITECTURE.md"
          architecture = architecture_path.read_text()
          old_arch = "Post Version persistence, business behavior, and active HTTP ownership are fully canonical under `internal/postversion/{repository,service,controller}`. The repository currently owns version listing and transactional restore persistence, with direct integration coverage under the capability. Restore also writes Post-owned state: this cross-capability persistence boundary remains convergence debt and must be addressed by an application coordinator plus a Post transaction port, without weakening atomicity. The service owns identifier validation and missing-version error semantics. The application composition root constructs the canonical Post Version service directly, `WebRouterOptions.PostVersionSvc` carries it explicitly, and both `/api/admin/posts/:id/versions` and `/api/admin/posts/:id/versions/:versionID/restore` bind to the canonical Post Version controller while preserving the existing `PostPolicy` authorization checks. Shared HTTP error mapping recognizes canonical Post Version sentinels. Agent Approval depends only on a narrow `postVersionReader` contract for the version lookup it actually needs instead of depending on an aggregate service."
          new_arch = "Post Version persistence, business behavior, and active HTTP ownership are fully canonical under `internal/postversion/{repository,service,controller}`. Version listing and snapshot reads remain PostVersion-owned. Restore is coordinated by `postversion.RestoreCoordinator`, which owns the shared `dbtx.Transactor` scope, reads the immutable version snapshot through `GetVersionTx`, and applies it through the Post-owned `RestoreSnapshotTx` port. PostVersion persistence no longer starts the restore transaction or writes the `posts` table, while restore remains atomic. The service owns identifier validation and missing-version error semantics. The application composition root constructs the canonical Post Version service and restore coordinator from the shared transaction infrastructure and canonical Post repository, `WebRouterOptions.PostVersionSvc` carries the service explicitly, and both `/api/admin/posts/:id/versions` and `/api/admin/posts/:id/versions/:versionID/restore` bind to the canonical Post Version controller while preserving the existing `PostPolicy` authorization checks and response shape. Shared HTTP error mapping recognizes canonical Post Version sentinels. Agent Approval depends only on a narrow `postVersionReader` contract for the version lookup it actually needs instead of depending on an aggregate service."
          assert old_arch in architecture
          architecture_path.write_text(architecture.replace(old_arch, new_arch, 1))

          convergence_path = backend / "ARCHITECTURE_CONVERGENCE.md"
          convergence = convergence_path.read_text()
          old_row = "| **PostVersion** | Post version history/restore; `post_versions` | `internal/postversion/{repository,service,controller}` | Approval uses narrow `postVersionReader`. | PostVersion repository owns transactional restore. | **Canonical implementation; remaining contracts tracked below.** |"
          new_row = "| **PostVersion** | Post version history/restore; `post_versions` | `internal/postversion/{repository,service,controller}` plus `internal/postversion.RestoreCoordinator` | Approval uses narrow `postVersionReader`; restore writes Post state only through the Post-owned `RestoreSnapshotTx` port. | `RestoreCoordinator` owns the atomic snapshot-read/Post-write transaction through `dbtx.Transactor`; repositories receive the caller transaction. | **Canonical implementation; restore ownership converged.** |"
          assert old_row in convergence
          convergence = convergence.replace(old_row, new_row, 1)
          old_debt = "- **PostVersion restore — ownership debt:** `postversion/repository.RestoreVersion` starts a transaction that writes Post-owned state and version history. The operation is cohesive, but that alone does not settle persistence ownership. A later Post/PostVersion coordinator slice must keep restore atomic while moving Post writes behind a Post-owned transaction port. Do not mark this cross-capability contract complete."
          new_debt = "- **PostVersion restore:** `internal/postversion.RestoreCoordinator` owns the `dbtx.Transactor` scope. The PostVersion repository locks/reads only its `post_versions` snapshot through `GetVersionTx`; the Post repository applies the Post-owned `RestoreSnapshotTx` command. Repositories do not call each other and the restore remains atomic."
          assert old_debt in convergence
          convergence = convergence.replace(old_debt, new_debt, 1)
          completed = "and **Knowledge HTTP ownership convergence** now use canonical ownership boundaries"
          assert completed in convergence
          convergence = convergence.replace(completed, "and **Knowledge HTTP ownership convergence**, and **PostVersion restore ownership convergence** now use canonical ownership boundaries", 1)
          anchor = "### Knowledge HTTP ownership convergence — 2026-09-14\n"
          assert anchor in convergence
          section = """### PostVersion restore ownership convergence — 2026-09-14\n\n- `internal/postversion.RestoreCoordinator` owns the atomic restore transaction through the shared `dbtx.Transactor`.\n- `internal/postversion/repository` now reads/locks only `post_versions`; it no longer starts restore transactions or writes `posts`.\n- `internal/post/repository.PostRepository.RestoreSnapshotTx` owns the Post write and receives a Post-owned restore command rather than a PostVersion repository dependency.\n- Composition root reuses the canonical Post repository and shared transactor. Existing routes, `PostPolicy` authorization, service errors and restore response shape are unchanged.\n- Connector, Access, Auth BFF and shared-domain placement are unchanged.\n\n\n"""
          convergence = convergence.replace(anchor, section + anchor, 1)
          convergence_path.write_text(convergence)
          PY

      - name: Format
        working-directory: blog-backend
        run: gofmt -w internal/post/restore.go internal/post/repository/post_repository.go internal/postversion cmd/gouno/postversion_composition.go cmd/gouno/web.go router/web_test.go

      - name: Focused tests
        working-directory: blog-backend
        run: go test ./internal/postversion/... ./internal/post/... ./cmd/gouno ./router

      - name: Focused vet
        working-directory: blog-backend
        run: go vet ./internal/postversion/... ./internal/post/... ./cmd/gouno ./router

      - name: Ownership guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          repo = Path("blog-backend/internal/postversion/repository/repository.go").read_text()
          assert "UPDATE posts" not in repo
          assert "BeginTx(" not in repo
          assert "RestoreVersion(" not in repo
          assert "GetVersionTx(" in repo
          post_repo = Path("blog-backend/internal/post/repository/post_repository.go").read_text()
          assert "RestoreSnapshotTx(" in post_repo
          coordinator = Path("blog-backend/internal/postversion/coordinator.go").read_text()
          assert "c.transactor.Run(" in coordinator
          assert "c.versions.GetVersionTx(" in coordinator
          assert "c.posts.RestoreSnapshotTx(" in coordinator
          PY

      - name: Commit validated source and self-clean
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm .github/workflows/postversion-restore-ownership-staging.yml
          git add blog-backend
          git commit -m "refactor(postversion): converge restore ownership"
          git push origin HEAD:refactor/postversion-restore-ownership

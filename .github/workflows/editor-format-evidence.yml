name: Editor Format Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'blog-frontend/src/components/editor/**'
      - 'blog-frontend/src/pages/admin/**'
      - '.github/workflows/editor-format-evidence.yml'

permissions:
  contents: read

concurrency:
  group: editor-format-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - run: npm ci
      - name: Format migrated editor sources
        run: npm run format
      - name: Retain formatted editor sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-editor-sources
          path: |
            blog-frontend/src/components/editor/editor-ai.ts
            blog-frontend/src/components/editor/EditorMediaSourceDialog.tsx
            blog-frontend/src/components/editor/EditorWritingDialog.tsx
            blog-frontend/src/pages/admin/__tests__/PageEditor.test.tsx
            blog-frontend/src/pages/admin/__tests__/PostEditor.test.tsx
            blog-frontend/src/pages/admin/Categories.tsx
            blog-frontend/src/pages/admin/PageEditor.tsx
            blog-frontend/src/pages/admin/PostEditor.tsx
          if-no-files-found: error
          retention-days: 1

name: Editor Format Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'blog-frontend/src/components/editor/**'
      - 'blog-frontend/src/pages/admin/**'
      - '.github/workflows/editor-format-evidence.yml'

permissions:
  contents: write

concurrency:
  group: editor-format-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
      - run: node --version && npm --version
      - run: npm ci
      - name: Format migrated editor sources
        run: npm run format
      - name: Commit formatting when needed
        working-directory: .
        run: |
          if git diff --quiet -- blog-frontend/src; then
            echo "Editor sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src
          git commit -m "style(editor): apply canonical formatting"
          git push origin HEAD:${{ github.head_ref }}

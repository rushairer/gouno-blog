name: Format Phase 34

on:
  push:
    branches:
      - ui/page-editor-canonical-phase34

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/page-editor-canonical-phase34
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Format PageEditor
        working-directory: blog-frontend
        run: npx prettier --write src/pages/admin/PageEditor.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet -- blog-frontend/src/pages/admin/PageEditor.tsx; then
            echo "PageEditor already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/admin/PageEditor.tsx
          git commit -m "style(ui): format page editor"
          git push origin HEAD:ui/page-editor-canonical-phase34

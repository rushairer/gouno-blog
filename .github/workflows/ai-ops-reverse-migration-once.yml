name: AI Ops Reverse Migration Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-ops-reverse-migration-once.yml"
      - ".github/scripts/ai_ops_reverse_migration_once.py"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Apply canonical AI Operations composition
        run: python3 .github/scripts/ai_ops_reverse_migration_once.py
      - name: Format transformed sources
        run: |
          npx --yes prettier@3.9.0 --write \
            blog-frontend/src/components/agent/OperationsPatterns.tsx \
            blog-frontend/src/components/agent/WorkspaceOverview.tsx \
            blog-frontend/src/components/agent/DecisionInboxWorkspace.tsx \
            blog-frontend/src/components/agent/WorkflowWorkspace.tsx \
            blog-frontend/src/components/agent/WorkflowRunRecords.tsx \
            blog-frontend/src/components/agent/AgentRunRecords.tsx \
            blog-frontend/src/pages/admin/AIOperations.tsx \
            blog-frontend/scripts/check-ai-ops-layout-contracts.mjs \
            docs/ui-redesign/migration.json \
            docs/ui-redesign/MIGRATION.md
      - name: Install Blog dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Verify reverse migration
        working-directory: blog-frontend
        run: |
          npm run format:check
          npm run lint:ui
          npx tsc -b
          npx vitest run \
            src/components/agent/__tests__/AgentRunRecords.test.tsx \
            src/components/agent/__tests__/DecisionInboxWorkspace.test.tsx \
            src/pages/admin/__tests__/AIOperations.test.tsx
          npm run build
      - name: Commit reverse migration and retire helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm -f \
            .github/workflows/ai-ops-reverse-migration-once.yml \
            .github/scripts/ai_ops_reverse_migration_once.py
          git add \
            blog-frontend/src/components/agent/OperationsPatterns.tsx \
            blog-frontend/src/components/agent/WorkspaceOverview.tsx \
            blog-frontend/src/components/agent/DecisionInboxWorkspace.tsx \
            blog-frontend/src/components/agent/WorkflowWorkspace.tsx \
            blog-frontend/src/components/agent/WorkflowRunRecords.tsx \
            blog-frontend/src/components/agent/AgentRunRecords.tsx \
            blog-frontend/src/pages/admin/AIOperations.tsx \
            blog-frontend/scripts/check-ai-ops-layout-contracts.mjs \
            docs/ui-redesign/migration.json \
            docs/ui-redesign/MIGRATION.md
          git commit -m "fix(ai-ops): complete canonical reverse migration"
          git push origin HEAD:main

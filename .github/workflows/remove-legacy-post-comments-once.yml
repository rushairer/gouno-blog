name: Remove legacy Post comment ownership once

on:
  push:
    branches:
      - refactor/remove-legacy-post-comments

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-legacy-post-comments
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum
      - name: Remove dead Post comment APIs and tests
        run: |
          python3 script/remove_legacy_post_comments_once.py
          gofmt -w \
            blog-backend/internal/service/post_service.go \
            blog-backend/internal/repository/post_repository.go \
            blog-backend/internal/controller/post_controller.go \
            blog-backend/internal/controllerutil/response.go \
            blog-backend/internal/service/post_service_test.go \
            blog-backend/internal/controller/post_controller_test.go
      - name: Verify focused backend packages
        working-directory: blog-backend
        run: |
          go test ./internal/service ./internal/controller ./internal/controllerutil ./internal/repository ./internal/community/... ./router
          go vet ./internal/service ./internal/controller ./internal/controllerutil ./internal/repository ./internal/community/... ./router
      - name: Commit cleanup and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-legacy-post-comments-once.yml script/remove_legacy_post_comments_once.py
          git add blog-backend/internal/service/post_service.go \
            blog-backend/internal/repository/post_repository.go \
            blog-backend/internal/controller/post_controller.go \
            blog-backend/internal/controllerutil/response.go \
            blog-backend/internal/service/post_service_test.go \
            blog-backend/internal/controller/post_controller_test.go
          git commit -m "refactor(community): remove legacy Post comment ownership"
          git push origin HEAD:refactor/remove-legacy-post-comments

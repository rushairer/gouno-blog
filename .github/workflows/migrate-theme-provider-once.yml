name: Migrate Blog ThemeProvider Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-theme-provider-once.yml

permissions:
  contents: write

concurrency:
  group: migrate-blog-theme-provider-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Apply canonical ThemeProvider migration and verify
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';

          const mainPath = 'blog-frontend/src/main.tsx';
          const legacyImport = 'import { ThemeProvider } from "@gouno/ui-legacy";';
          const canonicalImport = 'import { ThemeProvider } from "@gouno/ui/theme";';
          const source = await readFile(mainPath, 'utf8');
          if (!source.includes(legacyImport)) {
            throw new Error('Expected legacy ThemeProvider import was not found');
          }
          const nextSource = source.replace(legacyImport, canonicalImport);
          if (nextSource.includes(legacyImport)) {
            throw new Error('Legacy ThemeProvider import remains after replacement');
          }
          await writeFile(mainPath, nextSource);

          const allowlistPath = 'blog-frontend/scripts/legacy-ui-allowlist.json';
          const targetFile = 'src/main.tsx';
          const allowlist = JSON.parse(await readFile(allowlistPath, 'utf8'));
          allowlist.canonicalSourceSha = '0ba9fabda8e61f3a278b3fb5f37b8f671c167abb';
          let removedPairs = 0;
          for (const [symbol, files] of Object.entries(allowlist.allowedLegacyImports ?? {})) {
            const next = files.filter((file) => {
              if (file !== targetFile) return true;
              removedPairs += 1;
              return false;
            });
            if (next.length) allowlist.allowedLegacyImports[symbol] = next;
            else delete allowlist.allowedLegacyImports[symbol];
          }
          if (removedPairs !== 1) {
            throw new Error(`Expected exactly one legacy pair for src/main.tsx, removed ${removedPairs}`);
          }
          await writeFile(allowlistPath, `${JSON.stringify(allowlist, null, 2)}\n`);
          EOF

          cd blog-frontend
          npm ci
          npx prettier --write src/main.tsx scripts/legacy-ui-allowlist.json
          npm run quality
          cd ..
          docker build -f blog-frontend/Dockerfile blog-frontend

      - name: Commit verified migration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-theme-provider-once.yml

          if grep -n "@gouno/ui-legacy" blog-frontend/src/main.tsx; then
            echo "Application entry still imports legacy UI" >&2
            exit 1
          fi

          git add \
            blog-frontend/src/main.tsx \
            blog-frontend/scripts/legacy-ui-allowlist.json \
            .github/workflows/migrate-theme-provider-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ui): migrate Blog ThemeProvider to canonical Gouno UI"
          git push origin HEAD:main

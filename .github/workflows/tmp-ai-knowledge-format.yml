name: Temporary AI Knowledge Prettier

on:
  push:
    branches:
      - fix/ai-knowledge-prettier-20260920

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout formatter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ai-knowledge-prettier-20260920
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Apply repository Prettier
        working-directory: blog-frontend
        run: npx prettier --write src/components/agent/KnowledgeWorkspace.tsx src/pages/admin/__tests__/AISettings.test.tsx

      - name: Commit formatted files and remove temporary workflow
        run: |
          git rm .github/workflows/tmp-ai-knowledge-format.yml
          git add blog-frontend/src/components/agent/KnowledgeWorkspace.tsx blog-frontend/src/pages/admin/__tests__/AISettings.test.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(ai-settings): apply prettier to knowledge workspace"
          git push origin HEAD:fix/ai-knowledge-prettier-20260920

name: Format AI Ops Fix Once

on:
  push:
    branches:
      - fix/ai-ops-showcase-parity-closure
    paths:
      - .github/workflows/format-ai-ops-fix-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ai-ops-showcase-parity-closure
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Format touched AI Operations sources
        run: |
          npx --yes prettier@3.8.5 --write \
            blog-frontend/src/components/agent/AgentRunRecords.tsx \
            blog-frontend/src/components/agent/WorkspaceOverview.tsx \
            blog-frontend/src/pages/admin/AIOperations.tsx \
            blog-frontend/e2e/showcase-parity.pw.mjs \
            blog-frontend/scripts/check-ai-ops-layout-contracts.mjs \
            blog-frontend/scripts/check-ai-ops-showcase-parity.mjs
      - name: Commit formatting and retire formatter
        run: |
          set -euo pipefail
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm .github/workflows/format-ai-ops-fix-once.yml
          git add \
            blog-frontend/src/components/agent/AgentRunRecords.tsx \
            blog-frontend/src/components/agent/WorkspaceOverview.tsx \
            blog-frontend/src/pages/admin/AIOperations.tsx \
            blog-frontend/e2e/showcase-parity.pw.mjs \
            blog-frontend/scripts/check-ai-ops-layout-contracts.mjs \
            blog-frontend/scripts/check-ai-ops-showcase-parity.mjs
          git commit -m "style(ai-ops): format parity closure"
          git push origin HEAD:fix/ai-ops-showcase-parity-closure

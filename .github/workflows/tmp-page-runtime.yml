name: Temporary Page Runtime Ownership Migration

on:
  push:
    branches: [refactor/page-runtime-ownership]
    paths:
      - scripts/tmp-page-runtime-migration.py
      - .github/workflows/tmp-page-runtime.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/page-runtime-ownership
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Move Page runtime ownership to capability
        run: python3 scripts/tmp-page-runtime-migration.py

      - name: Format and verify backend
        run: |
          gofmt -w \
            blog-backend/router/web.go \
            blog-backend/router/web_test.go \
            blog-backend/cmd/gouno/web.go \
            blog-backend/internal/controller/feed_controller.go \
            blog-backend/internal/agent/approval.go \
            blog-backend/internal/tool/blog_tools.go \
            blog-backend/internal/controllerutil/response.go
          cd blog-backend
          go test ./...
          go vet ./...

      - name: Verify Page runtime no longer uses flat facades
        run: |
          if git grep -n 'service.NewPageService(repository.NewPageRepository' -- blog-backend/cmd blog-backend/router; then
            echo 'flat Page composition remains' >&2
            exit 1
          fi
          if git grep -n '\*service.PageService' -- \
            blog-backend/router \
            blog-backend/cmd \
            blog-backend/internal/controller/feed_controller.go \
            blog-backend/internal/agent/approval.go \
            blog-backend/internal/tool/blog_tools.go; then
            echo 'active runtime still depends on flat PageService alias' >&2
            exit 1
          fi
          if git grep -nE '(^|[^[:alnum:]_])service\.Err(PageNotFound|DuplicateSlug|ReservedSlug|InvalidSlug|PageTitleEmpty)' -- blog-backend/internal/controllerutil/response.go; then
            echo 'shared HTTP error mapping still depends on flat Page errors' >&2
            exit 1
          fi

      - name: Remove migration scaffolding
        run: rm scripts/tmp-page-runtime-migration.py .github/workflows/tmp-page-runtime.yml

      - name: Commit migrated runtime ownership
        run: |
          git config user.name Aben
          git config user.email 5195693+rushairer@users.noreply.github.com
          git add -A
          git commit -m 'refactor(page): move runtime ownership to capability'
          git push origin HEAD:refactor/page-runtime-ownership

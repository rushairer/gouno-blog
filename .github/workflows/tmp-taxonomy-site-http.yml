name: Temporary Taxonomy Site HTTP Migration

on:
  push:
    branches: [refactor/taxonomy-site-http-ownership]
    paths:
      - "scripts/tmp_migrate_taxonomy_site_http.py"
      - ".github/workflows/tmp-taxonomy-site-http.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/taxonomy-site-http-ownership

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Move runtime HTTP ownership to capabilities
        run: python3 scripts/tmp_migrate_taxonomy_site_http.py

      - name: Format and verify backend
        working-directory: blog-backend
        run: |
          gofmt -w internal/controller/feed_controller.go internal/controllerutil/response.go router/web.go cmd/gouno/web.go router/web_test.go internal/taxonomy/controller/controller.go internal/site/controller/controller.go
          go test ./...
          go vet ./...

      - name: Remove migration scaffolding
        run: rm scripts/tmp_migrate_taxonomy_site_http.py .github/workflows/tmp-taxonomy-site-http.yml

      - name: Commit migrated runtime ownership
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(architecture): route taxonomy and site through capabilities"
          git push origin HEAD:refactor/taxonomy-site-http-ownership

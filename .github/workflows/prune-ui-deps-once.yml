name: Prune stale UI dependencies once

on:
  push:
    branches:
      - chore/ui-dependency-prune-20260913
    paths:
      - .github/workflows/prune-ui-deps-once.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chore/ui-dependency-prune-20260913
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Remove obsolete compatibility dependencies
        working-directory: blog-frontend
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|import { cn } from "../../lib/utils";|import { cn } from "@gouno/ui";|' src/pages/admin/Notifications.tsx
          rm src/lib/utils.ts
          npm uninstall \
            @radix-ui/react-avatar \
            @radix-ui/react-checkbox \
            @radix-ui/react-dialog \
            @radix-ui/react-dropdown-menu \
            @radix-ui/react-label \
            @radix-ui/react-popover \
            @radix-ui/react-select \
            @radix-ui/react-separator \
            @radix-ui/react-slot \
            @radix-ui/react-switch \
            @radix-ui/react-tabs \
            @radix-ui/react-tooltip \
            class-variance-authority \
            clsx \
            qrcode.react \
            tailwind-merge
      - name: Verify quality gate
        working-directory: blog-frontend
        run: npm run quality
      - name: Commit dependency cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/package.json blog-frontend/package-lock.json blog-frontend/src/pages/admin/Notifications.tsx blog-frontend/src/lib/utils.ts
          git commit -m "chore(ui): remove obsolete local UI dependencies"
          git push origin HEAD:chore/ui-dependency-prune-20260913

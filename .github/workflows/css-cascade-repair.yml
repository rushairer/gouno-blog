name: CSS cascade repair

on:
  push:
    branches:
      - fix/css-cascade-isolation-20260904

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/css-cascade-isolation-20260904
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Apply cascade migration
        run: node scripts/repair-css-cascade.mjs
      - name: Install dependencies
        run: npm ci
      - name: Format migrated sources
        run: npm run format
      - name: Verify complete frontend quality gate
        run: npm run quality
      - name: Verify patch integrity
        run: git diff --check
        working-directory: .
      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(css): isolate Tailwind cascade layers"
            git push origin HEAD:fix/css-cascade-isolation-20260904
          fi
        working-directory: .

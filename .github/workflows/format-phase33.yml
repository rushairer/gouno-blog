name: Format Phase 33

on:
  push:
    branches:
      - work/remove-legacy-ui-phase33

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Format migrated UI files
        working-directory: blog-frontend
        run: >-
          npx prettier --write
          src/components/agent/AdvancedWorkspace.tsx
          src/components/agent/AgentForm.tsx
          src/components/agent/AgentRunRecords.tsx
          src/components/agent/SkillForm.tsx
          src/components/agent/WorkflowInputForm.tsx
          src/components/agent/WorkflowRunRecords.tsx

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            blog-frontend/src/components/agent/AdvancedWorkspace.tsx \
            blog-frontend/src/components/agent/AgentForm.tsx \
            blog-frontend/src/components/agent/AgentRunRecords.tsx \
            blog-frontend/src/components/agent/SkillForm.tsx \
            blog-frontend/src/components/agent/WorkflowInputForm.tsx \
            blog-frontend/src/components/agent/WorkflowRunRecords.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore(ui): apply prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"

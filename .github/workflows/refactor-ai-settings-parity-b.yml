name: Refactor AI Settings Parity 3B

on:
  push:
    branches:
      - ui/blog-admin-final-parity-ai-settings-b

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/blog-admin-final-parity-ai-settings-b
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - working-directory: blog-frontend
        run: npm ci
      - name: Align AI Settings protected sections
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("blog-frontend/src/components/agent/AdvancedWorkspace.tsx")
          text = path.read_text()

          old_core = '''import {
            Alert,
            Button,
            Card,
            CardContent,
            CardHeader,
            Empty,
            IconButton,
            Select,
            Tabs,
            Tag,
            Text,
          } from "@gouno/ui/core";'''
          new_core = '''import {
            Alert,
            Button,
            Card,
            CardContent,
            Empty,
            Heading,
            IconButton,
            Select,
            Tabs,
            Tag,
            Text,
          } from "@gouno/ui/core";'''
          if old_core not in text:
              raise SystemExit("core import block not found")
          text = text.replace(old_core, new_core, 1)

          def section_start(source: str, name: str) -> int:
              token = f'advancedSection === "{name}" ? ('
              token_index = source.find(token)
              if token_index < 0:
                  raise SystemExit(f"section token not found: {name}")
              marker = source.rfind('      {!editingAgent', 0, token_index)
              if marker < 0:
                  raise SystemExit(f"section start not found: {name}")
              return marker

          def replace_section(source: str, name: str, next_name: str, replacement: str) -> str:
              start = section_start(source, name)
              end = section_start(source, next_name)
              if end <= start:
                  raise SystemExit(f"invalid section range: {name} -> {next_name}")
              return source[:start] + replacement + "\n\n" + source[end:]

          providers_block = '''      {!editingAgent && !editingProvider && advancedSection === "providers" ? (
                <SudoGate
                  title="模型连接与密钥保护"
                  description="添加、修改、导出或删除 AI 模型连接涉及敏感 API Key 凭据。解锁后享有 10 分钟无打扰编辑期。"
                  actionLabel="解锁以管理模型连接"
                >
                  <div className="flex flex-col gap-5">
                    <input
                      ref={providerFileInputRef}
                      type="file"
                      accept=".json,application/json"
                      hidden
                      onChange={(event) => void onImportProviders(event)}
                    />
                    <TabPanelLead
                      description={
                        locale === "zh"
                          ? "管理模型连接、密钥状态以及文本与图片生成的默认用途。"
                          : "Manage model connections, credential state, and default usage for text and image generation."
                      }
                      actions={
                        <>
                          <Button
                            size="small"
                            variant="outline"
                            type="button"
                            onClick={() => void onExportProviders()}
                            icon={<Download />}
                          >
                            {labels.exportProviders}
                          </Button>
                          <Button
                            size="small"
                            variant="outline"
                            type="button"
                            onClick={() => providerFileInputRef.current?.click()}
                            icon={<Upload />}
                          >
                            {labels.importProviders}
                          </Button>
                          <Button
                            size="small"
                            variant="solid"
                            color="primary"
                            onClick={() => onEditProvider("new")}
                            icon={<Plus />}
                          >
                            {locale === "zh" ? "添加模型连接" : labels.createProvider}
                          </Button>
                        </>
                      }
                    />
                    <Alert
                      type="info"
                      showIcon
                      title={locale === "zh" ? "模型连接与密钥保护" : "Model connection and credential protection"}
                      description={
                        locale === "zh"
                          ? "添加、修改、导出或删除模型连接需要近期 MFA；API Key 始终保持掩码显示。"
                          : "Adding, editing, exporting, or deleting model connections requires recent MFA; API keys remain masked."
                      }
                    />
                    <Card padding="base">
                      <div className="flex flex-col gap-4">
                        <div>
                          <Heading level={2} className="text-base">
                            {locale === "zh" ? "默认用途" : "Default Purposes"}
                          </Heading>
                          <Text size="sm" tone="muted">
                            {locale === "zh"
                              ? "决定编辑器、运营分析与图片生成默认使用的模型。"
                              : "Choose the default models used for editing, operations analysis, and image generation."}
                          </Text>
                        </div>
                        <div className="grid gap-4 md:grid-cols-2">
                          <label className="flex flex-col gap-2">
                            <Text size="sm">{locale === "zh" ? "文本模型" : "Text Model"}</Text>
                            <Select
                              value={String(
                                providers.find((item) => item.is_default_writing)?.id || "",
                              )}
                              onChange={(value) => {
                                const id = value ? Number(value) : 0;
                                void onSetDefaultProvider(id, "writing");
                              }}
                            >
                              <option value="">
                                {locale === "zh" ? "未设置 (取消选择)" : "Not set (Clear default)"}
                              </option>
                              {providers
                                .filter((item) => item.enabled)
                                .map((item) => (
                                  <option key={item.id} value={String(item.id)}>
                                    {item.name} · {item.model}
                                  </option>
                                ))}
                            </Select>
                          </label>
                          <label className="flex flex-col gap-2">
                            <Text size="sm">{locale === "zh" ? "图片生成" : "Image Generation"}</Text>
                            <Select
                              value={String(
                                providers.find((item) => item.is_default_image)?.id || "",
                              )}
                              onChange={(value) => {
                                const id = value ? Number(value) : 0;
                                void onSetDefaultProvider(id, "image");
                              }}
                            >
                              <option value="">
                                {locale === "zh" ? "未设置 (取消选择)" : "Not set (Clear default)"}
                              </option>
                              {providers
                                .filter((item) => item.enabled)
                                .map((item) => (
                                  <option key={item.id} value={String(item.id)}>
                                    {item.name} · {item.model}
                                  </option>
                                ))}
                            </Select>
                          </label>
                        </div>
                      </div>
                    </Card>
                    {providers.length === 0 ? (
                      <Card padding="base">
                        <Empty description={labels.noProviders} />
                      </Card>
                    ) : (
                      <div className="grid gap-4 lg:grid-cols-2">
                        {providers.map((provider) => {
                          const testing = testingConnections.includes(`provider:${provider.id}`);
                          return (
                            <Card key={provider.id} padding="base">
                              <div className="flex h-full flex-col gap-4">
                                <div className="flex items-start justify-between gap-3">
                                  <div className="min-w-0">
                                    <strong>{provider.name}</strong>
                                    <Text size="xs" tone="muted">
                                      {provider.provider_type} · {provider.model}
                                    </Text>
                                  </div>
                                  <Tag color={provider.enabled ? "success" : "default"}>
                                    {provider.enabled ? labels.active : labels.paused}
                                  </Tag>
                                </div>
                                <Text size="xs" tone="muted" className="break-all">
                                  {provider.base_url}
                                </Text>
                                <Text size="xs" tone="muted">
                                  API Key •••• {provider.api_key_last4} · {labels.keyStored}
                                </Text>
                                <div className="flex flex-wrap gap-2">
                                  {provider.is_default_writing ? (
                                    <Tag color="primary">
                                      {locale === "zh" ? "默认文本模型" : "Default Text Model"}
                                    </Tag>
                                  ) : null}
                                  {provider.is_default_image ? (
                                    <Tag color="primary">
                                      {locale === "zh" ? "默认图片模型" : "Default Image Model"}
                                    </Tag>
                                  ) : null}
                                </div>
                                <div className="mt-auto flex flex-wrap gap-2 border-t pt-4">
                                  <Button
                                    size="small"
                                    variant="ghost"
                                    icon={<RefreshCw className={testing ? "agent-row-actions__spinner" : undefined} />}
                                    aria-busy={testing}
                                    disabled={testing}
                                    onClick={() => void onTestConnection("provider", provider.id, provider.name)}
                                  >
                                    {testing
                                      ? locale === "zh" ? "正在测试连接" : "Testing connection"
                                      : labels.test}
                                  </Button>
                                  <Button
                                    size="small"
                                    variant="ghost"
                                    icon={<Edit2 />}
                                    onClick={() => onEditProvider(provider)}
                                  >
                                    {labels.edit}
                                  </Button>
                                  <Button
                                    size="small"
                                    variant="ghost"
                                    color="error"
                                    icon={<Trash2 />}
                                    onClick={() => onDeleteTarget({ kind: "provider", value: provider })}
                                  >
                                    {labels.delete}
                                  </Button>
                                </div>
                              </div>
                            </Card>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </SudoGate>
              ) : null}'''
          text = replace_section(text, "providers", "connectors", providers_block)

          knowledge_start = section_start(text, "knowledge")
          knowledge_end_marker = '\n    </>\n  );\n}'
          knowledge_end = text.find(knowledge_end_marker, knowledge_start)
          if knowledge_end < 0:
              raise SystemExit("knowledge section end not found")
          knowledge_block = '''      {!editingAgent &&
              !editingProvider &&
              !editingEmbedding &&
              advancedSection === "knowledge" ? (
                <SudoGate
                  title="知识库与向量模型保护"
                  description="添加、编辑或删除 Embedding 知识库模型及全量重建索引需要近期多因素身份认证。解锁后享有 10 分钟无打扰编辑期。"
                  actionLabel="解锁以管理知识库"
                >
                  <div className="flex flex-col gap-5">
                    <TabPanelLead
                      description={
                        locale === "zh"
                          ? "仅索引已发布文章；Embedding Profile 负责把内容转换为可检索知识库。"
                          : "Only published content is indexed; Embedding Profiles convert content into a searchable knowledge base."
                      }
                      actions={
                        <>
                          <Button
                            size="small"
                            variant="outline"
                            type="button"
                            onClick={() => void onRetryIndex()}
                            icon={<RefreshCw />}
                          >
                            {locale === "zh" ? "重试失败任务" : "Retry failed"}
                          </Button>
                          <Button
                            size="small"
                            variant="outline"
                            type="button"
                            onClick={() => void onRebuildIndex()}
                            icon={<RefreshCw />}
                          >
                            {locale === "zh" ? "全量重建" : "Rebuild all"}
                          </Button>
                          <Button
                            size="small"
                            variant="solid"
                            color="primary"
                            type="button"
                            onClick={() => onEditEmbedding("new")}
                            icon={<Plus />}
                          >
                            {locale === "zh" ? "添加 Embedding 模型" : "Add embedding profile"}
                          </Button>
                        </>
                      }
                    />
                    <Alert
                      type="info"
                      showIcon
                      title={locale === "zh" ? "敏感配置需要近期 MFA" : "Recent MFA required for sensitive configuration"}
                      description={
                        locale === "zh"
                          ? "添加、编辑、删除 Embedding 配置和全量重建需要近期多因素认证。"
                          : "Adding, editing, deleting Embedding configuration and rebuilding the full index require recent MFA."
                      }
                    />
                    <div className="grid gap-4 sm:grid-cols-3">
                      <Card padding="base">
                        <Text size="xs" tone="muted">{locale === "zh" ? "分段" : "Chunks"}</Text>
                        <Heading level={2}>{indexStatus.chunks}</Heading>
                      </Card>
                      <Card padding="base">
                        <Text size="xs" tone="muted">{locale === "zh" ? "队列" : "Queued"}</Text>
                        <Heading level={2}>{indexStatus.queued}</Heading>
                      </Card>
                      <Card padding="base">
                        <Text size="xs" tone="muted">{locale === "zh" ? "失败" : "Failed"}</Text>
                        <Heading level={2}>{indexStatus.failed}</Heading>
                      </Card>
                    </div>
                    {indexStatus.failed > 0 ? (
                      <Alert
                        type="warning"
                        showIcon
                        title={locale === "zh" ? "知识索引存在失败任务" : "Knowledge indexing has failed jobs"}
                        description={
                          locale === "zh"
                            ? "优先重试失败项；只有索引结构变化或一致性异常时才执行全量重建。"
                            : "Retry failed jobs first; rebuild the full index only for schema or consistency problems."
                        }
                      />
                    ) : null}
                    {embeddingProfiles.length === 0 ? (
                      <Card padding="base">
                        <Empty
                          description={
                            locale === "zh"
                              ? "还没有嵌入配置。"
                              : "No embedding profiles configured."
                          }
                        />
                      </Card>
                    ) : (
                      <Card padding="none" className="overflow-hidden">
                        <CardContent className="divide-y p-0">
                          {embeddingProfiles.map((profile) => {
                            const testing = testingConnections.includes(`embedding:${profile.id}`);
                            return (
                              <div
                                key={profile.id}
                                className="flex flex-col gap-4 p-6 xl:flex-row xl:items-center xl:justify-between"
                              >
                                <div className="min-w-0">
                                  <div className="flex flex-wrap items-center gap-2">
                                    <strong>{profile.name}</strong>
                                    <Tag color={profile.enabled ? "success" : "default"}>
                                      {profile.enabled ? labels.active : labels.paused}
                                    </Tag>
                                  </div>
                                  <Text size="xs" tone="muted">
                                    {profile.model} · {profile.dimensions} dimensions
                                  </Text>
                                  <Text size="xs" tone="muted" className="break-all">
                                    {profile.base_url} · API Key •••• {profile.api_key_last4}
                                  </Text>
                                </div>
                                <div className="flex min-w-max flex-nowrap items-center gap-1">
                                  <IconButton
                                    label={
                                      testing
                                        ? locale === "zh" ? "正在测试连接" : "Testing connection"
                                        : labels.test
                                    }
                                    aria-busy={testing}
                                    disabled={testing}
                                    icon={<RefreshCw className={testing ? "agent-row-actions__spinner" : undefined} />}
                                    variant="ghost"
                                    onClick={() => void onTestConnection("embedding", profile.id, profile.name)}
                                  />
                                  <IconButton
                                    label={labels.edit}
                                    icon={<Edit2 />}
                                    variant="ghost"
                                    onClick={() => onEditEmbedding(profile)}
                                  />
                                  <IconButton
                                    label={labels.delete}
                                    icon={<Trash2 />}
                                    variant="ghost"
                                    color="error"
                                    onClick={() => onDeleteTarget({ kind: "embedding", value: profile })}
                                  />
                                </div>
                              </div>
                            );
                          })}
                        </CardContent>
                      </Card>
                    )}
                  </div>
                </SudoGate>
              ) : null}'''
          text = text[:knowledge_start] + knowledge_block + text[knowledge_end:]
          path.write_text(text)

          test = Path("blog-frontend/src/pages/admin/__tests__/AISettings.test.tsx")
          t = test.read_text()
          insert = '''

            it("uses canonical protected Provider and Knowledge surfaces", async () => {
              const user = userEvent.setup();
              renderSettings();

              await user.click(await screen.findByRole("tab", { name: "Providers" }));
              expect(screen.getByRole("tab", { name: "Providers" })).toHaveAttribute(
                "aria-selected",
                "true",
              );
              expect(screen.queryByRole("heading", { name: "Providers" })).not.toBeInTheDocument();
              expect(screen.getByRole("heading", { name: "Default Purposes" })).toBeInTheDocument();
              expect(screen.getByText("OpenAI")).toBeInTheDocument();

              await user.click(screen.getByRole("tab", { name: "Knowledge" }));
              expect(screen.getByRole("tab", { name: "Knowledge" })).toHaveAttribute(
                "aria-selected",
                "true",
              );
              expect(screen.queryByRole("heading", { name: "Knowledge" })).not.toBeInTheDocument();
              expect(screen.getByText("Chunks")).toBeInTheDocument();
              expect(screen.getByText("Queued")).toBeInTheDocument();
              expect(screen.getByText("Failed")).toBeInTheDocument();
              expect(window.location.search).toBe("?section=knowledge");
            });
          '''
          pos = t.rfind("\n});")
          if pos < 0:
              raise SystemExit("AISettings test suite end not found")
          t = t[:pos] + insert + t[pos:]
          test.write_text(t)
          PY
      - working-directory: blog-frontend
        run: npx prettier --write src/components/agent/AdvancedWorkspace.tsx src/pages/admin/__tests__/AISettings.test.tsx
      - working-directory: blog-frontend
        run: npm run test:run -- src/pages/admin/__tests__/AISettings.test.tsx
      - working-directory: blog-frontend
        run: npx tsc -b
      - name: Commit verified refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add blog-frontend/src/components/agent/AdvancedWorkspace.tsx blog-frontend/src/pages/admin/__tests__/AISettings.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ui): align AI Settings protected sections"
          git push origin HEAD:ui/blog-admin-final-parity-ai-settings-b

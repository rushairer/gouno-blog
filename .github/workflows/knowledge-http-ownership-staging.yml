name: Knowledge HTTP ownership staging

on:
  push:
    branches:
      - refactor/knowledge-http-ownership

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Apply Knowledge HTTP ownership migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          backend = root / "blog-backend"
          flat = backend / "internal" / "controller"
          knowledge_dir = backend / "internal" / "knowledge" / "controller"
          knowledge_dir.mkdir(parents=True, exist_ok=True)

          # Move Knowledge transport into the Knowledge capability without changing behavior.
          old_path = flat / "agent_knowledge_controller.go"
          text = old_path.read_text()
          text = text.replace('import (\n\t"net/http"\n', 'import (\n\t"encoding/json"\n\t"fmt"\n\t"io"\n\t"net/http"\n', 1)
          text = text.replace('\t"github.com/gin-gonic/gin"\n', '\t"github.com/gin-gonic/gin"\n\t"github.com/gin-gonic/gin/binding"\n\t"github.com/rushairer/blog-backend/internal/controllerutil"\n', 1)
          marker = 'type embeddingProfileRequest struct {'
          preamble = '''type Controller struct {\n\tservice *knowledge.Service\n}\n\nfunc New(service *knowledge.Service) *Controller {\n\tif service == nil {\n\t\tpanic("knowledge controller: service is required")\n\t}\n\treturn &Controller{service: service}\n}\n\nfunc bindJSON(c *gin.Context, value any) error {\n\tdecoder := json.NewDecoder(c.Request.Body)\n\tdecoder.DisallowUnknownFields()\n\tif err := decoder.Decode(value); err != nil {\n\t\treturn err\n\t}\n\tif err := decoder.Decode(&struct{}{}); err != io.EOF {\n\t\treturn fmt.Errorf("request body must contain one JSON object")\n\t}\n\treturn binding.Validator.ValidateStruct(value)\n}\n\n'''
          assert marker in text
          text = text.replace(marker, preamble + marker, 1)
          text = text.replace('(ctrl *AgentController)', '(ctrl *Controller)')
          text = text.replace('ctrl.knowledge', 'ctrl.service')
          text = text.replace('WriteDomainError(', 'controllerutil.WriteDomainError(')
          text = text.replace('ParamPositiveID(', 'controllerutil.ParamPositiveID(')
          text = text.replace('bindAgentJSON(', 'bindJSON(')
          (knowledge_dir / "controller.go").write_text(text)
          old_path.unlink()

          # The transitional flat controller is now Connector-only. Keep its strict JSON binder
          # and all Connector behavior unchanged under Connector Module Hold.
          legacy_path = flat / "agent_controller.go"
          legacy = legacy_path.read_text()
          legacy = legacy.replace('\t"github.com/rushairer/blog-backend/internal/knowledge"\n', '')
          legacy = legacy.replace('type AgentController struct {\n\tknowledge  *knowledge.Service\n\tconnectors *connector.Service\n}', 'type AgentController struct {\n\tconnectors *connector.Service\n}', 1)
          legacy = legacy.replace('type AgentControllerOptions struct {\n\tKnowledge  *knowledge.Service\n\tConnectors *connector.Service\n}', 'type AgentControllerOptions struct {\n\tConnectors *connector.Service\n}', 1)
          legacy = legacy.replace('return &AgentController{\n\t\tknowledge:  opts.Knowledge,\n\t\tconnectors: opts.Connectors,\n\t}', 'return &AgentController{connectors: opts.Connectors}', 1)
          legacy = legacy.replace('// NewAgentControllerWithOptions is retained while Knowledge and Connector\n// transport still share this transitional flat controller shell.', '// NewAgentControllerWithOptions is retained while Connector transport remains\n// on the explicitly held transitional flat controller shell.', 1)
          assert 'internal/knowledge' not in legacy
          assert 'knowledge.Service' not in legacy
          legacy_path.write_text(legacy)

          # Router receives Knowledge and Connector transport as distinct dependencies.
          router_path = backend / "router" / "web.go"
          router = router_path.read_text()
          router = router.replace('\t"github.com/rushairer/blog-backend/internal/controller"\n', '\t"github.com/rushairer/blog-backend/internal/controller"\n\tknowledgecontroller "github.com/rushairer/blog-backend/internal/knowledge/controller"\n', 1)
          router = router.replace('\tAgentCtrl          *agentcontroller.Controller\n\tLegacyAICtrl       *controller.AgentController\n', '\tAgentCtrl          *agentcontroller.Controller\n\tKnowledgeCtrl      *knowledgecontroller.Controller\n\tLegacyAICtrl       *controller.AgentController\n', 1)
          router = router.replace('\tagentCtrl := opts.AgentCtrl\n\tlegacyAICtrl := opts.LegacyAICtrl\n', '\tagentCtrl := opts.AgentCtrl\n\tknowledgeCtrl := opts.KnowledgeCtrl\n\tlegacyAICtrl := opts.LegacyAICtrl\n', 1)
          knowledge_methods = [
              'ListEmbeddingProfiles', 'CreateEmbeddingProfile', 'UpdateEmbeddingProfile',
              'DeleteEmbeddingProfile', 'TestEmbeddingProfile', 'IndexStatus', 'RebuildIndex',
              'RetryIndex', 'ReplaceIndexEvaluation', 'EvaluateIndex',
          ]
          for method in knowledge_methods:
              router = router.replace(f'legacyAICtrl.{method}', f'knowledgeCtrl.{method}')
          start = '\t\t\tif legacyAICtrl != nil {\n\t\t\t\taiOps.GET("/admin/embedding-profiles", knowledgeCtrl.ListEmbeddingProfiles)'
          assert start in router
          router = router.replace(start, '\t\t\tif knowledgeCtrl != nil {\n\t\t\t\taiOps.GET("/admin/embedding-profiles", knowledgeCtrl.ListEmbeddingProfiles)', 1)
          split = '\t\t\t\taiOps.POST("/admin/ai-index/evaluate", knowledgeCtrl.EvaluateIndex)\n\t\t\t\taiOps.GET("/admin/ai-connectors", legacyAICtrl.ListConnectorProfiles)'
          assert split in router
          router = router.replace(split, '\t\t\t\taiOps.POST("/admin/ai-index/evaluate", knowledgeCtrl.EvaluateIndex)\n\t\t\t}\n\t\t\tif legacyAICtrl != nil {\n\t\t\t\taiOps.GET("/admin/ai-connectors", legacyAICtrl.ListConnectorProfiles)', 1)
          router_path.write_text(router)

          # Composition root constructs Knowledge controller explicitly and leaves Connector shell held.
          web_path = backend / "cmd" / "gouno" / "web.go"
          web = web_path.read_text()
          web = web.replace('\t"github.com/rushairer/blog-backend/internal/knowledge"\n', '\t"github.com/rushairer/blog-backend/internal/knowledge"\n\tknowledgecontroller "github.com/rushairer/blog-backend/internal/knowledge/controller"\n', 1)
          web = web.replace('\tvar agentCtrl *agentcontroller.Controller\n\tvar legacyAICtrl *controller.AgentController\n', '\tvar agentCtrl *agentcontroller.Controller\n\tvar knowledgeCtrl *knowledgecontroller.Controller\n\tvar legacyAICtrl *controller.AgentController\n', 1)
          web = web.replace('\t\tknowledgeSvc.Start(ctx)\n', '\t\tknowledgeSvc.Start(ctx)\n\t\tknowledgeCtrl = knowledgecontroller.New(knowledgeSvc)\n', 1)
          web = web.replace('\t\tlegacyAICtrl = controller.NewAgentControllerWithOptions(controller.AgentControllerOptions{\n\t\t\tKnowledge: knowledgeSvc, Connectors: connectorSvc,\n\t\t})', '\t\tlegacyAICtrl = controller.NewAgentControllerWithOptions(controller.AgentControllerOptions{\n\t\t\tConnectors: connectorSvc,\n\t\t})', 1)
          web = web.replace('PostVersionSvc: postVersionSvc, AgentCtrl: agentCtrl, LegacyAICtrl: legacyAICtrl, OperationsCtrl: operationsCtrl, WorkflowCtrl: workflowCtrl, Logger: cfg.Logger, Verifier: verifier,', 'PostVersionSvc: postVersionSvc, AgentCtrl: agentCtrl, KnowledgeCtrl: knowledgeCtrl, LegacyAICtrl: legacyAICtrl, OperationsCtrl: operationsCtrl, WorkflowCtrl: workflowCtrl, Logger: cfg.Logger, Verifier: verifier,', 1)
          web_path.write_text(web)

          # Update router ownership guard to encode Knowledge/Connector separation.
          guard_path = backend / "router" / "agent_controller_ownership_test.go"
          guard = guard_path.read_text()
          guard = guard.replace('\t\t"legacyAICtrl.ListEmbeddingProfiles",\n', '\t\t"KnowledgeCtrl",\n\t\t"*knowledgecontroller.Controller",\n\t\t"knowledgeCtrl.ListEmbeddingProfiles",\n', 1)
          guard = guard.replace('\t\t"agentCtrl.ListEmbeddingProfiles",\n', '\t\t"agentCtrl.ListEmbeddingProfiles",\n\t\t"legacyAICtrl.ListEmbeddingProfiles",\n\t\t"knowledgeCtrl.ListConnectorProfiles",\n', 1)
          guard_path.write_text(guard)

          # Capability-local transport regression tests.
          (knowledge_dir / "controller_test.go").write_text('''package controller\n\nimport (\n\t"net/http/httptest"\n\t"os"\n\t"strings"\n\t"testing"\n\n\t"github.com/gin-gonic/gin"\n)\n\nfunc TestBindJSONPreservesStrictKnowledgeTransportContract(t *testing.T) {\n\tgin.SetMode(gin.TestMode)\n\tfor _, body := range []string{`{"name":"x","unknown":true}`, `{"name":"x"} {}`} {\n\t\tc, _ := gin.CreateTestContext(httptest.NewRecorder())\n\t\tc.Request = httptest.NewRequest("POST", "/", strings.NewReader(body))\n\t\tvar req struct { Name string `json:"name" binding:"required"` }\n\t\tif err := bindJSON(c, &req); err == nil {\n\t\t\tt.Fatalf("expected strict JSON rejection for %q", body)\n\t\t}\n\t}\n}\n\nfunc TestKnowledgeControllerOwnsKnowledgeTransportOnly(t *testing.T) {\n\tdata, err := os.ReadFile("controller.go")\n\tif err != nil { t.Fatal(err) }\n\ttext := string(data)\n\tfor _, forbidden := range []string{"internal/connector", "connector.Service", "AgentController"} {\n\t\tif strings.Contains(text, forbidden) {\n\t\t\tt.Fatalf("Knowledge controller crossed ownership boundary: %s", forbidden)\n\t\t}\n\t}\n\tfor _, required := range []string{"*knowledge.Service", "ListEmbeddingProfiles", "EvaluateIndex"} {\n\t\tif !strings.Contains(text, required) {\n\t\t\tt.Fatalf("Knowledge controller missing canonical transport marker: %s", required)\n\t\t}\n\t}\n}\n''')

          # Architecture documentation.
          arch_path = backend / "ARCHITECTURE.md"
          arch = arch_path.read_text()
          arch = arch.replace('- Knowledge transport remains on the transitional flat controller until the dedicated Knowledge HTTP ownership slice.\n- Connector transport remains on that same transitional shell without behavioral changes under Connector Module Hold; the router names this dependency `LegacyAICtrl` to prevent accidental Agent ownership.', '- Knowledge transport is capability-owned under `internal/knowledge/controller` and is composed independently from Agent transport.\n- Connector transport remains on the transitional flat shell without behavioral changes under Connector Module Hold; the router names this dependency `LegacyAICtrl` to prevent accidental Agent/Knowledge ownership.', 1)
          anchor = '## Operations HTTP ownership boundary\n'
          knowledge_section = '''## Knowledge HTTP ownership boundary\n\nKnowledge HTTP transport is capability-owned under `internal/knowledge/controller`. Embedding-profile administration and index status/rebuild/retry/evaluation endpoints are wired through the Knowledge controller while the Knowledge service retains its existing persistence and transaction model.\n\n- The controller depends only on `*knowledge.Service` plus shared HTTP primitives from `internal/controllerutil`; it does not import Agent or Connector.\n- Strict JSON decoding, positive-ID validation, status codes and response envelopes preserve the previous transport contract.\n- `router.WebRouterOptions` receives Knowledge and Connector controllers separately; existing `/api/admin/embedding-profiles*` and `/api/admin/ai-index/*` paths remain under the same ManageAI, AAL2, recent-MFA and audit middleware chain.\n- Connector routes, OAuth/callback state, credentials, delivery/outbox behavior and Sandbox semantics remain untouched under Connector Module Hold. The transitional flat controller is now Connector-only.\n\n'''
          assert anchor in arch
          arch = arch.replace(anchor, knowledge_section + anchor, 1)
          arch_path.write_text(arch)

          conv_path = backend / "ARCHITECTURE_CONVERGENCE.md"
          conv = conv_path.read_text()
          conv = conv.replace('| **Knowledge** | Embedding profiles, index jobs/chunks, retrieval metrics/evaluation; `ai_embedding_profiles`, `ai_content_index_jobs`, `ai_content_chunks`, `ai_retrieval_metrics`, `ai_retrieval_eval_cases` | `internal/knowledge` service; cohesive service-local persistence is intentional today | Provider HTTP/runtime boundary; Tool consumers through Knowledge service API. | Knowledge service owns multi-write index transactions through `dbtx.Transactor`. | **Service boundary stable.** Controller ownership remains flat and is deferred until service/dependency convergence is complete. |', '| **Knowledge** | Embedding profiles, index jobs/chunks, retrieval metrics/evaluation; `ai_embedding_profiles`, `ai_content_index_jobs`, `ai_content_chunks`, `ai_retrieval_metrics`, `ai_retrieval_eval_cases` | `internal/knowledge` service and `internal/knowledge/controller`; cohesive service-local persistence is intentional today | Provider HTTP/runtime boundary; Tool consumers through Knowledge service API. | Knowledge service owns multi-write index transactions through `dbtx.Transactor`. | **Service and HTTP ownership are converged.** Embedding/index transport is capability-owned; persistence/transaction behavior is unchanged. |', 1)
          conv = conv.replace('| `internal/controller` Knowledge/Connector transitional controller shell | Transitional HTTP ownership / explicit Hold | Knowledge routes plus Connector-held routes; Agent, Workflow and Operations transport are capability-local | Move Knowledge in its dedicated slice; retain Connector behavior until explicit Hold lift. Preserve routes, middleware, BFF and authorization behavior exactly. |', '| `internal/controller.AgentController` Connector-only transitional shell | Explicit Connector Hold | Connector routes/callback only; Agent, Workflow, Operations and Knowledge transport are capability-local | Retain unchanged until explicit Connector Hold lift; then move Connector transport with dedicated security review/tests. |', 1)
          conv = conv.replace('- **A — migrate to capability / retire facade:** Agent, Workflow and Operations HTTP ownership are canonical under their capability controllers. Knowledge remains the non-held controller migration target; flat Agent repository delegates are retired.', '- **A — migrate to capability / retire facade:** Agent, Workflow, Operations and Knowledge HTTP ownership are canonical under capability controllers; flat Agent repository delegates are retired. Remaining non-held facades require consumer proof before deletion.', 1)
          conv = conv.replace('1. **Controller / composition-root convergence:** Workflow, Operations and Agent HTTP ownership are converged; move Knowledge HTTP ownership next while preserving routes, middleware, BFF and authorization semantics exactly.\n2. **Transitional layer retirement:** delete remaining flat controller facades and stale adapters only after consumer proof and full gates.\n3. **Shared-model classification:**', '1. **Transitional layer retirement:** retire remaining non-held compatibility facades only after consumer proof and full gates; Connector controller/transactor compatibility remains explicitly blocked by Connector Module Hold.\n2. **Shared-model classification:**', 1)
          conv = conv.replace('and **Agent HTTP ownership convergence** now use canonical ownership boundaries', 'and **Agent HTTP ownership convergence**, and **Knowledge HTTP ownership convergence** now use canonical ownership boundaries', 1)
          marker = '\n### Operations HTTP ownership convergence — 2026-09-14\n'
          section = '''\n### Knowledge HTTP ownership convergence — 2026-09-14\n\n- `internal/knowledge/controller` owns embedding-profile and index status/rebuild/retry/evaluation HTTP transport. Existing URLs, response envelopes and AI-management middleware are unchanged.\n- Strict JSON binding and positive-ID validation preserve the previous flat-controller behavior.\n- Composition root constructs Knowledge service/controller explicitly; router receives `KnowledgeCtrl` separately from the Connector-held `LegacyAICtrl`.\n- The flat `AgentController` is now Connector-only. Connector OAuth/callback/credentials/outbox/delivery/Sandbox code is unchanged under Connector Module Hold.\n\n'''
          assert marker in conv
          conv = conv.replace(marker, section + marker, 1)
          conv_path.write_text(conv)

          print("knowledge HTTP ownership migration applied")
          PY

      - name: Format
        run: |
          gofmt -w blog-backend/internal/knowledge/controller
          gofmt -w blog-backend/internal/controller/agent_controller.go
          gofmt -w blog-backend/router/web.go blog-backend/router/agent_controller_ownership_test.go
          gofmt -w blog-backend/cmd/gouno/web.go

      - name: Focused tests
        working-directory: blog-backend
        run: go test ./internal/knowledge/controller ./internal/controller ./router ./cmd/gouno

      - name: Focused vet
        working-directory: blog-backend
        run: go vet ./internal/knowledge/controller ./internal/controller ./router ./cmd/gouno

      - name: Ownership and diff guards
        run: |
          test ! -e blog-backend/internal/controller/agent_knowledge_controller.go
          test -e blog-backend/internal/knowledge/controller/controller.go
          grep -q 'KnowledgeCtrl' blog-backend/router/web.go
          grep -q 'knowledgeCtrl.ListEmbeddingProfiles' blog-backend/router/web.go
          grep -q 'legacyAICtrl.ListConnectorProfiles' blog-backend/router/web.go
          ! grep -q 'legacyAICtrl.ListEmbeddingProfiles' blog-backend/router/web.go
          ! grep -q 'internal/knowledge' blog-backend/internal/controller/agent_controller.go
          ! grep -q 'internal/connector' blog-backend/internal/knowledge/controller/controller.go
          git diff --check

      - name: Commit validated source and self-clean
        run: |
          rm -f .github/workflows/knowledge-http-ownership-staging.yml
          git config user.name 'Aben'
          git config user.email '5195693+rushairer@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(knowledge): converge HTTP controller ownership'
          git push origin HEAD:refactor/knowledge-http-ownership

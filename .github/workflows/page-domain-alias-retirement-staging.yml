name: Page domain alias retirement staging

on:
  push:
    branches:
      - refactor/page-domain-alias-retirement

permissions:
  contents: write

jobs:
  converge-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Retire root Page domain aliases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path.cwd()
          backend = root / 'blog-backend'
          page_import = 'pagedomain "github.com/rushairer/blog-backend/internal/page/domain"\n'
          root_domain_import = '"github.com/rushairer/blog-backend/internal/domain"\n'

          def add_page_domain_import(path: Path):
              text = path.read_text()
              assert root_domain_import in text, path
              assert page_import not in text, path
              return text.replace(root_domain_import, root_domain_import + '\t' + page_import, 1)

          access_policy = backend / 'internal' / 'access' / 'policy.go'
          text = add_page_domain_import(access_policy)
          text = text.replace('page *domain.Page', 'page *pagedomain.Page')
          text = text.replace('domain.PageStatusPublished', 'pagedomain.PageStatusPublished')
          assert '*domain.Page' not in text
          access_policy.write_text(text)

          access_test = backend / 'internal' / 'access' / 'policy_test.go'
          text = add_page_domain_import(access_test)
          text = text.replace('&domain.Page{', '&pagedomain.Page{')
          text = text.replace('domain.PageStatusDraft', 'pagedomain.PageStatusDraft')
          text = text.replace('domain.PageStatusPublished', 'pagedomain.PageStatusPublished')
          assert '&domain.Page{' not in text
          access_test.write_text(text)

          approval = backend / 'internal' / 'agent' / 'approval.go'
          text = add_page_domain_import(approval)
          text = text.replace('var before domain.Page', 'var before pagedomain.Page')
          text = text.replace('&domain.Page{', '&pagedomain.Page{')
          text = text.replace('domain.PageStatusDraft', 'pagedomain.PageStatusDraft')
          text = text.replace('domain.PageStatus(*payload.Status)', 'pagedomain.PageStatus(*payload.Status)')
          assert 'domain.PageStatus' not in text
          assert 'domain.Page{' not in text
          approval.write_text(text)

          blog_tools = backend / 'internal' / 'tool' / 'blog_tools.go'
          text = add_page_domain_import(blog_tools)
          text = text.replace('domain.AdminPageFilter', 'pagedomain.AdminPageFilter')
          text = text.replace('[]*domain.Page', '[]*pagedomain.Page')
          assert 'domain.AdminPageFilter' not in text
          assert '[]*domain.Page' not in text
          blog_tools.write_text(text)

          content_audit = backend / 'internal' / 'tool' / 'content_audit.go'
          text = add_page_domain_import(content_audit)
          text = text.replace('page *domain.Page', 'page *pagedomain.Page')
          assert 'page *domain.Page' not in text
          content_audit.write_text(text)

          alias_path = backend / 'internal' / 'domain' / 'page.go'
          assert alias_path.exists()
          alias_path.unlink()

          ownership_path = backend / 'internal' / 'page' / 'domain' / 'ownership_test.go'
          ownership_path.write_text(dedent(r'''package domain_test

          import (
          	"go/ast"
          	"go/parser"
          	"go/token"
          	"io/fs"
          	"os"
          	"path/filepath"
          	"strconv"
          	"testing"
          )

          const rootDomainImport = "github.com/rushairer/blog-backend/internal/domain"

          var pageSymbols = map[string]struct{}{
          	"Page": {},
          	"PageStatus": {},
          	"PageStatusDraft": {},
          	"PageStatusPublished": {},
          	"PageTemplate": {},
          	"PageTemplateDefault": {},
          	"PageTemplateAbout": {},
          	"PageTemplateLinks": {},
          	"PageTemplateBlank": {},
          	"PageTemplateTimeline": {},
          	"PageTemplateProjects": {},
          	"PageTemplateFocus": {},
          	"PageTemplateFAQ": {},
          	"AdminPageFilter": {},
          }

          func TestRootPageCompatibilityAliasesStayRetired(t *testing.T) {
          	if _, err := os.Stat("../../domain/page.go"); !os.IsNotExist(err) {
          		t.Fatalf("root Page compatibility alias file must stay retired: %v", err)
          	}

          	internalRoot := filepath.Clean("../..")
          	fset := token.NewFileSet()
          	err := filepath.WalkDir(internalRoot, func(path string, entry fs.DirEntry, walkErr error) error {
          		if walkErr != nil {
          			return walkErr
          		}
          		if entry.IsDir() || filepath.Ext(path) != ".go" {
          			return nil
          		}
          		file, err := parser.ParseFile(fset, path, nil, 0)
          		if err != nil {
          			return err
          		}

          		rootAliases := map[string]struct{}{}
          		for _, spec := range file.Imports {
          			importPath, err := strconv.Unquote(spec.Path.Value)
          			if err != nil || importPath != rootDomainImport {
          				continue
          			}
          			alias := "domain"
          			if spec.Name != nil {
          				alias = spec.Name.Name
          				if alias == "." {
          					t.Errorf("%s dot-imports root internal/domain; Page ownership cannot be proven", path)
          					continue
          				}
          			}
          			rootAliases[alias] = struct{}{}
          		}
          		if len(rootAliases) == 0 {
          			return nil
          		}

          		ast.Inspect(file, func(node ast.Node) bool {
          			selector, ok := node.(*ast.SelectorExpr)
          			if !ok {
          				return true
          			}
          			ident, ok := selector.X.(*ast.Ident)
          			if !ok {
          				return true
          			}
          			if _, ok := rootAliases[ident.Name]; !ok {
          				return true
          			}
          			if _, isPageSymbol := pageSymbols[selector.Sel.Name]; isPageSymbol {
          				t.Errorf("%s still consumes Page symbol %s.%s through root internal/domain; import internal/page/domain instead", path, ident.Name, selector.Sel.Name)
          			}
          			return true
          		})
          		return nil
          	})
          	if err != nil {
          		t.Fatal(err)
          	}
          }
          '''))

          architecture_path = backend / 'ARCHITECTURE.md'
          architecture = architecture_path.read_text()
          old_page = 'The `page` capability is canonical under `internal/page/{domain,repository,service,controller}`. The application composition root constructs its repository and service directly from the capability packages, `WebRouterOptions.PageSvc` carries the canonical Page service, and active Page routes bind directly to the canonical Page controller. Feed generation, Agent approval handling, Blog Tools, and shared HTTP error mapping also depend on the canonical Page service or its sentinels. The former flat Page repository/service/controller compatibility facades and their duplicate flat service/controller tests have been removed after repository-wide consumer proof and full `go test ./...` / `go vet ./...` verification. Root `internal/domain` Page aliases remain intentionally separate because cross-capability consumers still use those shared content-model symbols; they must not be moved or deleted merely for directory symmetry.'
          new_page = 'The `page` capability is canonical under `internal/page/{domain,repository,service,controller}`. The application composition root constructs its repository and service directly from the capability packages, `WebRouterOptions.PageSvc` carries the canonical Page service, and active Page routes bind directly to the canonical Page controller. Feed generation, Agent approval handling, Blog Tools, and shared HTTP error mapping also depend on the canonical Page service or its sentinels. The former flat Page repository/service/controller compatibility facades and their duplicate flat service/controller tests have been removed after repository-wide consumer proof and full gates. Root `internal/domain` Page aliases are also retired: Access policy, Agent approval, and Tool consumers that need Page values import `internal/page/domain` directly, while behavior continues to flow through the canonical Page service. `internal/page/domain/ownership_test.go` rejects reintroduction of Page symbols through the root domain boundary.'
          assert old_page in architecture
          architecture_path.write_text(architecture.replace(old_page, new_page, 1))

          agents_path = root / 'AGENTS.md'
          agents = agents_path.read_text()
          old_agents = '- `blog-backend/internal/service` has been retired. `internal/domain` remains a deliberate shared-model migration boundary. `internal/repository` is retained only for the Connector-held transaction alias, while `internal/controller` is frozen to the stable Access security boundary, Connector-held transport/shell, and explicitly allowlisted compatibility helpers. `internal/controllerutil/flat_controller_boundary_test.go` rejects unclassified additions. Do not add new business ownership to either flat package.'
          new_agents = '- `blog-backend/internal/service` has been retired. `internal/domain` remains a deliberate migration boundary only for models whose shared/cross-capability role is still proven; do not retain capability-owned compatibility aliases once consumers can import the canonical domain without cycles. `internal/repository` is retained only for the Connector-held transaction alias, while `internal/controller` is frozen to the stable Access security boundary, Connector-held transport/shell, and explicitly allowlisted compatibility helpers. `internal/controllerutil/flat_controller_boundary_test.go` rejects unclassified additions. Do not add new business ownership to either flat package.'
          assert old_agents in agents
          agents_path.write_text(agents.replace(old_agents, new_agents, 1))

          convergence_path = backend / 'ARCHITECTURE_CONVERGENCE.md'
          convergence = convergence_path.read_text()
          old_row = '| **Page** | Pages; `pages` | `internal/page/{domain,repository,service,controller}` | Feed, Agent and Tool use canonical service. | Page service/repository. | **Canonical implementation; remaining contracts tracked below.** Shared root Page model aliases remain only where cross-capability model sharing is real. |'
          new_row = '| **Page** | Pages; `pages` | `internal/page/{domain,repository,service,controller}` | Feed, Agent and Tool use canonical service; Access/Agent/Tool consumers that need Page values import `internal/page/domain` directly. | Page service/repository. | **Canonical implementation; root Page compatibility aliases retired.** |'
          assert old_row in convergence
          convergence = convergence.replace(old_row, new_row, 1)

          old_inventory = '| `internal/domain` Agent/Workflow/Operations/Post/Page models | Deliberate model migration boundary, not automatically a facade | Multiple capabilities | Classify each model as capability-owned, shared kernel, cross-capability contract or transport DTO before moving. Never move solely for directory symmetry. |'
          new_inventory = '| `internal/domain` Agent/Workflow/Operations/Post models | Deliberate model migration boundary, not automatically a facade | Multiple capabilities | Classify each remaining model as capability-owned, shared kernel, cross-capability contract or transport DTO before moving. Never move solely for directory symmetry. |'
          assert old_inventory in convergence
          convergence = convergence.replace(old_inventory, new_inventory, 1)

          old_classification = '- **C — intentionally shared pending model-boundary decision:** root `internal/domain` types with real cross-capability consumers. These must not be duplicated or moved just to empty the directory.'
          new_classification = '- **C — intentionally shared pending model-boundary decision:** remaining root `internal/domain` Agent/Workflow/Operations/Post types with real cross-capability consumers. Page has been classified as capability-owned and its root aliases are retired. Remaining models must not be duplicated or moved just to empty the directory.'
          assert old_classification in convergence
          convergence = convergence.replace(old_classification, new_classification, 1)

          old_priority = '2. **Shared-model classification:** classify remaining root `internal/domain` models only where a real capability/shared-kernel decision is needed; never move them for directory symmetry.'
          new_priority = '2. **Shared-model classification:** Page is complete; classify remaining Agent/Workflow/Operations/Post root models only where a real capability/shared-kernel/contract decision is needed; never move them for directory symmetry.'
          assert old_priority in convergence
          convergence = convergence.replace(old_priority, new_priority, 1)

          completed = 'and **flat-controller boundary freeze** now use canonical ownership boundaries'
          assert completed in convergence
          convergence = convergence.replace(completed, 'and **flat-controller boundary freeze**, and **Page domain alias retirement** now use canonical ownership boundaries', 1)

          anchor = '### Flat-controller boundary freeze — 2026-09-14\n'
          assert anchor in convergence
          section = dedent('''\
          ### Page domain alias retirement — 2026-09-14

          - `internal/page/domain` is the sole owner of Page, PageStatus, PageTemplate and AdminPageFilter model symbols; the root `internal/domain/page.go` compatibility alias file is retired.
          - Access policy, Agent approval and Blog Tool consumers import the Page-owned domain directly where they need Page values; Page behavior remains behind the canonical Page service.
          - `internal/page/domain/ownership_test.go` scans backend Go imports/selector usage and rejects reintroduction of Page symbols through the root `internal/domain` package.
          - No Page HTTP route, persistence behavior, approval semantics, Access authorization rule, BFF behavior or Connector behavior changes in this slice.


          ''')
          convergence_path.write_text(convergence.replace(anchor, section + anchor, 1))
          PY

      - name: Format
        working-directory: blog-backend
        run: gofmt -w internal/access/policy.go internal/access/policy_test.go internal/agent/approval.go internal/tool/blog_tools.go internal/tool/content_audit.go internal/page/domain/ownership_test.go

      - name: Focused tests
        working-directory: blog-backend
        run: go test ./internal/page/... ./internal/access ./internal/agent ./internal/tool

      - name: Focused vet
        working-directory: blog-backend
        run: go vet ./internal/page/... ./internal/access ./internal/agent ./internal/tool

      - name: Page ownership guards
        working-directory: blog-backend
        run: |
          test ! -e internal/domain/page.go
          go test ./internal/page/domain -run TestRootPageCompatibilityAliasesStayRetired -count=1

      - name: Security and hold diff guards
        run: |
          git diff --exit-code c03913ef41f24ed08613f4a267ea5d0b501bab85 -- \
            blog-backend/internal/controller/access_controller.go \
            blog-backend/internal/authbff \
            blog-backend/internal/connector

      - name: Commit validated source and self-clean
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm .github/workflows/page-domain-alias-retirement-staging.yml
          git add AGENTS.md blog-backend
          git commit -m "refactor(page): retire root domain aliases"
          git push origin HEAD:refactor/page-domain-alias-retirement

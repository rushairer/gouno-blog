name: Prettier diagnostic

on:
  push:
    paths:
      - ".github/workflows/prettier-diagnostic.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Show exact Prettier diff
        shell: bash
        run: |
          npx prettier --write src/pages/AccountNotifications.tsx
          git diff -- src/pages/AccountNotifications.tsx

name: Design system formatter

on:
  push:
    branches:
      - chore/design-system-alignment-20260904

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chore/design-system-alignment-20260904
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format shared UI files
        run: npm run format
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/Badge.tsx src/components/ui/Button.tsx src/components/ui/Dialog.tsx src/styles/design-system-alignment.css
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): apply repository prettier"
            git push origin HEAD:chore/design-system-alignment-20260904
          fi

name: Design system formatter

on:
  push:
    branches:
      - chore/design-system-alignment-20260904

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format shared UI files
        run: npm run format
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gouno-blog-formatted-ui
          if-no-files-found: error
          retention-days: 1
          path: |
            blog-frontend/src/components/ui/Badge.tsx
            blog-frontend/src/components/ui/Button.tsx
            blog-frontend/src/components/ui/Dialog.tsx
            blog-frontend/src/styles/design-system-alignment.css

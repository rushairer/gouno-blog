name: Apply workflow media boundary migration

on:
  push:
    branches:
      - refactor/workflow-media-candidate-boundary
    paths:
      - scripts/apply-workflow-media-candidate-boundary.py
      - .github/workflows/apply-workflow-media-boundary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/workflow-media-candidate-boundary
          fetch-depth: 0

      - name: Apply deterministic migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-workflow-media-candidate-boundary.py')
          source = path.read_text()
          start = source.index('completed_marker = "## Completed convergence slices\\n"')
          end = source.index('write(conv, conv_content)', start)
          path.write_text(source[:start] + source[end:])
          PY
          python3 scripts/apply-workflow-media-candidate-boundary.py

      - name: Format Go sources
        run: |
          cd blog-backend
          gofmt -w internal/agent internal/workflow cmd/gouno/web.go

      - name: Verify ownership boundary
        run: |
          if grep -R --include='*.go' --exclude='*_test.go' -n 'ai_media_candidates' blog-backend/internal/workflow; then
            echo 'Workflow production code still queries Agent-owned ai_media_candidates' >&2
            exit 1
          fi

      - name: Run focused tests
        run: |
          cd blog-backend
          go test ./internal/agent ./internal/workflow/...
          go vet ./internal/agent ./internal/workflow/... ./cmd/gouno/...

      - name: Remove one-shot migration machinery
        run: |
          rm scripts/apply-workflow-media-candidate-boundary.py
          rm .github/workflows/apply-workflow-media-boundary.yml

      - name: Commit migrated sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(workflow): converge media candidate boundary'
          git push origin HEAD:refactor/workflow-media-candidate-boundary

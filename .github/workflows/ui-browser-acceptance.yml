name: UI Browser Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - "blog-frontend/**"
      - ".github/workflows/ui-browser-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    name: Blog product rendered acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: blog-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install product dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: cd e2e && npm install --package-lock=false

      - name: Install Chromium
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run rendered acceptance
        run: cd e2e && npx playwright test --config=playwright.config.mjs

      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blog-browser-acceptance
          path: |
            blog-frontend/playwright-report
            blog-frontend/test-results
          if-no-files-found: warn
          retention-days: 7

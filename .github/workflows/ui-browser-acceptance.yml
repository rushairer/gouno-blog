name: UI Browser Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - "blog-frontend/**"
      - ".github/workflows/ui-browser-acceptance.yml"
  push:
    branches:
      - main
    paths:
      - "blog-frontend/**"
      - ".github/workflows/ui-browser-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    name: Blog product rendered acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: blog-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            blog-frontend/package-lock.json
            blog-frontend/e2e/package-lock.json

      - name: Install product dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: cd e2e && npm ci

      - name: Audit isolated Playwright dependencies
        run: cd e2e && npm audit --audit-level=moderate

      - name: Install Chromium
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run rendered acceptance
        run: cd e2e && npx playwright test --config=playwright.config.mjs

      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blog-browser-acceptance-${{ github.run_id }}
          path: |
            blog-frontend/playwright-report
            blog-frontend/test-results
          if-no-files-found: warn
          retention-days: 14

name: Sync Backend Go Lockfile Once

on:
  push:
    branches: [refactor/backend-codegen-v1]
    paths:
      - .github/workflows/sync-backend-go-lockfile-once.yml

permissions:
  contents: write

concurrency:
  group: sync-backend-go-lockfile-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/backend-codegen-v1
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Regenerate lockfile and self-clean
        shell: bash
        run: |
          set -euo pipefail

          cd blog-backend
          go mod tidy
          cd ..

          rm .github/workflows/sync-backend-go-lockfile-once.yml
          git add blog-backend/go.mod blog-backend/go.sum .github/workflows/sync-backend-go-lockfile-once.yml

          if git diff --cached --quiet; then
            echo "No lockfile changes were required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(backend): regenerate Go dependency lockfile"
          git push origin HEAD:refactor/backend-codegen-v1

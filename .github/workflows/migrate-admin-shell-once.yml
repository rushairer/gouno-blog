name: Migrate Blog AdminShell Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-admin-shell-once.yml

permissions:
  contents: write

concurrency:
  group: migrate-blog-admin-shell-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Apply canonical AdminShell migration and verify
        shell: bash
        run: |
          set -euo pipefail

          cp .github/migrations/admin-shell/AdminShell.tsx blog-frontend/src/layouts/AdminShell.tsx
          cp .github/migrations/admin-shell/AdminShell.test.tsx blog-frontend/src/layouts/__tests__/AdminShell.test.tsx

          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';

          const allowlistPath = 'blog-frontend/scripts/legacy-ui-allowlist.json';
          const targetFile = 'src/layouts/AdminShell.tsx';
          const symbols = [
            'AdminShell',
            'Button',
            'ButtonLink',
            'Feedback',
            'IconButton',
            'ThemeToggle',
          ];
          const allowlist = JSON.parse(await readFile(allowlistPath, 'utf8'));
          allowlist.canonicalSourceSha = '0ba9fabda8e61f3a278b3fb5f37b8f671c167abb';

          let removedPairs = 0;
          for (const symbol of symbols) {
            const files = allowlist.allowedLegacyImports?.[symbol];
            if (!Array.isArray(files) || !files.includes(targetFile)) {
              throw new Error(`Expected ${symbol} legacy pair for ${targetFile}`);
            }
            const next = files.filter((file) => file !== targetFile);
            removedPairs += files.length - next.length;
            if (next.length) allowlist.allowedLegacyImports[symbol] = next;
            else delete allowlist.allowedLegacyImports[symbol];
          }
          if (removedPairs !== 6) {
            throw new Error(`Expected exactly 6 legacy pairs for ${targetFile}, removed ${removedPairs}`);
          }
          await writeFile(allowlistPath, `${JSON.stringify(allowlist, null, 2)}\n`);
          EOF

          cd blog-frontend
          npm ci
          npx prettier --write \
            src/layouts/AdminShell.tsx \
            src/layouts/__tests__/AdminShell.test.tsx \
            scripts/legacy-ui-allowlist.json
          npm run test:run -- src/layouts/__tests__/AdminShell.test.tsx
          npm run quality
          cd ..
          docker build -f blog-frontend/Dockerfile blog-frontend

      - name: Commit verified migration and self-clean
        shell: bash
        run: |
          set -euo pipefail

          if grep -n "@gouno/ui-legacy" blog-frontend/src/layouts/AdminShell.tsx; then
            echo "AdminShell still imports legacy UI" >&2
            exit 1
          fi
          grep -q 'AppShell' blog-frontend/src/layouts/AdminShell.tsx
          grep -q '@gouno/ui/theme' blog-frontend/src/layouts/AdminShell.tsx

          rm -rf .github/migrations/admin-shell
          rm .github/workflows/migrate-admin-shell-once.yml

          git add \
            blog-frontend/src/layouts/AdminShell.tsx \
            blog-frontend/src/layouts/__tests__/AdminShell.test.tsx \
            blog-frontend/scripts/legacy-ui-allowlist.json \
            .github/migrations/admin-shell \
            .github/workflows/migrate-admin-shell-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ui): migrate Blog AdminShell to canonical Gouno UI"
          git push origin HEAD:main

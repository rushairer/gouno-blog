name: Migrate Blog Button Leaves Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-button-leaves-once.yml

permissions:
  contents: write

concurrency:
  group: migrate-blog-button-leaves-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Apply canonical Button leaf migrations and verify
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'EOF'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import path from 'node:path';

          const replaceRequired = (source, from, to, label) => {
            if (!source.includes(from)) throw new Error(`Expected ${label} was not found`);
            return source.replace(from, to);
          };

          const markdownPath = 'blog-frontend/src/components/MarkdownRenderer.tsx';
          let markdown = await readFile(markdownPath, 'utf8');
          markdown = replaceRequired(markdown, 'import { Button } from "@gouno/ui-legacy";', 'import { Button } from "@gouno/ui/core";', 'MarkdownRenderer legacy Button import');
          await writeFile(markdownPath, markdown);

          const mediaPath = 'blog-frontend/src/components/media/MediaDrawerForms.tsx';
          let media = await readFile(mediaPath, 'utf8');
          media = replaceRequired(media, 'import { Field, Input, OverlayForm, Textarea } from "@gouno/ui/core";', 'import { Button, Field, Input, OverlayForm, Textarea } from "@gouno/ui/core";', 'MediaDrawerForms canonical import');
          media = replaceRequired(media, 'import { Button, Feedback, FormActions } from "@gouno/ui-legacy";', 'import { Feedback, FormActions } from "@gouno/ui-legacy";', 'MediaDrawerForms legacy Button import');
          media = media.replaceAll('variant="secondary"', 'variant="outline"').replaceAll('variant="primary"', 'variant="solid"');
          await writeFile(mediaPath, media);

          const articlePath = 'blog-frontend/src/components/agent/ArticlePreviewModal.tsx';
          let article = await readFile(articlePath, 'utf8');
          article = replaceRequired(article, 'import { Button } from "@gouno/ui-legacy";', 'import { Button } from "@gouno/ui/core";', 'ArticlePreviewModal legacy Button import');
          article = article.replaceAll('variant="secondary"', 'variant="outline"').replaceAll('variant="primary"', 'variant="solid"');
          await writeFile(articlePath, article);

          for (const file of ['StalePostsConfig.tsx', 'LowEngagementConfig.tsx', 'KnowledgeSearchConfig.tsx']) {
            const filePath = `blog-frontend/src/components/agent/tools/${file}`;
            let source = await readFile(filePath, 'utf8');
            source = replaceRequired(source, 'import { Field, Input } from "@gouno/ui/core";', 'import { Button, Field, Input } from "@gouno/ui/core";', `${file} canonical import`);
            source = replaceRequired(source, 'import { Button } from "@gouno/ui-legacy";', '', `${file} legacy Button import`);
            await writeFile(filePath, source);
          }

          const distributionPath = 'blog-frontend/src/components/agent/tools/DistributionDraftConfig.tsx';
          let distribution = await readFile(distributionPath, 'utf8');
          distribution = replaceRequired(distribution, 'import { Field } from "@gouno/ui/core";', 'import { Button, Field } from "@gouno/ui/core";', 'DistributionDraftConfig canonical import');
          distribution = replaceRequired(distribution, 'import { Button, Select } from "@gouno/ui-legacy";', 'import { Select } from "@gouno/ui-legacy";', 'DistributionDraftConfig legacy Button import');
          await writeFile(distributionPath, distribution);

          const rssPath = 'blog-frontend/src/components/agent/tools/RssFetchConfig.tsx';
          let rss = await readFile(rssPath, 'utf8');
          rss = replaceRequired(rss, 'import { Field, Input } from "@gouno/ui/core";', 'import { Button, Field, Input } from "@gouno/ui/core";', 'RssFetchConfig canonical import');
          rss = replaceRequired(rss, 'import { Button } from "@gouno/ui-legacy";', '', 'RssFetchConfig legacy Button import');
          rss = rss.replaceAll('variant="secondary"', 'variant="outline"').replaceAll('size="compact"', 'size="small"');
          await writeFile(rssPath, rss);

          const manifest = JSON.parse(await readFile('blog-frontend/vendor/ui-manifest.json', 'utf8'));
          if (manifest.name !== '@gouno/ui' || manifest.version !== '0.3.0' || manifest.sourceSha !== '970bc1b0ad49de7b233901a5faf03c63dfa05892') {
            throw new Error(`Unexpected canonical Gouno UI provenance: ${manifest.name}@${manifest.version} ${manifest.sourceSha}`);
          }

          const allowlistPath = 'blog-frontend/scripts/legacy-ui-allowlist.json';
          const targets = [
            'src/components/MarkdownRenderer.tsx',
            'src/components/media/MediaDrawerForms.tsx',
            'src/components/agent/ArticlePreviewModal.tsx',
            'src/components/agent/tools/StalePostsConfig.tsx',
            'src/components/agent/tools/LowEngagementConfig.tsx',
            'src/components/agent/tools/KnowledgeSearchConfig.tsx',
            'src/components/agent/tools/DistributionDraftConfig.tsx',
            'src/components/agent/tools/RssFetchConfig.tsx',
          ];
          const allowlist = JSON.parse(await readFile(allowlistPath, 'utf8'));
          allowlist.canonicalPackage = manifest.name;
          allowlist.canonicalVersion = manifest.version;
          allowlist.canonicalSourceSha = manifest.sourceSha;
          const buttonFiles = allowlist.allowedLegacyImports?.Button;
          if (!Array.isArray(buttonFiles)) throw new Error('Expected Button legacy allowlist');
          for (const target of targets) {
            if (!buttonFiles.includes(target)) throw new Error(`Expected Button legacy pair for ${target}`);
          }
          const nextButtonFiles = buttonFiles.filter((file) => !targets.includes(file));
          if (buttonFiles.length - nextButtonFiles.length !== targets.length) {
            throw new Error(`Expected exactly ${targets.length} Button legacy pairs to be removed`);
          }
          if (nextButtonFiles.length) allowlist.allowedLegacyImports.Button = nextButtonFiles;
          else delete allowlist.allowedLegacyImports.Button;
          await writeFile(allowlistPath, `${JSON.stringify(allowlist, null, 2)}\n`);

          const walk = async (dir) => {
            const entries = await readdir(dir, { withFileTypes: true });
            const result = [];
            for (const entry of entries) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) result.push(...(await walk(full)));
              else if (/\.(ts|tsx)$/.test(entry.name)) result.push(full);
            }
            return result;
          };
          const sourceFiles = await walk('blog-frontend/src');
          let canonicalFiles = 0;
          let legacyFiles = 0;
          for (const file of sourceFiles) {
            const text = await readFile(file, 'utf8');
            if (/from\s+["']@gouno\/ui\/(?:core|theme|patterns|gouno)["']/.test(text)) canonicalFiles += 1;
            if (text.includes('@gouno/ui-legacy')) legacyFiles += 1;
          }
          const legacySymbols = Object.keys(allowlist.allowedLegacyImports ?? {}).length;
          const legacyPairs = Object.values(allowlist.allowedLegacyImports ?? {}).reduce((sum, value) => sum + (Array.isArray(value) ? value.length : 0), 0);

          const migrationMdPath = 'docs/ui-redesign/MIGRATION.md';
          let migrationMd = await readFile(migrationMdPath, 'utf8');
          migrationMd = replaceRequired(migrationMd, '## Shared package and distribution evidence — current boundary (2026-09-11)', '## Shared package and distribution evidence — current boundary (2026-09-12)', 'current boundary date');
          migrationMd = migrationMd.replace(
            /- Gosso Admin consumes the external canonical `@gouno\/ui@[^`]+` artifact built from `rushairer\/gouno-ui@[^`]+`; its vendored tgz SHA-256 is `[^`]+` and its version-aware sync path has been verified as a true no-op when upstream has not changed\./,
            `- Gosso Admin consumes the external canonical \`@gouno/ui@${manifest.version}\` artifact built from \`rushairer/gouno-ui@${manifest.sourceSha}\`; its vendored tgz SHA-256 is \`${manifest.sha256}\` and its version-aware sync path has been verified as a true no-op when upstream has not changed.`,
          );
          migrationMd = migrationMd.replace(
            /- Gouno Blog now uses the same verified external artifact as canonical `@gouno\/ui@[^`]+`, while the historical local `packages\/ui@0\.1\.0` is isolated as explicit `@gouno\/ui-legacy` compatibility prior art\./,
            `- Gouno Blog now uses the same verified external artifact as canonical \`@gouno/ui@${manifest.version}\`, while the historical local \`packages/ui@0.1.0\` is isolated as explicit \`@gouno/ui-legacy\` compatibility prior art.`,
          );
          const boundaryPattern = /The audited migration boundary contains \d+ source files using canonical layer subpaths and \d+ files with explicit legacy imports; legacy debt is fixed at \d+ symbols \/ \d+ symbol-file pairs/;
          if (!boundaryPattern.test(migrationMd)) throw new Error('Expected shared-package migration boundary statistics were not found');
          migrationMd = migrationMd.replace(boundaryPattern, `The audited migration boundary contains ${canonicalFiles} source files using canonical layer subpaths and ${legacyFiles} files with explicit legacy imports; legacy debt is fixed at ${legacySymbols} symbols / ${legacyPairs} symbol-file pairs`);
          migrationMd = migrationMd.replace(
            /- The 0\.2\.0 rollout preserved the Connector hold: Connector behavior was not changed and ConnectorWorkspace regressions remained green through the migration\./,
            `- The ${manifest.version} synchronization preserved the Connector hold: Connector behavior was not changed and ConnectorWorkspace regressions remained green through the full frontend quality gate.`,
          );
          if (!migrationMd.includes(`@gouno/ui@${manifest.version}`) || !migrationMd.includes(manifest.sourceSha) || !migrationMd.includes(manifest.sha256)) {
            throw new Error('Current-boundary Gouno UI provenance was not updated');
          }
          await writeFile(migrationMdPath, migrationMd);
          EOF

          cd blog-frontend
          npm ci
          npx prettier --write \
            src/components/MarkdownRenderer.tsx \
            src/components/media/MediaDrawerForms.tsx \
            src/components/agent/ArticlePreviewModal.tsx \
            src/components/agent/tools/StalePostsConfig.tsx \
            src/components/agent/tools/LowEngagementConfig.tsx \
            src/components/agent/tools/KnowledgeSearchConfig.tsx \
            src/components/agent/tools/DistributionDraftConfig.tsx \
            src/components/agent/tools/RssFetchConfig.tsx \
            scripts/legacy-ui-allowlist.json
          npm run test:run -- \
            src/pages/__tests__/PostDetail.test.tsx \
            src/pages/admin/__tests__/MediaLibrary.test.tsx \
            src/components/agent/__tests__/WorkflowRunRecords.test.tsx \
            src/components/agent/tools/__tests__/SpecializedTools.test.tsx \
            src/components/agent/tools/__tests__/RssFetchConfig.test.tsx
          npm run quality
          cd ..
          docker build -f blog-frontend/Dockerfile blog-frontend

      - name: Commit verified migrations and self-clean
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            blog-frontend/src/components/MarkdownRenderer.tsx \
            blog-frontend/src/components/agent/ArticlePreviewModal.tsx \
            blog-frontend/src/components/agent/tools/StalePostsConfig.tsx \
            blog-frontend/src/components/agent/tools/LowEngagementConfig.tsx \
            blog-frontend/src/components/agent/tools/KnowledgeSearchConfig.tsx \
            blog-frontend/src/components/agent/tools/RssFetchConfig.tsx; do
            if grep -n '@gouno/ui-legacy' "$file"; then
              echo "$file still imports legacy UI" >&2
              exit 1
            fi
            grep -q '@gouno/ui/core' "$file"
          done
          grep -q '@gouno/ui/core' blog-frontend/src/components/agent/tools/DistributionDraftConfig.tsx
          grep -q 'import { Select } from "@gouno/ui-legacy";' blog-frontend/src/components/agent/tools/DistributionDraftConfig.tsx
          grep -q '@gouno/ui/core' blog-frontend/src/components/media/MediaDrawerForms.tsx
          grep -q 'import { Feedback, FormActions } from "@gouno/ui-legacy";' blog-frontend/src/components/media/MediaDrawerForms.tsx
          grep -q 'variant="solid"' blog-frontend/src/components/media/MediaDrawerForms.tsx
          grep -q 'variant="outline"' blog-frontend/src/components/media/MediaDrawerForms.tsx
          grep -q 'size="small"' blog-frontend/src/components/agent/tools/RssFetchConfig.tsx
          grep -q '"canonicalVersion": "0.3.0"' blog-frontend/scripts/legacy-ui-allowlist.json
          grep -q '970bc1b0ad49de7b233901a5faf03c63dfa05892' blog-frontend/scripts/legacy-ui-allowlist.json
          grep -q 'current boundary (2026-09-12)' docs/ui-redesign/MIGRATION.md

          rm .github/workflows/migrate-button-leaves-once.yml

          git add \
            blog-frontend/src/components/MarkdownRenderer.tsx \
            blog-frontend/src/components/media/MediaDrawerForms.tsx \
            blog-frontend/src/components/agent/ArticlePreviewModal.tsx \
            blog-frontend/src/components/agent/tools/StalePostsConfig.tsx \
            blog-frontend/src/components/agent/tools/LowEngagementConfig.tsx \
            blog-frontend/src/components/agent/tools/KnowledgeSearchConfig.tsx \
            blog-frontend/src/components/agent/tools/DistributionDraftConfig.tsx \
            blog-frontend/src/components/agent/tools/RssFetchConfig.tsx \
            blog-frontend/scripts/legacy-ui-allowlist.json \
            docs/ui-redesign/MIGRATION.md \
            .github/workflows/migrate-button-leaves-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ui): migrate Blog Button leaves to canonical Gouno UI"
          git push origin HEAD:main

name: Temporary Inbox Canonical Button Fix

on:
  push:
    branches: [ui/blog-admin-final-parity-ai-ops-inbox]
    paths:
      - .github/workflows/tmp-fix-inbox-native-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ui/blog-admin-final-parity-ai-ops-inbox
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Replace native approval row button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("blog-frontend/src/components/agent/InboxWorkspace.tsx")
          source = path.read_text()
          pattern = re.compile(
              r"(?P<indent>[ \t]*)<button\s*\n\s*key=\{approval\.id\}[\s\S]*?</button>"
          )
          matches = list(pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(f"expected one approval row native button, found {len(matches)}")
          match = matches[0]
          indent = match.group("indent")
          block = '''<Button
            key={approval.id}
            type="button"
            variant="ghost"
            aria-pressed={selected?.id === approval.id}
            className={`h-auto w-full justify-start rounded-none border-b p-4 text-left transition-colors last:border-b-0 hover:bg-muted/40 ${selected?.id === approval.id ? "bg-muted/50" : ""}`}
            onClick={() => onSelect(approval)}
          >
            <span className="flex w-full items-start justify-between gap-3 text-left">
              <span className="min-w-0">
                <strong className="block text-sm">{summary.title}</strong>
                <span className="text-xs text-muted-foreground">
                  {zh
                    ? `来自 AI 运行 #${approval.run_id}`
                    : `From AI run #${approval.run_id}`}
                </span>
              </span>
              <Tag color={approvalStatusColor(approval)}>
                {approvalStatusLabel(approval, zh)}
              </Tag>
            </span>
          </Button>'''
          replacement = "\n".join(indent + line if line else line for line in block.splitlines())
          path.write_text(source[: match.start()] + replacement + source[match.end() :])
          PY
      - name: Verify targeted frontend contracts
        working-directory: blog-frontend
        run: |
          npm ci
          npx prettier --write src/components/agent/InboxWorkspace.tsx
          npm run lint:ui
          npx vitest run src/components/agent/__tests__/InboxWorkspace.test.tsx
          npx tsc -b
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-inbox-native-button.yml
          git add blog-frontend/src/components/agent/InboxWorkspace.tsx .github/workflows/tmp-fix-inbox-native-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): use canonical button for inbox approval rows"
          git push origin HEAD:ui/blog-admin-final-parity-ai-ops-inbox

name: Provider Prettier Diagnostic

on:
  push:
    branches:
      - feat/u04b-provider-vendor-protocol
    paths:
      - blog-frontend/src/components/agent/ProviderForm.tsx
      - .github/workflows/provider-prettier-diagnostic.yml

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          cp src/components/agent/ProviderForm.tsx /tmp/ProviderForm.before.tsx
          npx prettier --write src/components/agent/ProviderForm.tsx
          diff -u /tmp/ProviderForm.before.tsx src/components/agent/ProviderForm.tsx || true

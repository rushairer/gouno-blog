name: Migrate Blog Editor Leaves Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-editor-leaves-once.yml

permissions:
  contents: write

concurrency:
  group: migrate-blog-editor-leaves-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Apply canonical editor leaf migrations and verify
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';

          const aiPath = 'blog-frontend/src/components/editor/AiSuggestionControl.tsx';
          const aiSource = await readFile(aiPath, 'utf8');
          const aiLegacy = 'import { Button } from "@gouno/ui-legacy";';
          if (!aiSource.includes(aiLegacy)) {
            throw new Error('Expected AiSuggestionControl legacy Button import was not found');
          }
          await writeFile(
            aiPath,
            aiSource.replace(aiLegacy, 'import { Button } from "@gouno/ui/core";'),
          );

          const framePath = 'blog-frontend/src/components/editor/ContentEditorFrame.tsx';
          const frameSource = await readFile(framePath, 'utf8');
          const frameLegacy = 'import { classes } from "@gouno/ui-legacy";';
          if (!frameSource.includes(frameLegacy)) {
            throw new Error('Expected ContentEditorFrame legacy classes import was not found');
          }
          await writeFile(
            framePath,
            frameSource
              .replace(frameLegacy, 'import { cn } from "@gouno/ui";')
              .replace(/\bclasses\(/g, 'cn('),
          );

          const allowlistPath = 'blog-frontend/scripts/legacy-ui-allowlist.json';
          const removals = new Map([
            ['Button', 'src/components/editor/AiSuggestionControl.tsx'],
            ['classes', 'src/components/editor/ContentEditorFrame.tsx'],
          ]);
          const allowlist = JSON.parse(await readFile(allowlistPath, 'utf8'));
          allowlist.canonicalSourceSha = '0ba9fabda8e61f3a278b3fb5f37b8f671c167abb';
          let removedPairs = 0;
          for (const [symbol, targetFile] of removals) {
            const files = allowlist.allowedLegacyImports?.[symbol];
            if (!Array.isArray(files) || !files.includes(targetFile)) {
              throw new Error(`Expected ${symbol} legacy pair for ${targetFile}`);
            }
            const next = files.filter((file) => file !== targetFile);
            removedPairs += files.length - next.length;
            if (next.length) allowlist.allowedLegacyImports[symbol] = next;
            else delete allowlist.allowedLegacyImports[symbol];
          }
          if (removedPairs !== 2) {
            throw new Error(`Expected exactly 2 legacy editor pairs, removed ${removedPairs}`);
          }
          await writeFile(allowlistPath, `${JSON.stringify(allowlist, null, 2)}\n`);
          EOF

          cd blog-frontend
          npm ci
          npx prettier --write \
            src/components/editor/AiSuggestionControl.tsx \
            src/components/editor/ContentEditorFrame.tsx \
            scripts/legacy-ui-allowlist.json
          npm run test:run -- src/components/editor/__tests__/ContentEditorFrame.test.tsx
          npm run quality
          cd ..
          docker build -f blog-frontend/Dockerfile blog-frontend

      - name: Commit verified migrations and self-clean
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            blog-frontend/src/components/editor/AiSuggestionControl.tsx \
            blog-frontend/src/components/editor/ContentEditorFrame.tsx; do
            if grep -n "@gouno/ui-legacy" "$file"; then
              echo "$file still imports legacy UI" >&2
              exit 1
            fi
          done
          grep -q '@gouno/ui/core' blog-frontend/src/components/editor/AiSuggestionControl.tsx
          grep -q '@gouno/ui"' blog-frontend/src/components/editor/ContentEditorFrame.tsx

          rm .github/workflows/migrate-editor-leaves-once.yml

          git add \
            blog-frontend/src/components/editor/AiSuggestionControl.tsx \
            blog-frontend/src/components/editor/ContentEditorFrame.tsx \
            blog-frontend/scripts/legacy-ui-allowlist.json \
            .github/workflows/migrate-editor-leaves-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ui): migrate Blog editor leaves to canonical Gouno UI"
          git push origin HEAD:main

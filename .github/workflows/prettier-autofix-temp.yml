name: Temporary Prettier Autofix

on:
  push:
    branches:
      - chore/restore-frontend-formatting

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chore/restore-frontend-formatting
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Format frontend
        working-directory: blog-frontend
        run: npm run format
      - name: Commit formatting only
        run: |
          if git diff --quiet -- blog-frontend/src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src
          git commit -m "chore(frontend): restore prettier formatting"
          git push origin HEAD:chore/restore-frontend-formatting

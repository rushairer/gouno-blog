name: U04a Format Fix

on:
  push:
    branches:
      - ui/u04a-browser-acceptance-20260913

permissions:
  contents: write

jobs:
  format-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/u04a-browser-acceptance-20260913
          fetch-depth: 0
      - name: Restore canonical indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('blog-frontend/src/pages/admin/AISettings.tsx')
          text = path.read_text()
          bad_proxy = '''  const labels = new Proxy({} as Record<string, string>, {
  get: (_, prop: string | symbol) =>
    typeof prop === "string" ? t(`agent.${prop}` as any) : undefined,
});'''
          good_proxy = '''  const labels = new Proxy({} as Record<string, string>, {
    get: (_, prop: string | symbol) =>
      typeof prop === "string" ? t(`agent.${prop}` as any) : undefined,
  });'''
          if bad_proxy not in text:
              raise SystemExit('expected unformatted labels Proxy block not found')
          text = text.replace(bad_proxy, good_proxy, 1)

          bad_nav = '''    const url = new URL(window.location.href);
  if (next === "agents") url.searchParams.delete("section");
  else url.searchParams.set("section", next);
  window.history.replaceState(null, "", url);'''
          good_nav = '''    const url = new URL(window.location.href);
    if (next === "agents") url.searchParams.delete("section");
    else url.searchParams.set("section", next);
    window.history.replaceState(null, "", url);'''
          if bad_nav not in text:
              raise SystemExit('expected unformatted selectSection block not found')
          text = text.replace(bad_nav, good_nav, 1)
          path.write_text(text)
          PY

          rm -f .github/workflows/u04a-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(ui): normalize AI settings formatting"
          git push origin HEAD:ui/u04a-browser-acceptance-20260913

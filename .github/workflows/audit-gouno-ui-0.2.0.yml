name: Finalize Gouno UI 0.2.0 Import Audit

on:
  push:
    branches: [chore/gouno-ui-0.2.0]
    paths:
      - .github/workflows/audit-gouno-ui-0.2.0.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blog migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: chore/gouno-ui-0.2.0
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install Blog frontend dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Generate final canonical and legacy import evidence
        run: |
          node --input-type=module <<'EOF'
          import { readdir, readFile, writeFile, mkdir } from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const frontendRoot = path.resolve('blog-frontend');
          const srcRoot = path.join(frontendRoot, 'src');
          const ts = await import(pathToFileURL(path.join(frontendRoot, 'node_modules/typescript/lib/typescript.js')));
          const canonicalManifest = JSON.parse(await readFile(path.join(frontendRoot, 'vendor/ui-manifest.json'), 'utf8'));
          const legacyManifest = JSON.parse(await readFile(path.join(frontendRoot, 'vendor/legacy-ui-manifest.json'), 'utf8'));

          const files = [];
          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) await walk(full);
              else if (/\.(?:ts|tsx)$/.test(entry.name)) files.push(full);
            }
          }
          await walk(srcRoot);

          const canonicalModules = new Set([
            '@gouno/ui/core',
            '@gouno/ui/theme',
            '@gouno/ui/patterns',
            '@gouno/ui/gouno',
          ]);
          const canonicalFiles = new Set();
          const rootFiles = new Set();
          const legacyFiles = new Set();
          const legacyUsage = new Map();
          const unsupportedLegacyImports = [];

          for (const file of files) {
            const source = await readFile(file, 'utf8');
            const sourceFile = ts.createSourceFile(
              file,
              source,
              ts.ScriptTarget.Latest,
              true,
              file.endsWith('.tsx') ? ts.ScriptKind.TSX : ts.ScriptKind.TS,
            );
            for (const statement of sourceFile.statements) {
              if (!ts.isImportDeclaration(statement) || !ts.isStringLiteral(statement.moduleSpecifier)) continue;
              const moduleName = statement.moduleSpecifier.text;
              const relativeFile = path.relative(frontendRoot, file);
              if (canonicalModules.has(moduleName)) canonicalFiles.add(relativeFile);
              if (moduleName === '@gouno/ui') rootFiles.add(relativeFile);
              if (moduleName !== '@gouno/ui-legacy') continue;

              legacyFiles.add(relativeFile);
              const clause = statement.importClause;
              if (!clause || clause.name || !clause.namedBindings || !ts.isNamedImports(clause.namedBindings)) {
                unsupportedLegacyImports.push(relativeFile);
                continue;
              }
              for (const element of clause.namedBindings.elements) {
                const imported = element.propertyName?.text ?? element.name.text;
                const record = legacyUsage.get(imported) ?? new Set();
                record.add(relativeFile);
                legacyUsage.set(imported, record);
              }
            }
          }

          if (unsupportedLegacyImports.length) {
            throw new Error(`legacy default/namespace imports are not ratchetable: ${unsupportedLegacyImports.join(', ')}`);
          }

          const allowedLegacyImports = Object.fromEntries(
            [...legacyUsage.entries()]
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([symbol, usedFiles]) => [symbol, [...usedFiles].sort()]),
          );
          const allowlist = {
            schemaVersion: 1,
            canonicalPackage: '@gouno/ui',
            canonicalVersion: canonicalManifest.version,
            canonicalSourceSha: canonicalManifest.sourceSha,
            legacyPackage: '@gouno/ui-legacy',
            legacyVersion: legacyManifest.version,
            allowedLegacyImports,
          };
          await writeFile(
            path.join(frontendRoot, 'scripts/legacy-ui-allowlist.json'),
            `${JSON.stringify(allowlist, null, 2)}\n`,
          );

          const fileList = (values) => [...values].sort().map((file) => `\`${file}\``).join('<br>');
          const legacyRows = Object.entries(allowedLegacyImports).map(
            ([symbol, usedFiles]) => `| \`${symbol}\` | ${usedFiles.length} | ${fileList(usedFiles)} |`,
          );
          const pairCount = Object.values(allowedLegacyImports).reduce((total, usedFiles) => total + usedFiles.length, 0);
          const lines = [
            '# Gouno UI 0.2.0 Blog import-surface audit',
            '',
            `- Canonical package: \`@gouno/ui@${canonicalManifest.version}\``,
            `- Canonical source: \`${canonicalManifest.source}\` @ \`${canonicalManifest.sourceSha}\``,
            `- Canonical archive SHA-256: \`${canonicalManifest.sha256}\``,
            `- Legacy compatibility package: \`@gouno/ui-legacy@${legacyManifest.version}\` from local \`packages/ui\` prior art.`,
            '- The bridge is explicit: there is no global Vite or TypeScript alias redirecting canonical `@gouno/ui` back to legacy.',
            '- Connector behavior was not changed by this migration; ConnectorWorkspace remained under its repository hold and its tests stayed green.',
            '',
            '## Current boundary',
            '',
            `- Source files using canonical layer subpaths: **${canonicalFiles.size}**`,
            `- Source files using canonical package root: **${rootFiles.size}**`,
            `- Source files using explicit legacy package: **${legacyFiles.size}**`,
            `- Distinct legacy symbols: **${Object.keys(allowedLegacyImports).length}**`,
            `- Allowed legacy symbol/file pairs: **${pairCount}**`,
            '',
            'Legacy use is a ratcheted product-compatibility debt, not a second public design-system owner. New legacy symbol/file pairs must fail the UI contract gate until an explicit governance change updates the allowlist.',
            '',
            '## Legacy compatibility allowlist',
            '',
            '| Symbol | Files | Allowed import locations |',
            '| --- | ---: | --- |',
            ...legacyRows,
            '',
          ];
          await mkdir('docs/ui-redesign', { recursive: true });
          await writeFile('docs/ui-redesign/gouno-ui-0.2.0-import-audit.md', `${lines.join('\n')}\n`);
          EOF

      - name: Commit audit and ratchet baseline
        run: |
          set -euo pipefail
          git add docs/ui-redesign/gouno-ui-0.2.0-import-audit.md \
                  blog-frontend/scripts/legacy-ui-allowlist.json
          git diff --cached --exit-code && exit 0 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(ui): record Gouno UI 0.2.0 compatibility boundary"
          git push origin HEAD:chore/gouno-ui-0.2.0

name: Audit Gouno UI 0.2.0 Imports

on:
  push:
    branches: [chore/gouno-ui-0.2.0]
    paths:
      - .github/workflows/audit-gouno-ui-0.2.0.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blog migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: chore/gouno-ui-0.2.0
          fetch-depth: 0

      - name: Checkout exact Gouno UI 0.2.0 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: rushairer/gouno-ui
          ref: 3af2a5ca7d63f30fa531f605e620ba2c3380a2e8
          path: .gouno-ui
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .gouno-ui/package-lock.json

      - name: Build exact canonical package
        working-directory: .gouno-ui
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Audit root imports against canonical owners
        run: |
          node --input-type=module <<'EOF'
          import { readdir, readFile, writeFile, mkdir } from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const uiRoot = path.resolve('.gouno-ui');
          const ts = await import(pathToFileURL(path.join(uiRoot, 'node_modules/typescript/lib/typescript.js')));
          const uiPackage = JSON.parse(await readFile(path.join(uiRoot, 'package.json'), 'utf8'));
          function exportPath(key) {
            const entry = uiPackage.exports?.[key];
            const relativePath = typeof entry === 'string' ? entry : entry?.import;
            if (!relativePath) throw new Error(`missing import target for package export ${key}`);
            return path.resolve(uiRoot, relativePath);
          }

          const runtimeLayers = {
            core: await import(pathToFileURL(exportPath('./core'))),
            theme: await import(pathToFileURL(exportPath('./theme'))),
            patterns: await import(pathToFileURL(exportPath('./patterns'))),
            gouno: await import(pathToFileURL(exportPath('./gouno'))),
            root: await import(pathToFileURL(exportPath('.'))),
          };
          const runtimeOwnerByName = new Map();
          for (const owner of ['core', 'theme', 'patterns', 'gouno']) {
            for (const name of Object.keys(runtimeLayers[owner])) runtimeOwnerByName.set(name, owner);
          }
          const rootOnly = new Set(Object.keys(runtimeLayers.root).filter((name) => !runtimeOwnerByName.has(name)));

          const publicOwnerByName = new Map(runtimeOwnerByName);
          for (const owner of ['core', 'theme', 'patterns', 'gouno']) {
            const indexPath = path.join(uiRoot, 'src', owner, 'index.ts');
            const source = await readFile(indexPath, 'utf8');
            const sourceFile = ts.createSourceFile(indexPath, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
            for (const statement of sourceFile.statements) {
              if (!ts.isExportDeclaration(statement) || !statement.exportClause || !ts.isNamedExports(statement.exportClause)) continue;
              for (const element of statement.exportClause.elements) {
                publicOwnerByName.set(element.name.text, owner);
              }
            }
          }

          const root = path.resolve('blog-frontend/src');
          const files = [];
          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) await walk(full);
              else if (/\.(?:ts|tsx)$/.test(entry.name)) files.push(full);
            }
          }
          await walk(root);

          const usage = new Map();
          const unsupportedImports = [];
          for (const file of files) {
            const source = await readFile(file, 'utf8');
            const sourceFile = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, file.endsWith('.tsx') ? ts.ScriptKind.TSX : ts.ScriptKind.TS);
            for (const statement of sourceFile.statements) {
              if (!ts.isImportDeclaration(statement) || statement.moduleSpecifier.text !== '@gouno/ui') continue;
              const clause = statement.importClause;
              if (!clause) continue;
              if (clause.name || (clause.namedBindings && !ts.isNamedImports(clause.namedBindings))) {
                unsupportedImports.push(path.relative('.', file));
                continue;
              }
              if (!clause.namedBindings) continue;
              for (const element of clause.namedBindings.elements) {
                const imported = element.propertyName?.text ?? element.name.text;
                const typeOnly = clause.isTypeOnly || element.isTypeOnly;
                const record = usage.get(imported) ?? { valueFiles: new Set(), typeFiles: new Set() };
                (typeOnly ? record.typeFiles : record.valueFiles).add(path.relative('.', file));
                usage.set(imported, record);
              }
            }
          }

          const rows = [...usage.entries()].sort(([a], [b]) => a.localeCompare(b));
          const canonicalRuntime = [];
          const legacyRuntime = [];
          const rootOnlyRuntime = [];
          const canonicalTypeOnly = [];
          const legacyTypeOnly = [];
          for (const [name, record] of rows) {
            if (record.valueFiles.size > 0) {
              const owner = runtimeOwnerByName.get(name);
              if (owner) canonicalRuntime.push({ name, owner, files: [...record.valueFiles] });
              else if (rootOnly.has(name)) rootOnlyRuntime.push({ name, files: [...record.valueFiles] });
              else legacyRuntime.push({ name, files: [...record.valueFiles] });
            }
            if (record.typeFiles.size > 0 && record.valueFiles.size === 0) {
              const owner = publicOwnerByName.get(name);
              if (owner) canonicalTypeOnly.push({ name, owner, files: [...record.typeFiles] });
              else legacyTypeOnly.push({ name, files: [...record.typeFiles] });
            }
          }

          const fileList = (files) => files.map((file) => `\`${file}\``).join('<br>');
          const lines = [
            '# Gouno UI 0.2.0 Blog import-surface audit',
            '',
            '- Blog baseline: `a828e8ea2dac9ffb0c1ec03af86211897e7ca252`',
            '- Canonical Gouno UI: `3af2a5ca7d63f30fa531f605e620ba2c3380a2e8` (`0.2.0`)',
            '- Scope: TypeScript-AST parsed exact root imports from `@gouno/ui` under `blog-frontend/src`.',
            '',
            '## Summary',
            '',
            `- Imported symbols: **${rows.length}**`,
            `- Canonical runtime symbols: **${canonicalRuntime.length}**`,
            `- Legacy-only runtime symbols: **${legacyRuntime.length}**`,
            `- Canonical root-only runtime symbols: **${rootOnlyRuntime.length}**`,
            `- Canonical type-only symbols: **${canonicalTypeOnly.length}**`,
            `- Legacy-only type-only symbols: **${legacyTypeOnly.length}**`,
            `- Unsupported default/namespace import files: **${unsupportedImports.length}**`,
            '',
            '## Canonical runtime symbols',
            '',
            '| Symbol | Owner | Value import files |',
            '| --- | --- | --- |',
            ...canonicalRuntime.map(({ name, owner, files }) => `| \`${name}\` | \`${owner}\` | ${fileList(files)} |`),
            '',
            '## Legacy-only runtime symbols',
            '',
            '| Symbol | Value import files |',
            '| --- | --- |',
            ...legacyRuntime.map(({ name, files }) => `| \`${name}\` | ${fileList(files)} |`),
            '',
            '## Canonical root-only runtime symbols',
            '',
            '| Symbol | Value import files |',
            '| --- | --- |',
            ...rootOnlyRuntime.map(({ name, files }) => `| \`${name}\` | ${fileList(files)} |`),
            '',
            '## Canonical type-only symbols',
            '',
            '| Symbol | Owner | Type import files |',
            '| --- | --- | --- |',
            ...canonicalTypeOnly.map(({ name, owner, files }) => `| \`${name}\` | \`${owner}\` | ${fileList(files)} |`),
            '',
            '## Legacy-only type-only symbols',
            '',
            '| Symbol | Type import files |',
            '| --- | --- |',
            ...legacyTypeOnly.map(({ name, files }) => `| \`${name}\` | ${fileList(files)} |`),
            '',
          ];
          if (unsupportedImports.length) {
            lines.push('## Unsupported default/namespace imports', '', ...unsupportedImports.map((file) => `- \`${file}\``), '');
          }

          await mkdir('docs/ui-redesign', { recursive: true });
          await writeFile('docs/ui-redesign/gouno-ui-0.2.0-import-audit.md', `${lines.join('\n')}\n`);
          EOF

      - name: Commit audit evidence
        run: |
          set -euo pipefail
          git add docs/ui-redesign/gouno-ui-0.2.0-import-audit.md
          git diff --cached --exit-code && exit 0 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(ui): audit Blog against Gouno UI 0.2.0"
          git push origin HEAD:chore/gouno-ui-0.2.0

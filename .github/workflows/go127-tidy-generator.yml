name: Go 1.27 Tidy Generator

on:
  push:
    branches:
      - chore/go127-tidy

permissions:
  contents: write

jobs:
  tidy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/go127-tidy
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - name: Normalize Go modules
        run: |
          (cd blog-backend && go mod tidy)
          (cd seed && go mod tidy)
          git diff --check
      - name: Commit normalized module files
        run: |
          if git diff --quiet -- blog-backend/go.mod blog-backend/go.sum seed/go.mod seed/go.sum; then
            echo "Go module files already tidy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-backend/go.mod blog-backend/go.sum seed/go.mod seed/go.sum
          git commit -m "chore(runtime): tidy Go 1.27.1 modules [skip ci]"
          git push origin HEAD:chore/go127-tidy

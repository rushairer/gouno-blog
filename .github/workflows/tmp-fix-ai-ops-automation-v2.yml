name: Temporary AI Ops Automation V2 Fix

on:
  push:
    branches: [ui/blog-admin-final-parity-ai-ops-automation-v2]
    paths:
      - .github/workflows/tmp-fix-ai-ops-automation-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ui/blog-admin-final-parity-ai-ops-automation-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Replace native workflow row and preserve current test baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("blog-frontend/src/components/agent/WorkflowWorkspace.tsx")
          source = source_path.read_text()
          pattern = re.compile(
              r'(?P<indent>[ \t]*)<button\s*\n\s*type="button"\s*\n\s*className="min-w-0 flex-1 text-left"\s*\n\s*onClick=\{openWorkflow\}\s*\n\s*>[\s\S]*?</button>'
          )
          matches = list(pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(f"expected one workflow row native button, found {len(matches)}")
          match = matches[0]
          indent = match.group("indent")
          block = '''<Button
            type="button"
            variant="ghost"
            className="h-auto min-w-0 flex-1 justify-start p-0 text-left hover:bg-transparent"
            onClick={openWorkflow}
          >
            <span className="block min-w-0 flex-1 text-left">
              <span className="flex flex-wrap items-center gap-2">
                <strong className="text-sm">{workflow.name}</strong>
                <Tag color={workflow.enabled ? "success" : "default"}>
                  {workflow.enabled
                    ? locale === "zh"
                      ? "已启用"
                      : "Enabled"
                    : locale === "zh"
                      ? "已停用"
                      : "Disabled"}
                </Tag>
              </span>
              <span className="mt-1 block text-sm text-muted-foreground">
                {workflow.description}
              </span>
              <span className="mt-3 grid gap-2 text-xs text-muted-foreground sm:grid-cols-2 xl:grid-cols-4">
                <span>
                  {labels.schedule}:{" "}
                  {workflow.cron_expression ||
                    (locale === "zh" ? "仅手动" : "Manual")}
                  {workflow.cron_expression ? ` · ${workflow.timezone}` : ""}
                </span>
                <span>
                  {labels.next}: {formatTime(workflow.next_run_at)}
                </span>
                <span>
                  {latestRun
                    ? `${locale === "zh" ? "最近运行" : "Latest run"}: ${statusLabel(latestRun.status, locale)} · ${formatTime(latestRun.created_at)}`
                    : labels.never}
                </span>
                <span>
                  {labels.metrics}: {metric?.runs || 0} / {metric?.failures || 0} /{" "}
                  {metric?.tokens || 0}
                </span>
              </span>
            </span>
          </Button>'''
          replacement = "\n".join(indent + line if line else line for line in block.splitlines())
          source_path.write_text(source[: match.start()] + replacement + source[match.end() :])

          test_path = Path("blog-frontend/src/components/agent/__tests__/WorkflowWorkspace.test.tsx")
          test_source = test_path.read_text()
          old = '    const list = screen.getByRole("table");\n'
          new = '    const list = screen.getByRole("list", { name: "Workflow 列表" });\n    expect(screen.queryByRole("table")).not.toBeInTheDocument();\n'
          if test_source.count(old) != 1:
              raise SystemExit(f"expected one workflow table assertion, found {test_source.count(old)}")
          test_path.write_text(test_source.replace(old, new, 1))
          PY
      - name: Verify automation parity contracts
        working-directory: blog-frontend
        run: |
          npm ci
          npx prettier --write src/components/agent/WorkflowWorkspace.tsx src/components/agent/__tests__/WorkflowWorkspace.test.tsx
          npm run lint:ui
          npx vitest run src/components/agent/__tests__/WorkflowWorkspace.test.tsx
          npx tsc -b
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-ai-ops-automation-v2.yml
          git add blog-frontend/src/components/agent/WorkflowWorkspace.tsx blog-frontend/src/components/agent/__tests__/WorkflowWorkspace.test.tsx .github/workflows/tmp-fix-ai-ops-automation-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ui): align AI Operations workflow list"
          git push origin HEAD:ui/blog-admin-final-parity-ai-ops-automation-v2

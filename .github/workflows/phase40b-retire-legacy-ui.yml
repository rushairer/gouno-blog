name: Phase 40B retire legacy UI

on:
  push:
    branches:
      - ui/remove-legacy-ui-package-phase40b

permissions:
  contents: write

jobs:
  retire-legacy-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/remove-legacy-ui-package-phase40b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Refresh lockfile without legacy UI
        working-directory: blog-frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Install and run full frontend quality
        working-directory: blog-frontend
        run: |
          npm ci
          npm run quality
      - name: Verify legacy UI is absent from active frontend/tooling
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n '@gouno/ui-legacy\|legacy-ui-manifest\|gouno-ui-legacy' \
            blog-frontend/src \
            blog-frontend/package.json \
            blog-frontend/package-lock.json \
            .github/workflows/ci.yml \
            .github/workflows/sync-gouno-ui.yml; then
            echo 'active legacy UI reference remains' >&2
            exit 1
          fi
          test ! -e blog-frontend/vendor/legacy-ui-manifest.json
          test ! -e blog-frontend/vendor/gouno-ui-legacy-0.1.0.tgz
          test ! -e blog-frontend/scripts/legacy-ui-allowlist.json
          test ! -e scripts/ui/distribute.mjs
      - name: Build frontend container
        run: docker build -f blog-frontend/Dockerfile blog-frontend
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(ui): refresh lockfile without legacy UI"
          git push origin HEAD:ui/remove-legacy-ui-package-phase40b

name: Feed HTTP ownership staging

on:
  push:
    branches:
      - refactor/feed-http-ownership

permissions:
  contents: write

jobs:
  converge-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Apply Feed HTTP ownership convergence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          backend = Path('blog-backend')
          flat = backend / 'internal' / 'controller'
          feed = backend / 'internal' / 'feed' / 'controller'
          feed.mkdir(parents=True, exist_ok=True)

          old_controller = flat / 'feed_controller.go'
          controller = old_controller.read_text()
          import_marker = '\t"github.com/gin-gonic/gin"\n\t"github.com/rushairer/blog-backend/internal/domain"\n'
          assert import_marker in controller
          controller = controller.replace(
              import_marker,
              '\t"github.com/gin-gonic/gin"\n\t"github.com/rushairer/blog-backend/internal/controllerutil"\n\t"github.com/rushairer/blog-backend/internal/domain"\n',
              1,
          )
          controller = controller.replace('WriteDomainError(', 'controllerutil.WriteDomainError(')
          assert 'controllerutil.WriteDomainError(' in controller
          assert 'WriteDomainError(' not in controller.replace('controllerutil.WriteDomainError(', '')
          (feed / 'controller.go').write_text(controller)
          old_controller.unlink()

          old_test = flat / 'feed_controller_test.go'
          (feed / 'controller_test.go').write_text(old_test.read_text())
          old_test.unlink()

          (feed / 'ownership_test.go').write_text(dedent(r'''package controller

          import (
          	"errors"
          	"os"
          	"strings"
          	"testing"
          )

          func TestFeedTransportIsCapabilityOwned(t *testing.T) {
          	for _, legacy := range []string{
          		"../../controller/feed_controller.go",
          		"../../controller/feed_controller_test.go",
          	} {
          		if _, err := os.Stat(legacy); !errors.Is(err, os.ErrNotExist) {
          			t.Fatalf("legacy flat Feed transport still exists at %s: %v", legacy, err)
          		}
          	}

          	routerSource, err := os.ReadFile("../../../router/web.go")
          	if err != nil {
          		t.Fatal(err)
          	}
          	router := string(routerSource)
          	if !strings.Contains(router, "feedcontroller.NewFeedController(") {
          		t.Fatal("router does not construct the capability-owned Feed controller")
          	}
          	if strings.Contains(router, "controller.NewFeedController(") {
          		t.Fatal("router still constructs Feed transport from the flat controller package")
          	}
          	for _, route := range []string{"/feed.xml", "/rss", "/sitemap.xml"} {
          		if !strings.Contains(router, route) {
          			t.Fatalf("Feed route %s was lost during ownership migration", route)
          		}
          	}
          }
          '''))

          router_path = backend / 'router' / 'web.go'
          router = router_path.read_text()
          import_marker = '\t"github.com/rushairer/blog-backend/internal/controller"\n'
          assert import_marker in router
          router = router.replace(
              import_marker,
              import_marker + '\tfeedcontroller "github.com/rushairer/blog-backend/internal/feed/controller"\n',
              1,
          )
          old_ctor = '\tfeedCtrl := controller.NewFeedController(postSvc, pageSvc, siteSvc)\n'
          new_ctor = '\tfeedCtrl := feedcontroller.NewFeedController(postSvc, pageSvc, siteSvc)\n'
          assert old_ctor in router
          router = router.replace(old_ctor, new_ctor, 1)
          router_path.write_text(router)

          architecture_path = backend / 'ARCHITECTURE.md'
          architecture = architecture_path.read_text()
          old_arch = 'The application composition root constructs Taxonomy and Site repositories/services independently, and `WebRouterOptions` carries separate `TaxonomySvc` and `SiteSvc` dependencies. Active Category/Tag routes bind directly to the Taxonomy controller and Site Settings routes bind directly to the Site controller. `FeedController` depends only on the narrow Site Settings read contract it actually uses. Shared HTTP error mapping recognizes canonical Taxonomy/Site service sentinels directly.'
          new_arch = 'The application composition root constructs Taxonomy and Site repositories/services independently, and `WebRouterOptions` carries separate `TaxonomySvc` and `SiteSvc` dependencies. Active Category/Tag routes bind directly to the Taxonomy controller and Site Settings routes bind directly to the Site controller. RSS and sitemap transport are capability-owned under `internal/feed/controller`; Feed owns no persistence and consumes only narrow Post listing, published Page listing, and Site Settings read contracts. The public `/feed.xml`, `/rss`, and `/sitemap.xml` routes retain their existing behavior while no longer depending on the transitional flat controller bucket. Shared HTTP error mapping recognizes canonical Taxonomy/Site service sentinels directly.'
          assert old_arch in architecture
          architecture_path.write_text(architecture.replace(old_arch, new_arch, 1))

          convergence_path = backend / 'ARCHITECTURE_CONVERGENCE.md'
          convergence = convergence_path.read_text()
          site_row = '| **Site** | Site settings; `site_settings` | `internal/site/{repository,service,controller}` | Feed uses a narrow settings-read contract. | Site service/repository. | **Canonical implementation; remaining contracts tracked below.** |'
          feed_row = '| **Feed** | RSS and sitemap public read models; no owned persistence table | `internal/feed/controller` | Narrow Post listing, published Page listing and Site Settings reads. | Read-only HTTP composition; transaction ownership remains with called capabilities. | **Canonical HTTP ownership; no flat Feed controller remains.** |'
          assert site_row in convergence
          convergence = convergence.replace(site_row, site_row + '\n' + feed_row, 1)

          old_flat = '- **A — migrate to capability / retire facade:** Agent, Workflow, Operations and Knowledge HTTP ownership are canonical under capability controllers; flat Agent repository delegates are retired. Remaining non-held facades require consumer proof before deletion.'
          new_flat = '- **A — migrate to capability / retire facade:** Agent, Workflow, Operations, Knowledge and Feed HTTP ownership are canonical under capability controllers; flat Agent repository delegates are retired. Remaining non-held facades require consumer proof before deletion.'
          assert old_flat in convergence
          convergence = convergence.replace(old_flat, new_flat, 1)

          old_completed = 'and **PostVersion restore ownership convergence** now use canonical ownership boundaries'
          assert old_completed in convergence
          convergence = convergence.replace(old_completed, 'and **PostVersion restore ownership convergence**, and **Feed HTTP ownership convergence** now use canonical ownership boundaries', 1)

          anchor = '### PostVersion restore ownership convergence — 2026-09-14\n'
          assert anchor in convergence
          section = dedent('''\
          ### Feed HTTP ownership convergence — 2026-09-14

          - `internal/feed/controller` owns RSS and sitemap transport; Feed intentionally has no repository/service layers because it owns no persistence or business write model.
          - Feed consumes narrow Post listing, published Page listing and Site Settings read contracts; those capabilities retain their own data and transaction ownership.
          - `/feed.xml`, `/rss` and `/sitemap.xml` remain unchanged, including forwarded-origin handling, canonical article URLs and XML response behavior.
          - The flat `internal/controller/feed_controller.go` and its duplicate test are retired after consumer proof. Access and Connector flat transport are unchanged.


          ''')
          convergence = convergence.replace(anchor, section + anchor, 1)
          convergence_path.write_text(convergence)
          PY

      - name: Format
        working-directory: blog-backend
        run: gofmt -w internal/feed/controller router/web.go

      - name: Focused tests
        working-directory: blog-backend
        run: go test ./internal/feed/controller ./internal/controller ./router ./cmd/gouno

      - name: Focused vet
        working-directory: blog-backend
        run: go vet ./internal/feed/controller ./internal/controller ./router ./cmd/gouno

      - name: Ownership and hold guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assert not Path('blog-backend/internal/controller/feed_controller.go').exists()
          assert not Path('blog-backend/internal/controller/feed_controller_test.go').exists()
          feed = Path('blog-backend/internal/feed/controller/controller.go').read_text()
          assert 'controllerutil.WriteDomainError(' in feed
          router = Path('blog-backend/router/web.go').read_text()
          assert 'feedcontroller.NewFeedController(' in router
          assert 'controller.NewFeedController(' not in router
          PY
          git diff --exit-code f47f3c431143e092869525d694a59eafed9f9294 -- \
            blog-backend/internal/controller/access_controller.go \
            blog-backend/internal/controller/agent_controller.go \
            blog-backend/internal/controller/agent_connector_controller.go

      - name: Commit validated source and self-clean
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm .github/workflows/feed-http-ownership-staging.yml
          git add blog-backend
          git commit -m "refactor(feed): converge HTTP controller ownership"
          git push origin HEAD:refactor/feed-http-ownership

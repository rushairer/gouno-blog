name: Reverse migrate AI Operations automation shell once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-ai-ops-automation-shell-once.yml

permissions:
  contents: write

jobs:
  migrate-once:
    if: "${{ github.event.head_commit.message == 'ci: reverse migrate ai operations automation shell once' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Reverse migrate master-detail shell
        working-directory: blog-frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'src/components/agent/WorkflowWorkspace.tsx';
          let source = await readFile(path, 'utf8');
          const replaceOnce = (from, to, label) => {
            const first = source.indexOf(from);
            if (first < 0) throw new Error(`Missing ${label} marker`);
            if (source.indexOf(from, first + from.length) >= 0) throw new Error(`Ambiguous ${label} marker`);
            source = source.slice(0, first) + to + source.slice(first + from.length);
          };

          replaceOnce(
            '  ArrowDown,\n  ArrowLeft,\n  ArrowUp,\n  ChevronRight,\n',
            '  ArrowDown,\n  ArrowUp,\n',
            'obsolete navigation imports',
          );
          replaceOnce(
            'import { WorkflowInputForm } from "./WorkflowInputForm";\n',
            'import { WorkflowInputForm } from "./WorkflowInputForm";\nimport { OperationsMeta, OperationsObjectRow } from "./OperationsPatterns";\n',
            'operations pattern import',
          );
          replaceOnce(
            '  const selectedWorkflow = selectedWorkflowID\n    ? workflows.find((workflow) => workflow.id === selectedWorkflowID) || null\n    : null;\n',
            '  const selectedWorkflow =\n    (selectedWorkflowID\n      ? workflows.find((workflow) => workflow.id === selectedWorkflowID) || null\n      : null) ??\n    visibleWorkflows[0] ??\n    sortedWorkflows[0] ??\n    null;\n',
            'selected workflow fallback',
          );

          const returnStart = source.indexOf('  return (\n    <div className="workflow-workspace">');
          if (returnStart < 0) throw new Error('Missing workflow workspace return marker');
          const iifeMarker = '          {(() => {';
          const iifeStart = source.indexOf(iifeMarker, returnStart);
          if (iifeStart < 0) throw new Error('Missing selected workflow detail marker');

          const prefix = String.raw`  return (
    <div className="workflow-workspace flex flex-col gap-6">
      <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <Text tone="muted" className="max-w-3xl">
          {locale === "zh"
            ? "Workflow 是持续运行的版本化自动化资产。左侧选择资产，右侧直接查看状态、边界、定义与人工执行。"
            : "Workflows are versioned automation assets. Select one on the left to inspect status, boundaries, definition, and manual execution."}
        </Text>
        <Button
          variant="solid"
          color="primary"
          type="button"
          onClick={() => setEditing("new")}
          icon={<Plus />}
        >
          {labels.add}
        </Button>
      </div>

      {selectedWorkflow ? (
        <div className="grid min-w-0 gap-5 xl:grid-cols-[21rem_minmax(0,1fr)]">
          <aside
            className="min-w-0 overflow-hidden rounded-lg border bg-background"
            aria-label={locale === "zh" ? "Workflow 导航" : "Workflow navigation"}
          >
            <div className="border-b bg-muted/20 p-4">
              <div className="mb-3 flex items-center justify-between gap-3">
                <div>
                  <strong className="text-sm">Workflows</strong>
                  <Text size="xs" tone="muted" className="mt-0.5">
                    {locale === "zh"
                      ? visibleWorkflows.length + " 项自动化资产"
                      : visibleWorkflows.length + " automation assets"}
                  </Text>
                </div>
                <Tag>
                  {workflows.filter((workflow) => workflow.enabled).length}{" "}
                  {locale === "zh" ? "已启用" : "enabled"}
                </Tag>
              </div>
              <div className="flex flex-col gap-2">
                <SearchField
                  aria-label={locale === "zh" ? "搜索 Workflow" : "Search workflows"}
                  value={workflowQuery}
                  onChange={(event) => setWorkflowQuery(event.target.value)}
                  placeholder={locale === "zh" ? "搜索 Workflow" : "Search workflows"}
                  size="small"
                />
                <Select
                  aria-label={locale === "zh" ? "按状态筛选 Workflow" : "Filter workflows by status"}
                  value={statusFilter}
                  onChange={(value) =>
                    setStatusFilter(
                      selectValue(value) as "all" | "enabled" | "disabled",
                    )
                  }
                  size="small"
                >
                  <option value="all">{locale === "zh" ? "全部状态" : "All status"}</option>
                  <option value="enabled">{locale === "zh" ? "已启用" : "Enabled"}</option>
                  <option value="disabled">{locale === "zh" ? "已停用" : "Disabled"}</option>
                </Select>
              </div>
            </div>
            <div
              role="list"
              aria-label={locale === "zh" ? "Workflow 列表" : "Workflow list"}
              className="max-h-[48rem] overflow-y-auto"
            >
              {visibleWorkflows.length ? (
                visibleWorkflows.map((workflow) => {
                  const latestRun = runs.find(
                    (run) => run.workflow_id === workflow.id && !run.dry_run,
                  );
                  return (
                    <div key={workflow.id} role="listitem">
                      <OperationsObjectRow
                        leading={<GitBranch className="size-4" />}
                        title={workflow.name}
                        status={
                          <Tag color={workflow.enabled ? "success" : undefined}>
                            {workflow.enabled
                              ? locale === "zh"
                                ? "已启用"
                                : "Enabled"
                              : locale === "zh"
                                ? "已停用"
                                : "Disabled"}
                          </Tag>
                        }
                        meta={
                          (workflow.cron_expression ||
                            (locale === "zh" ? "仅手动" : "Manual")) +
                          " · v" +
                          workflow.current_version
                        }
                        summary={workflow.description}
                        signals={
                          <>
                            <OperationsMeta>
                              {labels.next} {formatTime(workflow.next_run_at)}
                            </OperationsMeta>
                            {latestRun ? (
                              <OperationsMeta>
                                {locale === "zh" ? "最近 " : "Latest "}
                                {statusLabel(latestRun.status, locale)}
                              </OperationsMeta>
                            ) : null}
                          </>
                        }
                        selected={selectedWorkflow.id === workflow.id}
                        onClick={() => {
                          setSelectedWorkflowID(workflow.id);
                          const url = new URL(window.location.href);
                          url.searchParams.set("workflow", String(workflow.id));
                          window.history.replaceState(null, "", url);
                        }}
                        ariaLabel={
                          (locale === "zh" ? "打开 Workflow：" : "Open Workflow: ") +
                          workflow.name
                        }
                      />
                    </div>
                  );
                })
              ) : (
                <div className="p-6">
                  <Empty title={locale === "zh" ? "没有符合条件的 Workflow。" : "No matching workflows."} />
                </div>
              )}
            </div>
          </aside>

          <div className="workflow-detail-view section-stack min-w-0">
            {(() => {`;

          source = source.slice(0, returnStart) + prefix + source.slice(iifeStart + iifeMarker.length);

          const elseMarker = '      ) : (\n        <div className="workflow-list-view flex flex-col gap-6">';
          const elseStart = source.indexOf(elseMarker, returnStart);
          if (elseStart < 0) throw new Error('Missing legacy list branch marker');
          const modalMarker = '      )}\n      <Modal';
          const modalStart = source.indexOf(modalMarker, elseStart);
          if (modalStart < 0) throw new Error('Missing workflow delete modal marker');
          const fallback = String.raw`        </div>
      ) : (
        <Card padding="base">
          <Empty title={labels.empty} />
        </Card>
      )}
`;
          source = source.slice(0, elseStart) + fallback + source.slice(modalStart + '      )}\n'.length);

          await writeFile(path, source);
          NODE
          npx prettier --write src/components/agent/WorkflowWorkspace.tsx

      - name: Commit migration and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/migrate-ai-ops-automation-shell-once.yml
          git add blog-frontend/src/components/agent/WorkflowWorkspace.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ai-ops): reverse migrate workflow master detail shell"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

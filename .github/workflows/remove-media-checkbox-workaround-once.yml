name: Remove Media checkbox workaround once

on:
  push:
    branches:
      - ui/remove-media-checkbox-workaround-20260913
    paths:
      - .github/workflows/remove-media-checkbox-workaround-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/remove-media-checkbox-workaround-20260913
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Remove consumer workaround
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'blog-frontend/src/pages/admin/MediaLibrary.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const legacy = '                    <Checkbox\n                      className="block"\n';
          const canonical = '                    <Checkbox\n';
          const count = source.split(legacy).length - 1;
          if (count !== 1) throw new Error(`expected one media checkbox workaround, found ${count}`);
          source = source.replace(legacy, canonical);
          fs.writeFileSync(path, source);
          NODE
      - name: Format frontend sources
        working-directory: blog-frontend
        run: npm run format
      - name: Verify frontend quality
        working-directory: blog-frontend
        run: npm run quality
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/admin/MediaLibrary.tsx
          git commit -m "refactor(ui): remove media checkbox compatibility workaround"
          git push origin HEAD:ui/remove-media-checkbox-workaround-20260913

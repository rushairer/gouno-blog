name: Workflow definition persistence validation

on:
  push:
    branches:
      - refactor/workflow-definition-persistence

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Apply fail-closed Workflow definition persistence transform
        run: python3 scripts/apply_workflow_definition_persistence.py

      - name: Preserve rollback error semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('blog-backend/internal/workflow/repository/definition_repository.go')
          text = repo.read_text()
          old = '''func (r *DefinitionRepository) VersionSteps(ctx context.Context, id int64, version int) ([]domain.WorkflowStep, error) {
          \tvar raw []byte
          \tif err := r.db.QueryRowContext(ctx, `SELECT steps FROM ai_workflow_versions WHERE workflow_id=$1 AND version=$2`, id, version).Scan(&raw); err != nil {
          \t\treturn nil, err
          \t}
          \tvar steps []domain.WorkflowStep
          \tif err := json.Unmarshal(raw, &steps); err != nil {
          \t\treturn nil, err
          \t}
          \treturn steps, nil
          }
          '''
          new = '''func (r *DefinitionRepository) VersionStepsRaw(ctx context.Context, id int64, version int) (json.RawMessage, error) {
          \tvar raw json.RawMessage
          \terr := r.db.QueryRowContext(ctx, `SELECT steps FROM ai_workflow_versions WHERE workflow_id=$1 AND version=$2`, id, version).Scan(&raw)
          \treturn raw, err
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('repository VersionSteps selector drifted')
          repo.write_text(text.replace(old, new, 1))

          service = Path('blog-backend/internal/workflow/service.go')
          text = service.read_text()
          old = '''func (s *Service) Rollback(ctx context.Context, id int64, version int) error {
          \tsteps, err := s.definitions.VersionSteps(ctx, id, version)
          \tif errors.Is(err, sql.ErrNoRows) {
          \t\treturn ErrNotFound
          \t}
          \tif err != nil {
          \t\treturn fmt.Errorf("%w: invalid historical workflow steps", ErrInvalid)
          \t}
          \tif err := s.validateSteps(steps, 0); err != nil {
          \t\treturn fmt.Errorf("%w: historical version cannot be reactivated", ErrInvalid)
          \t}
          \tchanged, err := s.definitions.SetCurrentVersion(ctx, id, version)
          '''
          new = '''func (s *Service) Rollback(ctx context.Context, id int64, version int) error {
          \trawSteps, err := s.definitions.VersionStepsRaw(ctx, id, version)
          \tif errors.Is(err, sql.ErrNoRows) {
          \t\treturn ErrNotFound
          \t}
          \tif err != nil {
          \t\treturn err
          \t}
          \tvar steps []domain.WorkflowStep
          \tif err := json.Unmarshal(rawSteps, &steps); err != nil {
          \t\treturn fmt.Errorf("%w: invalid historical workflow steps", ErrInvalid)
          \t}
          \tif err := s.validateSteps(steps, 0); err != nil {
          \t\treturn fmt.Errorf("%w: historical version cannot be reactivated", ErrInvalid)
          \t}
          \tchanged, err := s.definitions.SetCurrentVersion(ctx, id, version)
          '''
          if text.count(old) != 1:
              raise SystemExit('service Rollback selector drifted')
          service.write_text(text.replace(old, new, 1))
          PY

      - name: Format changed Go files
        run: |
          gofmt -w \
            blog-backend/internal/workflow/service.go \
            blog-backend/internal/workflow/repository/definition_repository.go

      - name: Enforce definition persistence ownership
        run: |
          test -e blog-backend/internal/workflow/repository/definition_repository.go
          grep -F 'definitions *workflowrepository.DefinitionRepository' blog-backend/internal/workflow/service.go
          ! grep -F 'INSERT INTO ai_workflow_versions' blog-backend/internal/workflow/service.go
          ! grep -F 'current_version=current_version+1' blog-backend/internal/workflow/service.go
          grep -F 'func (r *DefinitionRepository) Save' blog-backend/internal/workflow/repository/definition_repository.go
          grep -F 'func (r *DefinitionRepository) VersionStepsRaw' blog-backend/internal/workflow/repository/definition_repository.go

      - name: Test
        working-directory: blog-backend
        run: go test ./...

      - name: Race detector
        working-directory: blog-backend
        run: go test -race ./...

      - name: Vet
        working-directory: blog-backend
        run: go vet ./...

      - name: Vulnerability scan
        working-directory: blog-backend
        run: govulncheck ./...

      - name: Commit validated business change
        run: |
          rm scripts/apply_workflow_definition_persistence.py .github/workflows/workflow-definition-persistence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(workflow): isolate definition persistence'
          git push origin HEAD:refactor/workflow-definition-persistence

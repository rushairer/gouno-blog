name: Temporary Article State Contract Patch

on:
  push:
    branches:
      - hardening/blog-public-account-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/blog-public-account-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - run: cd blog-frontend && npm ci
      - name: Patch ArticleDetail Error versus NotFound ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("blog-frontend/src/pages/PostDetail.tsx")
          text = path.read_text()
          replacements = [
              (
                  'import { useSession } from "@gosso/client/react";\n',
                  'import { ApiError } from "@gosso/client";\nimport { useSession } from "@gosso/client/react";\n',
              ),
              (
                  '  const [error, setError] = useState<string | null>(null);\n',
                  '  const [error, setError] = useState<string | null>(null);\n  const [notFound, setNotFound] = useState(false);\n',
              ),
              (
                  '      setLoading(true);\n      setError(null);\n      setComments([]);\n',
                  '      setLoading(true);\n      setError(null);\n      setNotFound(false);\n      setComments([]);\n',
              ),
              (
                  '      if (postResult.status === "fulfilled") {\n        postData = postResult.value;\n      } else if (isPreviewParam || canPreview) {',
                  '      const postLoadError =\n        postResult.status === "rejected" ? postResult.reason : null;\n\n      if (postResult.status === "fulfilled") {\n        postData = postResult.value;\n      } else if (isPreviewParam || canPreview) {',
              ),
              (
                  '      if (!postData) throw new Error(t("postNotFound"));\n',
                  '      if (!postData) {\n        if (postLoadError instanceof ApiError && postLoadError.status === 404) {\n          setNotFound(true);\n          return;\n        }\n        throw postLoadError instanceof Error\n          ? postLoadError\n          : new Error(t("failedFetch"));\n      }\n',
              ),
              (
                  '    const is404 =\n      !post ||\n      error === t("postNotFound") ||',
                  '    const is404 =\n      notFound ||\n      (!error && !post) ||\n      error === t("postNotFound") ||',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new)

          path.write_text(text)
          PY
          cd blog-frontend
          npx prettier --write src/pages/PostDetail.tsx
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-article-state-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): distinguish article load failure from not found"
          git push origin HEAD:hardening/blog-public-account-parity

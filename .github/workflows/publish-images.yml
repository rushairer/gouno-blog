name: Publish Images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image:
        description: Image to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend
          - seed

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    name: Plan image builds
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      seed: ${{ steps.plan.outputs.seed }}
      selection: ${{ steps.plan.outputs.selection }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Select deployable images
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "${REQUESTED_IMAGE:-all}" in
              all)
                python3 .github/scripts/image_build_plan.py --all >> "$GITHUB_OUTPUT"
                ;;
              backend)
                printf 'blog-backend/Dockerfile\0' > "$RUNNER_TEMP/image-build-paths"
                python3 .github/scripts/image_build_plan.py --files0 "$RUNNER_TEMP/image-build-paths" >> "$GITHUB_OUTPUT"
                ;;
              frontend)
                printf 'blog-frontend/Dockerfile\0' > "$RUNNER_TEMP/image-build-paths"
                python3 .github/scripts/image_build_plan.py --files0 "$RUNNER_TEMP/image-build-paths" >> "$GITHUB_OUTPUT"
                ;;
              seed)
                printf 'seed/Dockerfile\0' > "$RUNNER_TEMP/image-build-paths"
                python3 .github/scripts/image_build_plan.py --files0 "$RUNNER_TEMP/image-build-paths" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported image selection: $REQUESTED_IMAGE" >&2
                exit 1
                ;;
            esac
            exit 0
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            python3 .github/scripts/image_build_plan.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            # A newly-created branch has no reliable predecessor. Prefer one
            # safe full build over accidentally missing a deployable change.
            python3 .github/scripts/image_build_plan.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only -z "$BEFORE_SHA" "$AFTER_SHA" > "$RUNNER_TEMP/image-build-paths"
          python3 .github/scripts/image_build_plan.py --files0 "$RUNNER_TEMP/image-build-paths" >> "$GITHUB_OUTPUT"

      - name: Summarize selection
        env:
          SELECTION: ${{ steps.plan.outputs.selection }}
        run: |
          echo "Selected images: $SELECTION" >> "$GITHUB_STEP_SUMMARY"

  publish-backend:
    name: Publish backend image
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image-backend-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-backend
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: blog-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-backend
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record immutable image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-backend
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > backend.digest.txt

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-backend
          path: backend.digest.txt
          retention-days: 30

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-backend@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-backend-${{ github.sha }}.spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-backend@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-backend-${{ github.sha }}.cyclonedx.json

  publish-frontend:
    name: Publish frontend image
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image-frontend-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-frontend
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: blog-frontend
          file: blog-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-frontend
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record immutable image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-frontend
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > frontend.digest.txt

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-frontend
          path: frontend.digest.txt
          retention-days: 30

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-frontend@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-frontend-${{ github.sha }}.spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-frontend@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-frontend-${{ github.sha }}.cyclonedx.json

  publish-seed:
    name: Publish seed image
    needs: plan
    if: needs.plan.outputs.seed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image-seed-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-seed
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: seed
          file: seed/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=seed
          cache-to: type=gha,mode=max,scope=seed
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-seed
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record immutable image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-seed
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > seed.digest.txt

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-seed
          path: seed.digest.txt
          retention-days: 30

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-seed@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-seed-${{ github.sha }}.spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gouno-blog-seed@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-seed-${{ github.sha }}.cyclonedx.json

  release:
    name: Publish release manifest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [plan, publish-backend, publish-frontend, publish-seed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          grep -Fq "## [$version]" CHANGELOG.md

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: release-assets
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag --generate-notes --title "Gouno Blog $GITHUB_REF_NAME"
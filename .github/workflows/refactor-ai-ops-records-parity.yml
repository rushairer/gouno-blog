name: Refactor AI Ops Records Parity

on:
  push:
    branches:
      - ui/blog-admin-final-parity-ai-ops-records

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/blog-admin-final-parity-ai-ops-records
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - working-directory: blog-frontend
        run: npm ci
      - name: Align AI Ops run record collections
        run: python3 .github/scripts/refactor_ai_ops_records_parity.py
      - working-directory: blog-frontend
        run: npx prettier --write src/components/agent/AgentRunRecords.tsx src/components/agent/WorkflowRunRecords.tsx src/components/agent/__tests__/AgentRunRecords.test.tsx src/components/agent/__tests__/WorkflowRunRecords.test.tsx
      - working-directory: blog-frontend
        run: npm run test:run -- src/components/agent/__tests__/AgentRunRecords.test.tsx src/components/agent/__tests__/WorkflowRunRecords.test.tsx
      - working-directory: blog-frontend
        run: npx tsc -b
      - name: Commit verified refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add blog-frontend/src/components/agent/AgentRunRecords.tsx blog-frontend/src/components/agent/WorkflowRunRecords.tsx blog-frontend/src/components/agent/__tests__/AgentRunRecords.test.tsx blog-frontend/src/components/agent/__tests__/WorkflowRunRecords.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ui): align AI Ops run records"
          git push origin HEAD:ui/blog-admin-final-parity-ai-ops-records

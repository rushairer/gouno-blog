name: Advance Gosso v1.6.1 Compatibility Pin

on:
  push:
    branches:
      - "test/gosso-1.6-bff-compat"
    paths:
      - ".github/workflows/advance-gosso-1.6.1.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: test/gosso-1.6-bff-compat
          fetch-depth: 0

      - name: Advance exact Gosso release pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              ".github/workflows/gosso-release-bff-compat.yml": [
                  (
                      "GOSSO_RELEASE_IMAGE: ghcr.io/rushairer/gosso:v1.6.0@sha256:5c91647bdfe7c8de9dec8e40f882680c91883f9ba2dce6fd309f7f8f3d05f445",
                      "GOSSO_RELEASE_VERSION: 1.6.1\n  GOSSO_RELEASE_DIGEST: sha256:cf3c321279b9860bbbcf30735dcd0d3a3465151075420d8fa70d6d66e580838b\n  GOSSO_RELEASE_IMAGE: ghcr.io/rushairer/gosso:v1.6.1@sha256:cf3c321279b9860bbbcf30735dcd0d3a3465151075420d8fa70d6d66e580838b",
                  ),
                  ("gosso-1-6-bff:", "gosso-1-6-1-bff:"),
                  ("name: Gosso v1.6.0 BFF acceptance", "name: Gosso v1.6.1 BFF acceptance"),
              ],
              "scripts/check-gosso-release-bff-compat.sh": [
                  ("GOSSO_RELEASE_VERSION=\"${GOSSO_RELEASE_VERSION:-1.6.0}\"", "GOSSO_RELEASE_VERSION=\"${GOSSO_RELEASE_VERSION:-1.6.1}\""),
                  ("GOSSO_RELEASE_DIGEST=\"${GOSSO_RELEASE_DIGEST:-sha256:5c91647bdfe7c8de9dec8e40f882680c91883f9ba2dce6fd309f7f8f3d05f445}\"", "GOSSO_RELEASE_DIGEST=\"${GOSSO_RELEASE_DIGEST:-sha256:cf3c321279b9860bbbcf30735dcd0d3a3465151075420d8fa70d6d66e580838b}\""),
              ],
              ".env.production.example": [
                  ("GOSSO_IMAGE=ghcr.io/rushairer/gosso:v1.6.0@sha256:<GOSSO_DIGEST>", "GOSSO_IMAGE=ghcr.io/rushairer/gosso:v1.6.1@sha256:<GOSSO_DIGEST>"),
              ],
              "CHANGELOG.md": [
                  (
                      "- Align the bundled Gosso deployment contract with the 1.6 security baseline: remove the ineffective loopback back-channel allowlist, keep only the explicit Docker private subnet, and update the production Gosso image example to v1.6.0.",
                      "- Align the bundled Gosso deployment contract with the final 1.6 security baseline: keep only the explicit Docker private back-channel subnet, advance the production Gosso image example to v1.6.1, and gate confidential-BFF RFC 7009 revocation against the published v1.6.1 artifact.",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f"{filename}: expected exactly one match for {old!r}, got {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          git diff --check
          grep -Fq 'v1.6.1@sha256:cf3c321279b9860bbbcf30735dcd0d3a3465151075420d8fa70d6d66e580838b' .github/workflows/gosso-release-bff-compat.yml
          grep -Fq 'GOSSO_RELEASE_VERSION="${GOSSO_RELEASE_VERSION:-1.6.1}"' scripts/check-gosso-release-bff-compat.sh
          grep -Fq 'GOSSO_IMAGE=ghcr.io/rushairer/gosso:v1.6.1@sha256:<GOSSO_DIGEST>' .env.production.example
          grep -Fq 'RFC 7009 revocation' CHANGELOG.md

      - name: Commit final compatibility update and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/advance-gosso-1.6.1.yml
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add .github/workflows/gosso-release-bff-compat.yml scripts/check-gosso-release-bff-compat.sh .env.production.example CHANGELOG.md
          git commit -m "test(auth): advance Blog BFF gate to Gosso 1.6.1"
          git push origin HEAD:test/gosso-1.6-bff-compat

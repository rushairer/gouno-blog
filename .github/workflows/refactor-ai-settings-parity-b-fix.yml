name: Refactor AI Settings Parity 3B Fix

on:
  push:
    branches:
      - ui/blog-admin-final-parity-ai-settings-b

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/blog-admin-final-parity-ai-settings-b
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - working-directory: blog-frontend
        run: npm ci
      - name: Re-run protected section transform with corrected selector
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/refactor-ai-settings-parity-b.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY"
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('source transform start not found')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit('source transform end not found')
          script = textwrap.dedent(workflow[start:end])
          script = script.replace('{ name: "Knowledge" }', '{ name: "Knowledge index" }')
          exec(compile(script, 'phase-3b-transform', 'exec'))
          PY
      - working-directory: blog-frontend
        run: npx prettier --write src/components/agent/AdvancedWorkspace.tsx src/pages/admin/__tests__/AISettings.test.tsx
      - working-directory: blog-frontend
        run: npm run test:run -- src/pages/admin/__tests__/AISettings.test.tsx
      - working-directory: blog-frontend
        run: npx tsc -b
      - name: Commit verified refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add blog-frontend/src/components/agent/AdvancedWorkspace.tsx blog-frontend/src/pages/admin/__tests__/AISettings.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ui): align AI Settings protected sections"
          git push origin HEAD:ui/blog-admin-final-parity-ai-settings-b

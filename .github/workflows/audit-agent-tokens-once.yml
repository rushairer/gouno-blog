name: Audit agent CSS tokens once

on:
  push:
    branches:
      - ui/agent-token-canonicalization-20260913
    paths:
      - .github/workflows/audit-agent-tokens-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/agent-token-canonicalization-20260913
      - name: Print agent CSS custom property references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('blog-frontend/src/styles/agent-console.css', 'utf8');
          const refs = [...source.matchAll(/var\(--([a-z0-9-]+)/gi)].map((match) => `--${match[1]}`);
          const unique = [...new Set(refs)].sort();
          console.log(`AGENT_TOKEN_COUNT=${unique.length}`);
          console.log(unique.join('\n'));
          NODE

name: Temporary PostEditor restore preflight

on:
  push:
    branches: [hardening/a-plus-post-version-restore-fence-20261029]

permissions:
  contents: read

jobs:
  restore-preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Format edited source without altering PR
        run: ./node_modules/.bin/prettier --write src/pages/admin/PostEditor.tsx src/pages/admin/__tests__/PostEditor.test.tsx
      - name: Show exact formatting delta
        run: git diff -- src/pages/admin/PostEditor.tsx src/pages/admin/__tests__/PostEditor.test.tsx
      - name: Attach formatted copies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-restore-pinned-prettier
          path: |
            blog-frontend/src/pages/admin/PostEditor.tsx
            blog-frontend/src/pages/admin/__tests__/PostEditor.test.tsx
          retention-days: 1
      - name: Typecheck
        run: npm exec -- tsc -b
      - name: PostEditor component regressions
        run: npm exec -- vitest run src/pages/admin/__tests__/PostEditor.test.tsx

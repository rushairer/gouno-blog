name: Frontend Toolchain Major Generator

on:
  push:
    branches:
      - probe/frontend-toolchain-majors

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: probe/frontend-toolchain-majors
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Regenerate npm manifest and lock
        working-directory: blog-frontend
        run: npm install --package-lock-only --save-dev typescript@~7.0.2 @types/node@^26.4.1 @testing-library/jest-dom@^7.0.1
      - name: Commit generated npm files
        run: |
          git diff --check
          if git diff --quiet -- blog-frontend/package.json blog-frontend/package-lock.json; then
            echo "npm files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/package.json blog-frontend/package-lock.json
          git commit -m "chore(deps): generate npm major lock update [skip ci]"
          git push origin HEAD:probe/frontend-toolchain-majors

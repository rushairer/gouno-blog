name: One-shot Blog AI Ops Layout Hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/harden-ai-ops-product-layout.mjs"
      - ".github/workflows/ai-ops-product-layout-hardening.yml"
      - "blog-frontend/scripts/check-ai-ops-layout-contracts.mjs"
      - "blog-frontend/e2e/ai-workspace-interactions.pw.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-blog-ai-ops-layout-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Apply Blog AI Operations hardening
        run: node .github/scripts/harden-ai-ops-product-layout.mjs

      - name: Normalize changed frontend sources
        working-directory: blog-frontend
        run: >-
          npx prettier --write
          src/components/agent/WorkflowWorkspace.tsx
          src/components/agent/WorkflowInputForm.tsx
          src/components/agent/WorkflowRunRecords.tsx
          src/components/agent/DecisionInboxWorkspace.tsx
          src/components/agent/AgentRunRecords.tsx
          src/components/agent/__tests__/WorkflowWorkspaceCanonicalDetail.test.tsx
          src/components/agent/__tests__/WorkflowWorkspace.test.tsx
          src/components/agent/__tests__/WorkflowInputForm.test.tsx
          src/styles/agent-console.css
          package.json

      - name: Install frontend dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Install isolated Playwright runtime
        working-directory: blog-frontend
        run: |
          PLAYWRIGHT_VERSION=1.55.0
          npm install --no-save --ignore-scripts @playwright/test@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium
          git restore package-lock.json

      - name: Verify static UI contracts
        working-directory: blog-frontend
        run: |
          npm run format:check
          npm run lint:ui
          npm run lint:css
          npx tsc -b

      - name: Verify targeted AI Operations unit contracts
        working-directory: blog-frontend
        run: >-
          npx vitest run
          src/components/agent/__tests__/WorkflowWorkspaceCanonicalDetail.test.tsx
          src/components/agent/__tests__/WorkflowWorkspace.test.tsx
          src/components/agent/__tests__/WorkflowInputForm.test.tsx
          src/components/agent/__tests__/DecisionInboxWorkspace.test.tsx

      - name: Verify frontend build
        working-directory: blog-frontend
        run: npm run build

      - name: Verify rendered AI Operations flows
        working-directory: blog-frontend
        run: >-
          npx playwright test
          --config=e2e/playwright.config.mjs
          ai-workspace-matrix.pw.mjs
          ai-workspace-interactions.pw.mjs

      - name: Commit adaptive master-detail layouts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            blog-frontend/src/components/agent/WorkflowWorkspace.tsx \
            blog-frontend/src/components/agent/WorkflowRunRecords.tsx \
            blog-frontend/src/components/agent/DecisionInboxWorkspace.tsx \
            blog-frontend/src/components/agent/AgentRunRecords.tsx
          git commit -m "fix(ai-ops): make master-detail layouts adaptive"

      - name: Commit canonical Workflow form rhythm
        run: |
          git add \
            blog-frontend/src/components/agent/WorkflowInputForm.tsx \
            blog-frontend/src/styles/agent-console.css
          git commit -m "fix(ai-ops): normalize workflow form spacing"

      - name: Commit regression guardrails and retire helper
        run: |
          git add \
            blog-frontend/package.json \
            blog-frontend/src/components/agent/__tests__/WorkflowWorkspaceCanonicalDetail.test.tsx \
            blog-frontend/src/components/agent/__tests__/WorkflowWorkspace.test.tsx \
            blog-frontend/src/components/agent/__tests__/WorkflowInputForm.test.tsx
          git rm .github/scripts/harden-ai-ops-product-layout.mjs .github/workflows/ai-ops-product-layout-hardening.yml
          git commit -m "test(ai-ops): enforce adaptive layout contracts"

      - name: Push staged hardening commits
        run: git push origin HEAD:main

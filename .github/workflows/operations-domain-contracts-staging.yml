name: Operations domain ownership staging

on:
  push:
    branches:
      - refactor/operations-domain-contracts

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Apply Operations domain migration
        run: |
          python3 .github/scripts/operations_domain_contracts.py
          sed -i 's/opsopsdomain/opsdomain/g' \
            blog-backend/internal/operations/service.go \
            blog-backend/internal/operations/approval_effects.go \
            blog-backend/internal/operations/controller/controller.go \
            blog-backend/internal/operations/service_test.go \
            blog-backend/internal/operations/approval_effects_integration_test.go \
            blog-backend/internal/agent/approval.go \
            blog-backend/internal/agent/approval_ports.go

      - name: Format
        run: |
          gofmt -w blog-backend/internal/operations/domain
          gofmt -w blog-backend/internal/operations/service.go
          gofmt -w blog-backend/internal/operations/approval_effects.go
          gofmt -w blog-backend/internal/operations/controller/controller.go
          gofmt -w blog-backend/internal/operations/service_test.go
          gofmt -w blog-backend/internal/operations/approval_effects_integration_test.go
          gofmt -w blog-backend/internal/agent/approval.go blog-backend/internal/agent/approval_ports.go

      - name: Focused tests
        working-directory: blog-backend
        run: go test ./internal/operations/... ./internal/agent/...

      - name: Focused vet
        working-directory: blog-backend
        run: go vet ./internal/operations/... ./internal/agent/...

      - name: Ownership and diff guards
        run: |
          test ! -e blog-backend/internal/domain/operations.go
          test -e blog-backend/internal/operations/domain/model.go
          test -e blog-backend/internal/operations/domain/ownership_test.go
          if git grep -nE 'domain\.(OperationalSuggestion|EditorialTask|ContentCandidate|ContentCandidateSet|AIFeedback)' -- 'blog-backend/**/*.go'; then
            echo 'Operations-owned symbol still consumed through root internal/domain'
            exit 1
          fi
          if git diff --name-only | grep -E '(^|/)internal/connector/|agent_connector_controller\.go|connector_controller\.go'; then
            echo 'Connector Hold path changed unexpectedly'
            exit 1
          fi
          git diff --check

      - name: Commit validated source and self-clean
        run: |
          rm -f .github/scripts/operations_domain_contracts.py
          rm -f .github/workflows/operations-domain-contracts-staging.yml
          git config user.name 'Aben'
          git config user.email '5195693+rushairer@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(operations): own capability domain models'
          git push origin HEAD:refactor/operations-domain-contracts

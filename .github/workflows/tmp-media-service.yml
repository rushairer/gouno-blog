name: Temporary Media Service Ownership Migration

on:
  push:
    branches: [refactor/media-service-ownership]
    paths:
      - scripts/tmp-media-service-migration.py
      - .github/workflows/tmp-media-service.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/media-service-ownership
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Record Media service ownership
        run: python3 scripts/tmp-media-service-migration.py

      - name: Format and verify backend
        run: |
          gofmt -w \
            blog-backend/internal/media/service/service.go \
            blog-backend/internal/media/service/service_test.go \
            blog-backend/internal/service/growth_service.go \
            blog-backend/internal/service/growth_service_media_compat_test.go
          cd blog-backend
          go test ./...
          go vet ./...

      - name: Verify Media service ownership boundary
        run: |
          test -f blog-backend/internal/media/service/service.go
          test -f blog-backend/internal/media/service/service_test.go
          grep -q 'mediarepository.Repository' blog-backend/internal/service/growth_service.go
          grep -q 'media mediaservice.Service' blog-backend/internal/service/growth_service.go
          grep -q 'ErrMediaInUse.*mediaservice.ErrMediaInUse' blog-backend/internal/service/growth_service.go
          grep -q 'ErrInvalidMediaPayload.*mediaservice.ErrInvalidMediaPayload' blog-backend/internal/service/growth_service.go
          grep -q 'ErrInvalidMediaID.*mediaservice.ErrInvalidMediaID' blog-backend/internal/service/growth_service.go
          if grep -q 'strings.TrimSpace' blog-backend/internal/service/growth_service.go; then
            echo 'GrowthService still owns Media validation/normalization' >&2
            exit 1
          fi
          grep -q 'errors.Is(err, mediaservice.ErrMediaNotFound)' blog-backend/internal/service/growth_service.go

      - name: Remove migration scaffolding
        run: rm scripts/tmp-media-service-migration.py .github/workflows/tmp-media-service.yml

      - name: Commit migrated service ownership
        run: |
          git config user.name Aben
          git config user.email 5195693+rushairer@users.noreply.github.com
          git add -A
          git commit -m 'refactor(media): move service ownership to capability'
          git push origin HEAD:refactor/media-service-ownership

name: AI cleanup format once

on:
  push:
    branches:
      - ui/ai-legacy-class-cleanup-20260913

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Format changed workflow component
        working-directory: blog-frontend
        run: npx prettier --write src/components/agent/WorkflowWorkspace.tsx
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/components/agent/WorkflowWorkspace.tsx
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(ui): format workflow workspace cleanup"
          git push

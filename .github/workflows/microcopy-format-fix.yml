name: Microcopy Format Fix

on:
  push:
    branches:
      - microcopy-format-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: microcopy-format-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --write src/pages/AccountNotifications.tsx src/pages/admin/MediaLibrary.tsx
      - name: Commit exact Prettier output
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/AccountNotifications.tsx blog-frontend/src/pages/admin/MediaLibrary.tsx
          git commit -m "style(blog): apply exact Prettier formatting"
          git push origin HEAD:microcopy-format-fix

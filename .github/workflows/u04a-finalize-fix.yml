name: U04a Finalize Fix

on:
  push:
    branches:
      - ui/u04a-browser-acceptance-20260913
    paths:
      - .github/workflows/u04a-finalize-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/u04a-browser-acceptance-20260913
          fetch-depth: 0
      - name: Apply verified browser fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('blog-frontend/src/pages/admin/AISettings.tsx')
          text = path.read_text()

          proxy_pattern = re.compile(
              r'  const labels = new Proxy\(\{\} as Record<string, string>, \{\n'
              r'\s+get: \(_, prop: string\) => t\(`agent\.\$\{prop\}` as any\),\n'
              r'\s+\}\);'
          )
          proxy_replacement = '''  const labels = new Proxy({} as Record<string, string>, {
            get: (_, prop: string | symbol) =>
              typeof prop === "string" ? t(`agent.${prop}` as any) : undefined,
          });'''
          text, count = proxy_pattern.subn(proxy_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one labels Proxy block, found {count}')

          guard = '    if (next === section) return;\n'
          if guard not in text:
              raise SystemExit('expected selectSection guard not found')
          text = text.replace(guard, '', 1)

          nav_pattern = re.compile(
              r'    const params = new URLSearchParams\(window\.location\.search\);\n'
              r'    if \(next === "agents"\) params\.delete\("section"\);\n'
              r'    else params\.set\("section", next\);\n'
              r'    const search = params\.toString\(\);\n'
              r'    navigate\(\{ search: search \? `\?\$\{search\}` : "" \}, \{ replace: true \}\);'
          )
          nav_replacement = '''    const url = new URL(window.location.href);
            if (next === "agents") url.searchParams.delete("section");
            else url.searchParams.set("section", next);
            window.history.replaceState(null, "", url);'''
          text, count = nav_pattern.subn(nav_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one selectSection navigation block, found {count}')

          path.write_text(text)
          PY

          rm -f .github/workflows/u04a-browser-diagnostics.yml
          rm -f blog-frontend/e2e/playwright.diagnostics.config.mjs
          rm -f blog-frontend/e2e/u04a-diagnostics.pw.mjs
          rm -f .github/workflows/u04a-finalize-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): stabilize AI settings browser interactions"
          git push origin HEAD:ui/u04a-browser-acceptance-20260913

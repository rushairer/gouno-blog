name: Temporary Media Compatibility Cleanup Fix

on:
  push:
    branches: [refactor/media-compat-cleanup]
    paths:
      - scripts/tmp-media-compat-fix.py
      - .github/workflows/tmp-media-compat-fix.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/media-compat-cleanup
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Remove Growth Media compatibility delegates and migrate final consumer
        run: |
          python3 scripts/tmp-media-compat-cleanup.py
          python3 scripts/tmp-media-compat-fix.py

      - name: Format and verify backend
        run: |
          gofmt -w \
            blog-backend/internal/repository/growth_repository.go \
            blog-backend/internal/service/growth_service.go \
            blog-backend/internal/agent/approval.go
          cd blog-backend
          go test ./...
          go vet ./...

      - name: Verify Media compatibility debt is gone
        run: |
          ! grep -q 'mediarepository' blog-backend/internal/repository/growth_repository.go
          ! grep -q 'CreateMedia\|GetMedia\|ListMedia\|UpdateMedia\|DeleteMedia\|MediaReferences' blog-backend/internal/repository/growth_repository.go
          ! grep -q 'mediaservice' blog-backend/internal/service/growth_service.go
          ! grep -q 'CreateMedia\|GetMedia\|ListMedia\|UpdateMedia\|DeleteMedia\|MediaReferences' blog-backend/internal/service/growth_service.go
          ! grep -q 'ErrMediaInUse\|ErrInvalidMediaPayload\|ErrInvalidMediaID\|legacyMediaError' blog-backend/internal/service/growth_service.go
          ! grep -q 's\.growth\.DeleteMedia' blog-backend/internal/agent/approval.go
          test ! -e blog-backend/internal/service/growth_service_media_compat_test.go
          grep -q 's\.mediaAssets\.DeleteMedia' blog-backend/internal/agent/approval.go
          grep -q 'fully canonical under `internal/media/{repository,service,controller}`' blog-backend/ARCHITECTURE.md

      - name: Remove migration scaffolding
        run: |
          rm scripts/tmp-media-compat-cleanup.py scripts/tmp-media-compat-fix.py
          rm .github/workflows/tmp-media-compat-cleanup.yml .github/workflows/tmp-media-compat-fix.yml

      - name: Commit cleanup
        run: |
          git config user.name Aben
          git config user.email 5195693+rushairer@users.noreply.github.com
          git add -A
          git commit -m 'refactor(media): remove Growth compatibility delegates'
          git push origin HEAD:refactor/media-compat-cleanup

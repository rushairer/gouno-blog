name: Prettier 3.9.9 Generator

on:
  push:
    branches:
      - probe/prettier399

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: probe/prettier399
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Upgrade and apply Prettier
        working-directory: blog-frontend
        run: |
          npm install --save-dev prettier@3.9.9
          npx prettier --write "src/**/*.{ts,tsx,css}"
      - name: Commit generated formatting
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/package.json blog-frontend/package-lock.json blog-frontend/src
          git commit -m "chore(deps): migrate to Prettier 3.9.9 [skip ci]"
          git push origin HEAD:probe/prettier399

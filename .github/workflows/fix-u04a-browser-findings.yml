name: Fix U04a Browser Findings

on:
  push:
    branches:
      - ui/u04a-browser-acceptance-20260913
    paths:
      - scripts/ui/fix-u04a-browser-findings.mjs
      - .github/workflows/fix-u04a-browser-findings.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ui/u04a-browser-acceptance-20260913
          fetch-depth: 0

      - name: Apply browser findings fixes
        run: node scripts/ui/fix-u04a-browser-findings.mjs

      - name: Verify diff
        run: git diff --check

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/admin/AISettings.tsx blog-frontend/src/styles/agent-console.css blog-frontend/src/pages/admin/__tests__/AISettings.test.tsx
          git commit -m "fix(ui): close U04a browser findings"
          git push origin HEAD:ui/u04a-browser-acceptance-20260913

name: Microcopy CI Diagnose

on:
  push:
    branches:
      - microcopy-ci-diagnose

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Source lint
        run: npm run lint
      - name: UI contracts
        run: npm run lint:ui
      - name: CSS contracts
        run: npm run lint:css
      - name: Typecheck
        run: npx tsc -b
      - name: Coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build

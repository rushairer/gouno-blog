name: Update Gouno UI Registry Dependency

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-gouno-ui.yml
  workflow_dispatch:
    inputs:
      version:
        description: Exact @gouno/ui version or npm dist-tag
        required: false
        default: 0.3.5

permissions:
  contents: write

concurrency:
  group: update-gouno-ui
  cancel-in-progress: false

jobs:
  update:
    name: Pin and verify npm registry release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gouno Blog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Resolve published Gouno UI version
        id: ui
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          REQUESTED_VERSION="${REQUESTED_VERSION:-0.3.5}"
          RESOLVED_VERSION="$(npm view "@gouno/ui@${REQUESTED_VERSION}" version)"
          test -n "$RESOLVED_VERSION"
          echo "version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Pin registry dependency and refresh lockfile
        working-directory: blog-frontend
        env:
          GOUNO_UI_VERSION: ${{ steps.ui.outputs.version }}
        run: |
          set -euo pipefail
          npm install --save-exact --package-lock-only --ignore-scripts "@gouno/ui@${GOUNO_UI_VERSION}"
          npm ci

      - name: Verify published package contract
        working-directory: blog-frontend
        env:
          GOUNO_UI_VERSION: ${{ steps.ui.outputs.version }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('./package.json', 'utf8'));
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          const installed = JSON.parse(await readFile('./node_modules/@gouno/ui/package.json', 'utf8'));
          const ui = lock.packages?.['node_modules/@gouno/ui'];
          const source = manifest.dependencies?.['@gouno/ui'];
          const exactVersion = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          if (!exactVersion.test(source || '') || source !== process.env.GOUNO_UI_VERSION) {
            throw new Error('blog-frontend must pin the requested exact @gouno/ui registry version');
          }
          if (!ui || ui.version !== source || !ui.resolved?.startsWith('https://registry.npmjs.org/@gouno/ui/-/ui-') || !ui.integrity) {
            throw new Error('blog-frontend lockfile must resolve @gouno/ui from npm with integrity');
          }
          if (installed.version !== source) {
            throw new Error('installed @gouno/ui version does not match the pinned registry version');
          }
          const core = await import('@gouno/ui/core');
          const theme = await import('@gouno/ui/theme');
          const patterns = await import('@gouno/ui/patterns');
          const gouno = await import('@gouno/ui/gouno');
          for (const [owner, mod, names] of [
            ['core', core, ['Button', 'Tabs', 'Card', 'Alert']],
            ['theme', theme, ['ThemeProvider']],
            ['patterns', patterns, ['BulkActionBar']],
            ['gouno', gouno, ['AppShell', 'PageContainer', 'PageHeader']],
          ]) {
            for (const name of names) {
              if (!mod[name]) throw new Error(`canonical ${owner} entrypoint is missing ${name}`);
            }
          }
          EOF

      - name: Run Blog frontend quality gates
        working-directory: blog-frontend
        run: npm run quality

      - name: Build Blog frontend container
        run: docker build -f blog-frontend/Dockerfile blog-frontend

      - name: Commit registry dependency update
        shell: bash
        env:
          GOUNO_UI_VERSION: ${{ steps.ui.outputs.version }}
        run: |
          set -euo pipefail
          git add blog-frontend/package.json blog-frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "@gouno/ui registry dependency is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ui): use @gouno/ui ${GOUNO_UI_VERSION} registry release"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Sync Gouno UI
# Last explicit upstream sync target: gouno-ui main@cb946376e32bcc0db18d13fb09d89d71b5780dca.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-gouno-ui.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Gouno UI branch, tag, or commit
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: sync-gouno-ui
  cancel-in-progress: false

jobs:
  sync:
    name: Build, verify, and vendor canonical Gouno UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gouno Blog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout Gouno UI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: rushairer/gouno-ui
          ref: ${{ inputs.ref || 'main' }}
          path: .gouno-ui
          persist-credentials: false

      - name: Setup Node.js 24 for Gouno UI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .gouno-ui/package-lock.json

      - name: Verify Gouno UI package
        working-directory: .gouno-ui
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
          npm run showcase:build

      - name: Pack canonical Gouno UI and record provenance
        shell: bash
        run: |
          set -euo pipefail
          VENDOR="$GITHUB_WORKSPACE/blog-frontend/vendor"
          FRONTEND_PACKAGE="$GITHUB_WORKSPACE/blog-frontend/package.json"
          PACKAGE_VERSION="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('.gouno-ui/package.json', 'utf8')); process.stdout.write(pkg.version);")"
          ARCHIVE="gouno-ui-${PACKAGE_VERSION}.tgz"

          find "$VENDOR" -maxdepth 1 -type f -name 'gouno-ui-[0-9]*.tgz' -delete
          PACK_JSON="$(cd .gouno-ui && npm pack --json)"
          PACK_FILE="$(printf '%s' "$PACK_JSON" | node --input-type=module -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const value = JSON.parse(s); if (!value[0]?.filename) process.exit(1); process.stdout.write(value[0].filename); });')"
          cp ".gouno-ui/$PACK_FILE" "$VENDOR/$ARCHIVE"

          GOUNO_UI_SHA="$(git -C .gouno-ui rev-parse HEAD)"
          SHA256="$(sha256sum "$VENDOR/$ARCHIVE" | awk '{print $1}')"
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$VENDOR/$ARCHIVE" | openssl base64 -A)"

          cat > "$VENDOR/gouno-ui-source.txt" <<EOF
          repository=https://github.com/rushairer/gouno-ui
          ref=${{ inputs.ref || 'main' }}
          sha=$GOUNO_UI_SHA
          EOF

          node --input-type=module - "$FRONTEND_PACKAGE" "$ARCHIVE" <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';
          const [, , path, archive] = process.argv;
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          pkg.dependencies['@gouno/ui'] = `file:vendor/${archive}`;
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          EOF

          node --input-type=module - "$VENDOR/ui-manifest.json" "$PACKAGE_VERSION" "$ARCHIVE" "$SHA256" "$INTEGRITY" "$GOUNO_UI_SHA" <<'EOF'
          import { writeFile } from 'node:fs/promises';
          const [, , path, version, archive, sha256, integrity, sourceSha] = process.argv;
          const manifest = {
            name: '@gouno/ui',
            version,
            archive,
            sha256,
            integrity,
            source: 'rushairer/gouno-ui',
            sourceSha,
          };
          await writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`);
          EOF

      - name: Setup Node.js 20 for Blog frontend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Refresh lockfile and verify Blog frontend
        working-directory: blog-frontend
        run: |
          set -euo pipefail
          rm -rf node_modules
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          if (lock.packages) delete lock.packages['node_modules/@gouno/ui'];
          await writeFile('./package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          EOF
          npm install --package-lock-only --ignore-scripts
          npm ci
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('./package.json', 'utf8'));
          const manifest = JSON.parse(await readFile('./vendor/ui-manifest.json', 'utf8'));
          const archive = await readFile(`./vendor/${manifest.archive}`);
          const installed = JSON.parse(await readFile('./node_modules/@gouno/ui/package.json', 'utf8'));
          const sha256 = createHash('sha256').update(archive).digest('hex');
          const integrity = `sha512-${createHash('sha512').update(archive).digest('base64')}`;
          if (pkg.dependencies?.['@gouno/ui'] !== `file:vendor/${manifest.archive}`) throw new Error('@gouno/ui dependency path does not match vendor manifest');
          if (installed.version !== manifest.version) throw new Error('@gouno/ui installed version does not match vendor manifest');
          if (manifest.sha256 !== sha256 || manifest.integrity !== integrity) throw new Error('@gouno/ui archive digest does not match vendor manifest');
          const source = await readFile('./vendor/gouno-ui-source.txt', 'utf8');
          if (!source.includes(`sha=${manifest.sourceSha}`)) throw new Error('canonical Gouno UI source SHA does not match vendor manifest');
          const core = await import('@gouno/ui/core');
          const theme = await import('@gouno/ui/theme');
          const patterns = await import('@gouno/ui/patterns');
          const gouno = await import('@gouno/ui/gouno');
          for (const [owner, mod, names] of [
            ['core', core, ['Button', 'Tabs', 'Card', 'Alert']],
            ['theme', theme, ['ThemeProvider']],
            ['patterns', patterns, ['BulkActionBar']],
            ['gouno', gouno, ['AppShell', 'PageContainer', 'PageHeader']],
          ]) {
            for (const name of names) if (!mod[name]) throw new Error(`canonical ${owner} entrypoint is missing ${name}`);
          }
          EOF
          npm run quality

      - name: Build Blog frontend container
        run: docker build -f blog-frontend/Dockerfile blog-frontend

      - name: Commit synchronized canonical package
        shell: bash
        run: |
          set -euo pipefail
          git add -A blog-frontend/vendor \
                     blog-frontend/package.json \
                     blog-frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Canonical Gouno UI package is already synchronized."
            exit 0
          fi
          GOUNO_UI_VERSION="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('blog-frontend/package.json', 'utf8')); process.stdout.write(pkg.dependencies['@gouno/ui'].match(/gouno-ui-(.+)\.tgz$/)?.[1] || 'unknown');")"
          GOUNO_UI_SHA="$(git -C .gouno-ui rev-parse --short=12 HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ui): sync gouno ui ${GOUNO_UI_VERSION} ${GOUNO_UI_SHA}"
          git push origin HEAD:main

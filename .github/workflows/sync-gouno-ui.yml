name: Update Gouno UI Registry Dependency

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-gouno-ui.yml
  workflow_dispatch:
    inputs:
      version:
        description: Exact @gouno/ui version or npm dist-tag
        required: false
        default: 0.3.2

permissions:
  contents: write

concurrency:
  group: update-gouno-ui
  cancel-in-progress: false

jobs:
  update:
    name: Resolve, verify, and pin npm registry release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gouno Blog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Resolve published Gouno UI version
        id: ui
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version || '0.3.2' }}
        run: |
          set -euo pipefail
          RESOLVED_VERSION="$(npm view "@gouno/ui@${REQUESTED_VERSION}" version)"
          test -n "$RESOLVED_VERSION"
          echo "version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Pin registry dependency and refresh lockfile
        working-directory: blog-frontend
        env:
          GOUNO_UI_VERSION: ${{ steps.ui.outputs.version }}
        run: |
          set -euo pipefail
          npm install --save-exact --package-lock-only --ignore-scripts "@gouno/ui@${GOUNO_UI_VERSION}"
          npm ci

      - name: Verify published package contract
        working-directory: blog-frontend
        env:
          GOUNO_UI_VERSION: ${{ steps.ui.outputs.version }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';

          const manifest = JSON.parse(await readFile('./package.json', 'utf8'));
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          const installed = JSON.parse(await readFile('./node_modules/@gouno/ui/package.json', 'utf8'));
          const ui = lock.packages?.['node_modules/@gouno/ui'];
          const source = manifest.dependencies?.['@gouno/ui'];
          const exactVersion = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          const registryTarball = /^https:\/\/registry\.npmjs\.org\/@gouno\/ui\/-\/ui-[0-9A-Za-z.-]+\.tgz$/;

          if (!exactVersion.test(source || '') || source !== process.env.GOUNO_UI_VERSION) {
            throw new Error('blog-frontend must pin the requested exact @gouno/ui registry version');
          }
          if (!ui || ui.version !== source || !registryTarball.test(ui.resolved || '') || !ui.integrity) {
            throw new Error('blog-frontend lockfile must resolve @gouno/ui from npm with integrity');
          }
          if (installed.version !== source) {
            throw new Error('installed @gouno/ui version does not match the pinned registry version');
          }

          const core = await import('@gouno/ui/core');
          const theme = await import('@gouno/ui/theme');
          const patterns = await import('@gouno/ui/patterns');
          const gouno = await import('@gouno/ui/gouno');
          for (const [owner, mod, names] of [
            ['core', core, ['Button', 'Tabs', 'Card', 'Alert']],
            ['theme', theme, ['ThemeProvider']],
            ['patterns', patterns, ['BulkActionBar']],
            ['gouno', gouno, ['AppShell', 'PageContainer', 'PageHeader']],
          ]) {
            for (const name of names) {
              if (!mod[name]) throw new Error(`canonical ${owner} entrypoint is missing ${name}`);
            }
          }
          EOF

      - name: Retire vendored distribution plumbing
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          start_marker = '      - name: Verify Gouno UI vendor provenance\n'
          end_marker = '      - name: Verify shared GOSSO client registry release\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('could not locate Blog CI vendored Gouno UI verification block')
          replacement = '''      - name: Verify Gouno UI registry release
            run: |
              node --input-type=module <<'EOF'
              import { readFile } from 'node:fs/promises';
              const manifest = JSON.parse(await readFile('./package.json', 'utf8'));
              const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
              const ui = lock.packages['node_modules/@gouno/ui'];
              const source = manifest.dependencies?.['@gouno/ui'];
              const exactVersion = /^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/;
              const registryTarball = /^https:\\/\\/registry\\.npmjs\\.org\\/@gouno\\/ui\\/-\\/ui-[0-9A-Za-z.-]+\\.tgz$/;
              if (!exactVersion.test(source || '') || !ui || ui.version !== source ||
                  !registryTarball.test(ui.resolved || '') || !ui.integrity) {
                throw new Error('blog-frontend must use an exact @gouno/ui registry version with lockfile integrity');
              }
              EOF

'''
          ci.write_text(text[:start] + replacement + text[end:])

          replace_once('blog-frontend/Dockerfile', 'COPY vendor/gouno-ui-*.tgz ./vendor/\n', '')
          replace_once(
              'packages/ui/README.md',
              '`blog-frontend` consumes its verified vendored artifact as `@gouno/ui`',
              '`blog-frontend` consumes an exact immutable npm registry release as `@gouno/ui`',
          )

          agents = Path('AGENTS.md')
          text = agents.read_text()
          replacements = [
              ('`blog-frontend` consumes its verified vendored artifact as `@gouno/ui`', '`blog-frontend` consumes an exact immutable npm registry release as `@gouno/ui`'),
              ('Canonical artifacts are synchronized only through `.github/workflows/sync-gouno-ui.yml`. The workflow must build and verify the selected upstream ref, derive the package version dynamically, update only the canonical archive/dependency/manifest/provenance, run `blog-frontend` quality, and build the frontend Docker image before committing.', 'Registry upgrades are performed through `.github/workflows/sync-gouno-ui.yml`. The workflow resolves a published npm version, pins it exactly, refreshes the lockfile, verifies supported package entrypoints, runs `blog-frontend` quality, and builds the frontend Docker image before committing.'),
              ('Keep `blog-frontend/vendor/ui-manifest.json`, `blog-frontend/vendor/gouno-ui-source.txt`, `blog-frontend/package.json`, and the canonical lockfile entry synchronized with the exact external artifact. There is no legacy compatibility archive, manifest, lockfile entry, or Tailwind source.', 'Keep `blog-frontend/package.json` and the canonical lockfile entry synchronized with the exact npm registry release. The lockfile must retain the registry tarball URL and integrity metadata; local UI archives, manifests, provenance files, compatibility aliases, and legacy Tailwind sources are forbidden.'),
              ('Before committing any UI vendor change, run `npm ci` and `npm run quality` in `blog-frontend`, then build the Dockerfile (`docker build -f blog-frontend/Dockerfile blog-frontend`) so package, lockfile, runtime imports, Tailwind sources and container build are verified together.', 'Before committing any Gouno UI dependency change, run `npm ci` and `npm run quality` in `blog-frontend`, then build the Dockerfile (`docker build -f blog-frontend/Dockerfile blog-frontend`) so package, lockfile, runtime imports, Tailwind sources and container build are verified together.'),
              ('Run typecheck, tests, builds, and vendored package synchronization at the end of a coherent UI phase.', 'Run typecheck, tests, builds, and registry dependency verification at the end of a coherent UI phase.'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected AGENTS.md text not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          agents.write_text(text)
          PY
          rm -rf blog-frontend/vendor

      - name: Run Blog frontend quality gates
        working-directory: blog-frontend
        run: npm run quality

      - name: Build Blog frontend container
        run: docker build -f blog-frontend/Dockerfile blog-frontend

      - name: Commit registry dependency migration
        shell: bash
        env:
          GOUNO_UI_VERSION: ${{ steps.ui.outputs.version }}
        run: |
          set -euo pipefail
          git add -A .github/workflows/ci.yml \
                     AGENTS.md \
                     packages/ui/README.md \
                     blog-frontend/Dockerfile \
                     blog-frontend/vendor \
                     blog-frontend/package.json \
                     blog-frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "@gouno/ui registry dependency is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ui): use @gouno/ui ${GOUNO_UI_VERSION} registry release"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

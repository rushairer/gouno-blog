name: One-shot U03d Ledger Reconciliation

on:
  push:
    branches:
      - ui/browser-acceptance-20260913
    paths:
      - scripts/ui/close-u03d-ledger.mjs
      - .github/workflows/close-u03d-ledger.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ui/browser-acceptance-20260913
          fetch-depth: 0

      - name: Reconcile ledgers
        run: node scripts/ui/close-u03d-ledger.mjs

      - name: Verify diff
        run: git diff --check

      - name: Commit reconciled ledgers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-redesign/MIGRATION.md docs/ui-redesign/migration.json
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            exit 0
          fi
          git commit -m "docs(ui): reconcile U03d migration ledgers"
          git push origin HEAD:ui/browser-acceptance-20260913

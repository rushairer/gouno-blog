name: Format Sudo Parity

on:
  push:
    branches:
      - ui/blog-admin-final-parity-sudo

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/blog-admin-final-parity-sudo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - working-directory: blog-frontend
        run: npm ci
      - working-directory: blog-frontend
        run: npx prettier --write src/components/auth/SudoGate.tsx src/components/auth/__tests__/SudoGate.test.tsx src/pages/admin/Users.tsx
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add blog-frontend/src/components/auth/SudoGate.tsx blog-frontend/src/components/auth/__tests__/SudoGate.test.tsx blog-frontend/src/pages/admin/Users.tsx
          git commit -m "style(ui): format sudo parity"
          git push origin HEAD:ui/blog-admin-final-parity-sudo

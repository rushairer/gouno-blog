name: Format PostDetail once

on:
  push:
    branches:
      - reverse-migration/showcase-2026-09-19
    paths:
      - .github/workflows/format-post-detail-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'rushairer/gouno-blog'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reverse-migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: reverse-migration/showcase-2026-09-19
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Apply repository Prettier
        working-directory: blog-frontend
        run: npx prettier --write src/pages/PostDetail.tsx

      - name: Remove one-time workflow and push formatter result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-post-detail-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/PostDetail.tsx .github/workflows/format-post-detail-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(public): apply repository Prettier output"
          git push origin HEAD:reverse-migration/showcase-2026-09-19

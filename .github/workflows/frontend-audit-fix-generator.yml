name: Frontend Audit Fix Generator

on:
  push:
    branches:
      - chore/frontend-major-closeout

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/frontend-major-closeout
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Refresh Vitest patch line and production transitive audit fixes
        working-directory: blog-frontend
        run: |
          npm install --package-lock-only --save-dev vitest@^4.1.11 @vitest/coverage-v8@4.1.11
          npm audit fix --package-lock-only --omit=dev
          npm audit --omit=dev --audit-level=high
      - name: Commit fixed npm state
        run: |
          git diff --check
          if git diff --quiet -- blog-frontend/package.json blog-frontend/package-lock.json; then
            echo "npm state already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/package.json blog-frontend/package-lock.json
          git commit -m "chore(deps): clear frontend audit drift [skip ci]"
          git push origin HEAD:chore/frontend-major-closeout

name: One-shot DB infrastructure convergence

on:
  push:
    branches:
      - refactor/dbtx-consumer-cutover

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/dbtx-consumer-cutover
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Apply fail-closed cutover
        run: python3 .github/refactor_db_infrastructure_cutover.py

      - name: Format and verify architecture slice
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            blog-backend/cmd/gouno/web.go \
            blog-backend/internal/dberror/errors.go \
            blog-backend/internal/dberror/errors_test.go \
            blog-backend/internal/knowledge/service.go \
            blog-backend/internal/operations/service.go \
            blog-backend/internal/operations/service_test.go \
            blog-backend/internal/workflow/service.go \
            blog-backend/internal/agent/management.go \
            blog-backend/internal/agent/runner.go \
            blog-backend/internal/repository/transaction.go
          git diff --check
          git diff --exit-code -- blog-backend/internal/connector
          cd blog-backend
          go test ./...
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Commit verified slice
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refactor-db-infrastructure-cutover.yml
          rm .github/refactor_db_infrastructure_cutover.py
          git add -A
          git diff --cached --check
          git diff --cached --exit-code -- blog-backend/internal/connector
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(db): cut over shared database infrastructure"
          git push origin HEAD:refactor/dbtx-consumer-cutover

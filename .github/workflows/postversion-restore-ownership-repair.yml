name: PostVersion restore ownership repair

on:
  push:
    branches:
      - refactor/postversion-restore-ownership

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Apply corrected staged migration
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from textwrap import dedent

          workflow_path = Path('.github/workflows/postversion-restore-ownership-staging.yml')
          workflow = workflow_path.read_text()
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          assert marker in workflow and end_marker in workflow
          source = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          source = dedent(source)

          # The first staging run used String.replace on generated Go source,
          # which also removed intentional field-alignment spaces. Convert only
          # those raw-source expressions to textwrap.dedent so internal spacing
          # survives while YAML/Python indentation is removed.
          pattern = re.compile(r"r'''(.*?)'''\.replace\(\"          \", \"\"\)", re.S)
          source, replacements = pattern.subn(lambda match: "dedent(r'''" + match.group(1) + "''')", source)
          assert replacements >= 1
          source = "from textwrap import dedent\n" + source
          exec(compile(source, '<postversion-staging>', 'exec'), {})
          PY

      - name: Format
        working-directory: blog-backend
        run: gofmt -w internal/post/restore.go internal/post/repository/post_repository.go internal/postversion cmd/gouno/postversion_composition.go cmd/gouno/web.go router/web_test.go

      - name: Focused tests
        working-directory: blog-backend
        run: go test ./internal/postversion/... ./internal/post/... ./cmd/gouno ./router

      - name: Focused vet
        working-directory: blog-backend
        run: go vet ./internal/postversion/... ./internal/post/... ./cmd/gouno ./router

      - name: Ownership guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          repo = Path('blog-backend/internal/postversion/repository/repository.go').read_text()
          assert 'UPDATE posts' not in repo
          assert 'BeginTx(' not in repo
          assert 'RestoreVersion(' not in repo
          assert 'GetVersionTx(' in repo
          post_repo = Path('blog-backend/internal/post/repository/post_repository.go').read_text()
          assert 'RestoreSnapshotTx(' in post_repo
          coordinator = Path('blog-backend/internal/postversion/coordinator.go').read_text()
          assert 'c.transactor.Run(' in coordinator
          assert 'c.versions.GetVersionTx(' in coordinator
          assert 'c.posts.RestoreSnapshotTx(' in coordinator
          PY

      - name: Commit validated source and self-clean
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm .github/workflows/postversion-restore-ownership-staging.yml .github/workflows/postversion-restore-ownership-repair.yml
          git add blog-backend
          git commit -m "refactor(postversion): converge restore ownership"
          git push origin HEAD:refactor/postversion-restore-ownership

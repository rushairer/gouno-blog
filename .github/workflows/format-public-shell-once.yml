name: Format public shell once

on:
  push:
    branches:
      - ui/showcase-brand-runtime-parity-20260913
    paths:
      - .github/workflows/format-public-shell-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/showcase-brand-runtime-parity-20260913
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Apply Prettier
        working-directory: blog-frontend
        run: npx prettier --write src/layouts/PublicShell.tsx
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- blog-frontend/src/layouts/PublicShell.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/layouts/PublicShell.tsx
          git commit -m "style(ui): apply prettier to public shell"
          git push origin HEAD:ui/showcase-brand-runtime-parity-20260913

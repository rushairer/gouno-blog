name: PR Format Assist

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/blog-admin-manual-parity-pass-20260920'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Apply repository Prettier
        working-directory: blog-frontend
        run: |
          npx prettier --write \
            src/components/agent/AdvancedWorkspace.tsx \
            src/components/agent/AgentForm.tsx \
            src/components/agent/AISettingsEditorPatterns.tsx \
            src/components/agent/DecisionInboxWorkspace.tsx \
            src/components/agent/ProviderForm.tsx \
            src/components/agent/SkillForm.tsx \
            src/components/agent/WorkflowRunDetail.tsx \
            src/components/agent/WorkflowRunRecords.tsx \
            src/components/agent/WorkflowWorkspace.tsx

      - name: Commit formatting when needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog-frontend/src/components/agent/AdvancedWorkspace.tsx \
            blog-frontend/src/components/agent/AgentForm.tsx \
            blog-frontend/src/components/agent/AISettingsEditorPatterns.tsx \
            blog-frontend/src/components/agent/DecisionInboxWorkspace.tsx \
            blog-frontend/src/components/agent/ProviderForm.tsx \
            blog-frontend/src/components/agent/SkillForm.tsx \
            blog-frontend/src/components/agent/WorkflowRunDetail.tsx \
            blog-frontend/src/components/agent/WorkflowRunRecords.tsx \
            blog-frontend/src/components/agent/WorkflowWorkspace.tsx
          if git diff --cached --quiet; then
            echo 'Formatting already canonical.'
            exit 0
          fi
          git commit -m 'style(ui): apply canonical Prettier output'
          git push origin HEAD:${{ github.head_ref }}

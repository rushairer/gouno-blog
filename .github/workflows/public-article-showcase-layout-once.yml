name: Public article Showcase layout once

on:
  push:
    branches:
      - ui/public-article-showcase-layout-20260913

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Align PostDetail composition to Showcase
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'blog-frontend/src/pages/PostDetail.tsx';
          let source = fs.readFileSync(path, 'utf8');

          function replaceRequired(before, after, label) {
            if (!source.includes(before)) throw new Error(`missing ${label}`);
            source = source.replace(before, after);
          }

          replaceRequired(
            'import { Link, useParams, useSearchParams } from "react-router-dom";',
            'import { useParams, useSearchParams } from "react-router-dom";',
            'router import',
          );
          replaceRequired(
            'import { MarkdownRenderer } from "../components/MarkdownRenderer";\n',
            'import { MarkdownRenderer } from "../components/MarkdownRenderer";\nimport { ArticleTeaser } from "../components/reading/ArticleTeaser";\n',
            'ArticleTeaser import anchor',
          );

          replaceRequired(
            `    return (\n      <div className="mx-auto flex min-h-[50vh] max-w-3xl items-center justify-center">\n        <Result`,
            `    return (\n      <Card padding="none" variant="subtle">\n        <Result`,
            'error card open',
          );
          replaceRequired(
            `        />\n      </div>\n    );\n  }\n\n  const toc = extractMarkdownTOC(post.content);`,
            `        />\n      </Card>\n    );\n  }\n\n  const toc = extractMarkdownTOC(post.content);`,
            'error card close',
          );

          replaceRequired(
            `      <div\n        className="fixed inset-x-0 top-0 z-50 h-1 bg-primary transition-[width]"\n        style={{ width: \`${'${scrollProgress}'}%\` }}\n      />`,
            `      <div aria-hidden="true" className="fixed inset-x-0 top-0 z-50 h-1 bg-muted">\n        <div\n          className="h-full bg-primary transition-[width]"\n          style={{ width: \`${'${scrollProgress}'}%\` }}\n        />\n      </div>`,
            'scroll progress',
          );
          replaceRequired(
            '<div className="mx-auto flex w-full max-w-6xl flex-col gap-8">',
            '<div className="flex w-full flex-col gap-8">',
            'outer width',
          );

          const backBefore = `        <Link\n          to="/articles"\n          className="inline-flex w-fit items-center gap-2 text-sm text-muted-foreground hover:text-primary"\n        >\n          <ArrowLeft size={16} />\n          {t("backToFeed")}\n        </Link>`;
          const backAfter = `        <ButtonLink\n          variant="text"\n          to="/articles"\n          className="w-fit px-0"\n          icon={<ArrowLeft size={16} />}\n        >\n          {t("backToFeed")}\n        </ButtonLink>`;
          replaceRequired(backBefore, backAfter, 'back control');

          replaceRequired(
            `          className={\`grid min-w-0 gap-8 ${'${'}toc.length === 0 ? "mx-auto w-full max-w-4xl" : "lg:grid-cols-[minmax(0,1fr)_16rem]"}\`}`,
            `          className={\`grid min-w-0 items-start gap-8 ${'${'}toc.length === 0 ? "mx-auto w-full max-w-4xl" : "lg:grid-cols-[minmax(0,1fr)_15rem]"}\`}`,
            'reading grid',
          );

          const articleBefore = `          <Card as="article" className="gap-8 p-5 sm:p-8">\n            <div className="flex flex-col gap-5 border-b pb-8">\n              {post.cover_url ? (\n                <img\n                  className="max-h-[28rem] w-full rounded-lg border object-cover"\n                  src={post.cover_url}\n                  alt={post.cover_alt || post.title}\n                />\n              ) : null}\n              <PageHeader title={post.title} description={post.summary} />\n              <div className="flex flex-wrap gap-x-5 gap-y-2 text-xs text-muted-foreground">\n                <span className="inline-flex items-center gap-1.5">\n                  <Calendar size={15} />\n                  {formatDate(post.created_at, {\n                    year: "numeric",\n                    month: "long",\n                    day: "numeric",\n                  })}\n                </span>\n                <span className="inline-flex items-center gap-1.5">\n                  <User size={15} />\n                  {t("author")}\n                </span>\n                <span className="inline-flex items-center gap-1.5">\n                  <Eye size={15} />\n                  {views}\n                </span>\n                <span className="inline-flex items-center gap-1.5">\n                  <Heart size={15} />\n                  {likes}\n                </span>\n              </div>\n              <div className="flex flex-wrap gap-2">\n                {post.tags.map((tag) => (\n                  <Tag key={tag}>#{tag}</Tag>\n                ))}\n              </div>\n            </div>\n\n            <MarkdownRenderer content={post.content} />\n\n            <div className="flex justify-center border-t pt-6">\n              <Button\n                variant="ghost"\n                className={\`like-button ${'${'}liked ? "liked" : ""}\`}\n                onClick={handleLike}\n                aria-pressed={liked}\n                icon={\n                  <Heart size={20} fill={liked ? "currentColor" : "none"} />\n                }\n              >\n                {likes} {t("likes")}\n              </Button>\n            </div>\n          </Card>`;

          const articleAfter = `          <Card as="article" padding="none" className="overflow-hidden">\n            {post.cover_url ? (\n              <img\n                className="aspect-[16/7] w-full border-b object-cover"\n                src={post.cover_url}\n                alt={post.cover_alt || post.title}\n              />\n            ) : null}\n            <div className="space-y-8 p-6 sm:p-8">\n              <PageHeader title={post.title} description={post.summary} />\n              <div className="flex flex-wrap items-center gap-x-5 gap-y-3 border-y py-4 text-sm text-muted-foreground">\n                <span className="inline-flex items-center gap-1.5">\n                  <Calendar size={15} />\n                  {formatDate(post.created_at, {\n                    year: "numeric",\n                    month: "long",\n                    day: "numeric",\n                  })}\n                </span>\n                <span className="inline-flex items-center gap-1.5">\n                  <User size={15} />\n                  {t("author")}\n                </span>\n                <span className="inline-flex items-center gap-1.5">\n                  <Eye size={15} />\n                  {views}\n                </span>\n                <span className="inline-flex items-center gap-1.5">\n                  <Heart size={15} />\n                  {likes}\n                </span>\n                <div className="flex flex-wrap gap-2 sm:ml-auto">\n                  {post.tags.map((tag) => (\n                    <Tag key={tag}>#{tag}</Tag>\n                  ))}\n                </div>\n              </div>\n\n              <MarkdownRenderer content={post.content} />\n\n              <div className="flex justify-center border-t pt-6">\n                <Button\n                  variant="ghost"\n                  className={\`like-button ${'${'}liked ? "liked" : ""}\`}\n                  onClick={handleLike}\n                  aria-pressed={liked}\n                  icon={\n                    <Heart size={20} fill={liked ? "currentColor" : "none"} />\n                  }\n                >\n                  {likes} {t("likes")}\n                </Button>\n              </div>\n            </div>\n          </Card>`;
          replaceRequired(articleBefore, articleAfter, 'article composition');

          replaceRequired(
            '<Card className="gap-3 p-4">',
            '<Card variant="subtle" padding="sm" className="gap-3">',
            'toc card',
          );

          const relatedBefore = `        {relatedPosts.length > 0 ? (\n          <Card className="gap-5">\n            <h2 className="text-lg font-semibold">{t("relatedPosts")}</h2>\n            <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">\n              {relatedPosts.map((item) => (\n                <Link\n                  key={item.id}\n                  to={\`/articles/${'${'}item.slug}\`}\n                  className="flex min-w-0 flex-col gap-2 rounded-lg border p-4 hover:border-primary hover:bg-accent/40"\n                >\n                  <strong>{item.title}</strong>\n                  <span className="line-clamp-2 text-sm text-muted-foreground">\n                    {item.summary}\n                  </span>\n                  <small className="text-xs text-muted-foreground">\n                    {item.tags\n                      .slice(0, 3)\n                      .map((tag) => \`#${'${'}tag}\`)\n                      .join(" ")}\n                  </small>\n                </Link>\n              ))}\n            </div>\n          </Card>\n        ) : null}`;
          const relatedAfter = `        {relatedPosts.length > 0 ? (\n          <section\n            aria-labelledby="related-reading"\n            className="mx-auto w-full max-w-[900px]"\n          >\n            <div className="border-b pb-3">\n              <h2\n                id="related-reading"\n                className="text-xl font-semibold tracking-tight"\n              >\n                {t("relatedPosts")}\n              </h2>\n            </div>\n            {relatedPosts.map((item) => (\n              <ArticleTeaser key={item.id} post={item} compact />\n            ))}\n          </section>\n        ) : null}`;
          replaceRequired(relatedBefore, relatedAfter, 'related reading');

          fs.writeFileSync(path, source);

          const testPath = 'blog-frontend/src/pages/__tests__/PostDetail.test.tsx';
          let test = fs.readFileSync(testPath, 'utf8');
          const testAnchor = `    expect(screen.getByRole("img", { name: "Cover image" })).toHaveAttribute(\n      "src",\n      "/media/cover.jpg",\n    );\n`;
          if (!test.includes(testAnchor)) throw new Error('PostDetail test cover anchor missing');
          test = test.replace(
            testAnchor,
            testAnchor + `    const articleCard = screen\n      .getByRole("heading", { name: "Markdown Post" })\n      .closest('[data-slot="card"]');\n    expect(articleCard).toHaveClass("overflow-hidden");\n    expect(articleCard?.querySelector("img")).toHaveClass(\n      "aspect-[16/7]",\n      "border-b",\n    );\n    expect(screen.getByRole("heading", { name: /related/i }).closest("section")).toHaveClass(\n      "max-w-[900px]",\n    );\n`,
          );
          fs.writeFileSync(testPath, test);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Format changed files
        working-directory: blog-frontend
        run: npx prettier --write src/pages/PostDetail.tsx src/pages/__tests__/PostDetail.test.tsx

      - name: Verify Blog frontend quality
        working-directory: blog-frontend
        run: npm run quality

      - name: Commit parity fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/PostDetail.tsx blog-frontend/src/pages/__tests__/PostDetail.test.tsx
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(ui): align public article layout with Showcase"
          git push

name: Reverse migrate AI Operations run center once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-ai-ops-run-center-master-detail-once.yml

permissions:
  contents: write

jobs:
  migrate-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Reverse migrate Run Center master detail
        run: |
          set -euo pipefail
          npm --prefix blog-frontend ci
          node .github/scripts/migrate-ai-ops-run-center-master-detail.mjs
          npx --prefix blog-frontend prettier --write \
            blog-frontend/src/components/agent/WorkflowRunRecords.tsx \
            blog-frontend/src/components/agent/WorkflowRunDetail.tsx

      - name: Commit migration
        run: |
          set -euo pipefail
          git add blog-frontend/src/components/agent/WorkflowRunRecords.tsx \
                  blog-frontend/src/components/agent/WorkflowRunDetail.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ai-ops): reverse migrate run center master detail"
          git push origin HEAD:main

# Retry after repairing the one-shot migration generator.

name: One-shot U04a Locator Fix

on:
  push:
    branches:
      - ui/u04a-browser-acceptance-20260913
    paths:
      - scripts/ui/fix-u04a-workflow-locator.mjs
      - .github/workflows/fix-u04a-locator.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ui/u04a-browser-acceptance-20260913
          fetch-depth: 0

      - name: Apply locator fix
        run: node scripts/ui/fix-u04a-workflow-locator.mjs

      - name: Verify diff
        run: git diff --check

      - name: Commit locator fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/e2e/ai-workspace-interactions.pw.mjs
          git commit -m "test(ui): fix Workflow output locator"
          git push origin HEAD:ui/u04a-browser-acceptance-20260913

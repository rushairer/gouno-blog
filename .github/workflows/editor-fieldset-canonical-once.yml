name: Editor fieldset canonical once

on:
  push:
    branches:
      - ui/editor-fieldset-canonical-20260913

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Align Post Editor fieldset to Showcase
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const editorPath = 'blog-frontend/src/pages/admin/PostEditor.tsx';
          let editor = fs.readFileSync(editorPath, 'utf8');
          const before = '<fieldset disabled={isReadOnly} className="fieldset-unstyled">';
          const after = '<fieldset disabled={isReadOnly} className="min-w-0 border-0 p-0">';
          if (!editor.includes(before)) throw new Error('PostEditor fieldset anchor missing');
          editor = editor.replace(before, after);
          fs.writeFileSync(editorPath, editor);

          const contractPath = 'blog-frontend/scripts/check-ui-contracts.mjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          const anchor = `        if (/(^|\\s)editor-panel(?:\\s|$)/.test(value)) {\n          failures.push(\n            \`${'${name}'}:${'${location(sourceFile, attribute)}'} retired editor-panel compatibility class must not be reintroduced; Card owns the container surface\`,\n          );\n        }\n`;
          const addition = anchor + `        if (/(^|\\s)fieldset-unstyled(?:\\s|$)/.test(value)) {\n          failures.push(\n            \`${'${name}'}:${'${location(sourceFile, attribute)}'} retired fieldset-unstyled compatibility class must not be reintroduced; use explicit min-w-0 border-0 p-0 layout utilities\`,\n          );\n        }\n`;
          if (!contract.includes(anchor)) throw new Error('UI contract fieldset anchor missing');
          contract = contract.replace(anchor, addition);
          fs.writeFileSync(contractPath, contract);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Format changed files
        working-directory: blog-frontend
        run: npx prettier --write src/pages/admin/PostEditor.tsx scripts/check-ui-contracts.mjs

      - name: Verify Blog frontend quality
        working-directory: blog-frontend
        run: npm run quality

      - name: Commit parity fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/admin/PostEditor.tsx blog-frontend/scripts/check-ui-contracts.mjs
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(ui): align editor fieldset with Showcase"
          git push

name: Phase 37B2 migrate WorkflowWorkspace

on:
  push:
    branches:
      - ui/workflow-workspace-canonical-phase37b2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/workflow-workspace-canonical-phase37b2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Migrate final WorkflowWorkspace legacy surfaces
        working-directory: blog-frontend
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ts = require('typescript');

          const sourcePath = 'src/components/agent/WorkflowWorkspace.tsx';
          let text = fs.readFileSync(sourcePath, 'utf8');

          const oldCore = `import {\n  Alert,\n  Button,\n  ButtonLink,\n  Checkbox,\n  CheckboxField,\n  Empty,\n  Field,\n  IconButton,\n  Input,\n  Modal,\n  SearchField,\n  Textarea,\n} from "@gouno/ui/core";`;
          const nextCore = `import {\n  Alert,\n  Button,\n  ButtonLink,\n  Card,\n  Checkbox,\n  CheckboxField,\n  Empty,\n  Field,\n  FormActions,\n  FormLayout,\n  IconButton,\n  Input,\n  Modal,\n  SearchField,\n  Select,\n  Textarea,\n} from "@gouno/ui/core";`;
          if (!text.includes(oldCore)) throw new Error('canonical import block not found');
          text = text.replace(oldCore, nextCore);

          const legacyImport = `import { EditorPanel, FormActions, FormLayout, Select } from "@gouno/ui-legacy";\n`;
          if (!text.includes(legacyImport)) throw new Error('final legacy import block not found');
          text = text.replace(legacyImport, '');

          const panelAnchor = `function PanelHeader({\n  title,\n  description,\n  actions,\n}: {\n  title: ReactNode;\n  description?: ReactNode;\n  actions?: ReactNode;\n}) {\n  return (\n    <div className="flex flex-wrap items-start justify-between gap-4">\n      <div className="min-w-0">\n        <h3 className="text-base font-semibold text-foreground">{title}</h3>\n        {description ? (\n          <p className="mt-1 text-sm text-muted-foreground">{description}</p>\n        ) : null}\n      </div>\n      {actions ? <div className="shrink-0">{actions}</div> : null}\n    </div>\n  );\n}\n`;
          if (!text.includes(panelAnchor)) throw new Error('PanelHeader anchor not found');
          const helpers = `${panelAnchor}\nfunction selectValue(value: string | string[]) {\n  return Array.isArray(value) ? (value[0] ?? "") : value;\n}\n\nfunction EditorPanel({\n  title,\n  description,\n  icon,\n  closeLabel,\n  onClose,\n  children,\n  className,\n}: {\n  title: ReactNode;\n  description?: ReactNode;\n  icon?: ReactNode;\n  closeLabel: string;\n  onClose: () => void;\n  children: ReactNode;\n  className?: string;\n}) {\n  return (\n    <Card\n      padding="none"\n      className={["editor-panel", "p-4 md:p-6", className]\n        .filter(Boolean)\n        .join(" ")}\n    >\n      <PanelHeader\n        title={\n          <span className="flex items-center gap-2">\n            {icon}\n            {title}\n          </span>\n        }\n        description={description}\n        actions={\n          <IconButton\n            variant="ghost"\n            size="small"\n            label={closeLabel}\n            icon={<X />}\n            onClick={onClose}\n          />\n        }\n      />\n      {children}\n    </Card>\n  );\n}\n`;
          text = text.replace(panelAnchor, helpers);

          text = text.replaceAll('value={step.agent_id || ""}', 'value={step.agent_id ? String(step.agent_id) : ""}');
          text = text.replaceAll('value={nested.agent_id || ""}', 'value={nested.agent_id ? String(nested.agent_id) : ""}');
          text = text.replace('value={boundAgentID}', 'value={boundAgentID === "" ? "" : String(boundAgentID)}');

          const sf = ts.createSourceFile(sourcePath, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
          const edits = [];
          const addEdit = (start, end, replacement) => edits.push({ start, end, replacement });
          let selectCount = 0;
          let changeCount = 0;

          function fieldLabelFor(node) {
            let current = node.parent;
            while (current) {
              if (ts.isJsxElement(current) && current.openingElement.tagName.getText(sf) === 'Field') {
                const labelAttr = current.openingElement.attributes.properties.find(
                  (item) => ts.isJsxAttribute(item) && item.name.text === 'label',
                );
                if (!labelAttr || !labelAttr.initializer) return null;
                if (ts.isStringLiteral(labelAttr.initializer)) {
                  return `aria-label=${labelAttr.initializer.getText(sf)}`;
                }
                if (ts.isJsxExpression(labelAttr.initializer)) {
                  return `aria-label=${labelAttr.initializer.getText(sf)}`;
                }
                return null;
              }
              current = current.parent;
            }
            return null;
          }

          function visit(node) {
            if (ts.isJsxOpeningElement(node) || ts.isJsxSelfClosingElement(node)) {
              if (node.tagName.getText(sf) === 'Select') {
                selectCount += 1;
                const attrs = node.attributes.properties.filter(ts.isJsxAttribute);
                const hasAriaLabel = attrs.some((attr) => attr.name.text === 'aria-label' || attr.name.text === 'aria-labelledby');
                if (!hasAriaLabel) {
                  const label = fieldLabelFor(node);
                  if (!label) throw new Error(`Select without inferable accessible label at ${sf.getLineAndCharacterOfPosition(node.getStart(sf)).line + 1}`);
                  const insertAt = node.end - (ts.isJsxSelfClosingElement(node) ? 2 : 1);
                  addEdit(insertAt, insertAt, ` ${label}`);
                }

                for (const attr of attrs) {
                  if (attr.name.text === 'size' && attr.initializer && ts.isStringLiteral(attr.initializer) && attr.initializer.text === 'compact') {
                    addEdit(attr.getStart(sf), attr.end, 'size="small"');
                  }
                  if (attr.name.text !== 'onChange' || !attr.initializer || !ts.isJsxExpression(attr.initializer)) continue;
                  const arrow = attr.initializer.expression;
                  if (!arrow || !ts.isArrowFunction(arrow) || arrow.parameters.length !== 1 || !ts.isIdentifier(arrow.parameters[0].name)) {
                    throw new Error(`Unsupported Select onChange at ${sf.getLineAndCharacterOfPosition(attr.getStart(sf)).line + 1}`);
                  }
                  const param = arrow.parameters[0].name.text;
                  let replacement = arrow.getText(sf);
                  const valuePattern = new RegExp(`\\b${param}\\.target\\s*\\.\\s*value\\b`, 'g');
                  if (!replacement.match(valuePattern)) {
                    throw new Error(`Select onChange does not read ${param}.target.value at ${sf.getLineAndCharacterOfPosition(attr.getStart(sf)).line + 1}`);
                  }
                  valuePattern.lastIndex = 0;
                  replacement = replacement.replace(valuePattern, 'selectValue(value)');
                  replacement = replacement
                    .replace(new RegExp(`^\\(\\s*${param}\\s*\\)\\s*=>`), '(value) =>')
                    .replace(new RegExp(`^${param}\\s*=>`), 'value =>');
                  if (new RegExp(`\\b${param}\\b`).test(replacement)) {
                    throw new Error(`Select onChange still references ${param} after migration at ${sf.getLineAndCharacterOfPosition(attr.getStart(sf)).line + 1}`);
                  }
                  addEdit(arrow.getStart(sf), arrow.end, replacement);
                  changeCount += 1;
                }
              }
            }
            ts.forEachChild(node, visit);
          }
          visit(sf);
          if (selectCount < 10 || changeCount < 10) {
            throw new Error(`Unexpected Select inventory: ${selectCount} controls, ${changeCount} onChange handlers`);
          }
          edits.sort((a, b) => b.start - a.start);
          for (const edit of edits) text = text.slice(0, edit.start) + edit.replacement + text.slice(edit.end);

          if (text.includes('@gouno/ui-legacy')) throw new Error('WorkflowWorkspace still imports legacy UI');
          fs.writeFileSync(sourcePath, text);

          const allowPath = 'scripts/legacy-ui-allowlist.json';
          const allow = JSON.parse(fs.readFileSync(allowPath, 'utf8'));
          const target = 'src/components/agent/WorkflowWorkspace.tsx';
          for (const symbol of ['EditorPanel', 'FormActions', 'FormLayout', 'Select']) {
            const entries = allow.allowedLegacyImports[symbol];
            if (!entries || !entries.includes(target)) throw new Error(`allowlist entry missing: ${symbol}`);
            const next = entries.filter((item) => item !== target);
            if (next.length) allow.allowedLegacyImports[symbol] = next;
            else delete allow.allowedLegacyImports[symbol];
          }
          fs.writeFileSync(allowPath, JSON.stringify(allow, null, 2) + '\n');

          const testPath = 'src/components/agent/__tests__/WorkflowWorkspace.test.tsx';
          let test = fs.readFileSync(testPath, 'utf8');
          const renderAnchor = `function render(ui: React.ReactElement) {\n  return renderWithRouter(<MemoryRouter>{ui}</MemoryRouter>);\n}\n`;
          if (!test.includes(renderAnchor)) throw new Error('test helper anchor not found');
          test = test.replace(renderAnchor, `${renderAnchor}\nasync function chooseOption(\n  user: ReturnType<typeof userEvent.setup>,\n  label: string | RegExp,\n  option: string | RegExp,\n  index = 0,\n) {\n  const controls = screen.getAllByRole("combobox", { name: label });\n  const control = controls[index];\n  if (!control) throw new Error(\`Missing combobox: \${String(label)} #\${index}\`);\n  await user.click(control);\n  await user.click(screen.getByRole("option", { name: option }));\n}\n`);

          const statusBlock = `    const statusSelect = screen.getByRole("combobox", {\n      name: "按状态筛选 Workflow",\n    });\n    await user.selectOptions(statusSelect, "enabled");`;
          if (!test.includes(statusBlock)) throw new Error('status select test block not found');
          test = test.replace(statusBlock, `    await chooseOption(user, "按状态筛选 Workflow", /^已启用/);`);
          test = test.replace('    await user.selectOptions(statusSelect, "disabled");', '    await chooseOption(user, "按状态筛选 Workflow", /^已停用/);');
          test = test.replace('    await user.selectOptions(screen.getByLabelText("状态"), "published");', '    await chooseOption(user, "状态", "published");');
          test = test.replace('    await user.selectOptions(screen.getByLabelText("空结果策略"), "fail");', '    await chooseOption(user, "空结果策略", "失败并提醒管理员");');
          test = test.replace('    expect(screen.getByLabelText("批量绑定 Agent")).toHaveValue("5");', '    expect(\n      screen.getByRole("combobox", { name: "批量绑定 Agent" }),\n    ).toHaveTextContent("Editor");');
          test = test.replace('    expect(screen.getByLabelText("批量绑定 Agent")).toHaveValue("");', '    expect(\n      screen.getByRole("combobox", { name: "批量绑定 Agent" }),\n    ).toHaveTextContent("请选择");');
          test = test.replace('    await user.selectOptions(screen.getByLabelText("单项失败处理"), "continue");', '    await chooseOption(user, "单项失败处理", "继续处理其余资源");');
          const resourceTypeBlock = `    const selects = screen.getAllByLabelText("资源类型");\n    await user.selectOptions(selects[0], "post");`;
          if (!test.includes(resourceTypeBlock)) throw new Error('resource type test block not found');
          test = test.replace(resourceTypeBlock, '    await chooseOption(user, "资源类型", "文章");');
          if (test.includes('selectOptions(')) throw new Error('WorkflowWorkspace tests still use native selectOptions');
          fs.writeFileSync(testPath, test);
          NODE
      - name: Format and focused gates
        working-directory: blog-frontend
        run: |
          npx prettier --write src/components/agent/WorkflowWorkspace.tsx src/components/agent/__tests__/WorkflowWorkspace.test.tsx scripts/legacy-ui-allowlist.json
          npm run lint:ui
          npx tsc -b
          npx vitest run src/components/agent/__tests__/WorkflowWorkspace.test.tsx
      - name: Verify zero WorkflowWorkspace legacy debt
        working-directory: blog-frontend
        run: |
          ! grep -q '@gouno/ui-legacy' src/components/agent/WorkflowWorkspace.tsx
          node -e 'const a=require("./scripts/legacy-ui-allowlist.json").allowedLegacyImports; for (const [s,fs] of Object.entries(a)) if (fs.includes("src/components/agent/WorkflowWorkspace.tsx")) throw new Error(`legacy allowlist remains: ${s}`)'
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/components/agent/WorkflowWorkspace.tsx blog-frontend/src/components/agent/__tests__/WorkflowWorkspace.test.tsx blog-frontend/scripts/legacy-ui-allowlist.json
          git diff --cached --quiet && exit 0
          git commit -m "refactor(ui): finish workflow workspace canonical migration"
          git push origin HEAD:ui/workflow-workspace-canonical-phase37b2

name: Canonical agent form controls once

on:
  push:
    branches:
      - ui/canonical-form-controls-20260913
    paths:
      - .github/workflows/canonical-form-controls-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/canonical-form-controls-20260913
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Migrate controls and harden contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const files = [
            'blog-frontend/src/components/agent/tools/RssFetchConfig.tsx',
            'blog-frontend/src/components/agent/tools/StalePostsConfig.tsx',
            'blog-frontend/src/components/agent/tools/LowEngagementConfig.tsx',
            'blog-frontend/src/components/agent/tools/KnowledgeSearchConfig.tsx',
            'blog-frontend/src/components/agent/WorkflowMediaCandidates.tsx',
            'blog-frontend/src/components/agent/WorkflowWorkspace.tsx',
          ];

          for (const path of files) {
            let source = fs.readFileSync(path, 'utf8');
            source = source.replace(/<input\b/g, '<Input');
            source = source.replace(/className="input-field mono"/g, 'className="mono"');
            source = source.replace(/^\s*className="input-field"\s*\n/gm, '');
            fs.writeFileSync(path, source);
          }

          const bindingsPath = 'blog-frontend/src/components/agent/tools/ToolBindingsEditor.tsx';
          let bindings = fs.readFileSync(bindingsPath, 'utf8');
          const legacyErrorClass = 'className={`mono ${jsonError ? "input-field--error" : ""}`}';
          if (!bindings.includes(legacyErrorClass)) throw new Error('ToolBindingsEditor legacy error class not found');
          bindings = bindings.replace(
            legacyErrorClass,
            'className="mono"\n              status={jsonError ? "error" : undefined}',
          );
          fs.writeFileSync(bindingsPath, bindings);

          const guardPath = 'blog-frontend/scripts/check-ui-contracts.mjs';
          let guard = fs.readFileSync(guardPath, 'utf8');
          const marker = '  const sourceFile = ts.createSourceFile(\n    name,\n    source,\n    ts.ScriptTarget.Latest,\n    true,\n    ts.ScriptKind.TSX,\n  );\n\n  function visit(node) {';
          const replacement = '  const sourceFile = ts.createSourceFile(\n    name,\n    source,\n    ts.ScriptTarget.Latest,\n    true,\n    ts.ScriptKind.TSX,\n  );\n  const connectorHold = name === "components/agent/ConnectorWorkspace.tsx";\n\n  function visit(node) {';
          const seen = guard.split(marker).length - 1;
          if (seen !== 1) throw new Error(`check-ui-contracts TSX marker count ${seen}`);
          guard = guard.replace(marker, replacement);
          const selectGuard = '      if (tag === "select") {\n        failures.push(\n          `${name}:${location(sourceFile, node)} native select must use the shared Select component`,\n        );\n      }';
          const nativeGuard = selectGuard + '\n      if (!connectorHold && name.startsWith("components/agent/") && tag === "input") {\n        failures.push(\n          `${name}:${location(sourceFile, node)} native input must use the shared Input component`,\n        );\n      }\n      if (!connectorHold && name.startsWith("components/agent/") && tag === "textarea") {\n        failures.push(\n          `${name}:${location(sourceFile, node)} native textarea must use the shared Textarea component`,\n        );\n      }';
          const guardSeen = guard.split(selectGuard).length - 1;
          if (guardSeen !== 1) throw new Error(`select guard count ${guardSeen}`);
          guard = guard.replace(selectGuard, nativeGuard);
          const staticClassMarker = '        if (/(^|\\s)badge(?:\\s|$)/.test(value)) {\n          failures.push(\n            `${name}:${location(sourceFile, attribute)} shared badge classes must use Badge`,\n          );\n        }';
          const staticClassReplacement = staticClassMarker + '\n        if (/\\binput-field(?:--[a-z0-9-]+)?\\b/.test(value)) {\n          failures.push(\n            `${name}:${location(sourceFile, attribute)} retired input-field classes must not be reintroduced; use canonical Input/Textarea props`,\n          );\n        }';
          const classSeen = guard.split(staticClassMarker).length - 1;
          if (classSeen !== 1) throw new Error(`static class marker count ${classSeen}`);
          guard = guard.replace(staticClassMarker, staticClassReplacement);
          fs.writeFileSync(guardPath, guard);
          NODE
      - name: Format frontend sources
        working-directory: blog-frontend
        run: npm run format
      - name: Verify frontend quality
        working-directory: blog-frontend
        run: npm run quality
      - name: Commit canonical form controls
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/components/agent blog-frontend/scripts/check-ui-contracts.mjs
          git commit -m "refactor(ui): migrate agent forms to canonical controls"
          git push origin HEAD:ui/canonical-form-controls-20260913

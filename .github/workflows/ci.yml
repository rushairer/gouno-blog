name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-backend

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 15) { printf "backend coverage %.1f%% is below the 15%% floor\n", coverage; exit 1 } }'

      - name: Enforce security package coverage ratchet
        run: |
          check_package_coverage() {
            package="$1"
            floor="$2"
            target="$3"
            output=$(go test -cover "$package")
            printf '%s\n' "$output"
            coverage=$(printf '%s\n' "$output" | sed -n 's/.*coverage: \([0-9][0-9.]*\)% of statements.*/\1/p' | tail -1)
            if [ -z "$coverage" ]; then
              echo "could not determine coverage for $package" >&2
              exit 1
            fi
            awk -v package="$package" -v coverage="$coverage" -v floor="$floor" -v target="$target" 'BEGIN {
              if (coverage + 0 < floor + 0) {
                printf "%s coverage %.1f%% is below the %.1f%% ratchet floor (A+ target %.1f%%)\n", package, coverage, floor, target
                exit 1
              }
              printf "%s coverage %.1f%% >= %.1f%% ratchet floor; A+ target %.1f%%\n", package, coverage, floor, target
            }'
          }

          # Ratchet floors reflect current measured coverage and may only move
          # upward. They will be raised to the A+ targets as focused tests land.
          check_package_coverage ./internal/secretbox 85 85
          check_package_coverage ./internal/provider 60 75
          check_package_coverage ./internal/authbff 50 80

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  database-integration:
    name: Isolated database integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Verify false-green detection
        run: python3 -m unittest discover -s scripts -p 'test_check_db_integration.py'

      - name: Migrate and run required integration tests with race detection
        run: python3 scripts/check-db-integration.py --output "$RUNNER_TEMP/blog-db-integration"

      - name: Retain integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-integration
          path: |
            ${{ runner.temp }}/blog-db-integration/*.json
            ${{ runner.temp }}/blog-db-integration/*.jsonl
            ${{ runner.temp }}/blog-db-integration/*.stderr
            ${{ runner.temp }}/blog-db-integration/*.cover
          if-no-files-found: warn
          retention-days: 7

  seed:
    name: Seed quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: seed/go.mod
          cache-dependency-path: seed/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify shared GOSSO client registry release
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('./package.json', 'utf8'));
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          const client = lock.packages['node_modules/@gosso/client'];
          const source = manifest.dependencies?.['@gosso/client'];
          const exactVersion = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          const registryTarball = /^https:\/\/registry\.npmjs\.org\/@gosso\/client\/-\/client-[0-9A-Za-z.-]+\.tgz$/;
          if (!exactVersion.test(source || '') || !client || client.version !== source ||
              !registryTarball.test(client.resolved || '') || !client.integrity) {
            throw new Error('blog-frontend must use an exact @gosso/client registry version with lockfile integrity');
          }
          EOF

      - name: Format, lint, UI/CSS contracts, typecheck, coverage and build
        run: npm run quality

  compose:
    name: Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Docker Compose config validation
        run: docker compose config

      - name: Enforce development application image channel
        run: |
          docker compose config | awk '
            /image: ghcr.io\/rushairer\/(gosso|gosso-admin-seed|gosso-admin-frontend|gouno-blog-seed|gouno-blog-backend|gouno-blog-frontend):/ && $2 !~ /:main$/ {
              print "development application image must follow :main: " $2
              invalid = 1
            }
            END { exit invalid }
          '

      - name: Source override Compose config validation
        run: docker compose -f docker-compose.yml -f docker-compose.source.yml config

      - name: Production Compose config validation
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config

      - name: Authentication deployment contract
        run: node scripts/check-auth-deployment-contract.mjs

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

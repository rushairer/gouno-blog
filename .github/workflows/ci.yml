name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-backend

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 15) { printf "backend coverage %.1f%% is below the 15%% floor\n", coverage; exit 1 } }'

      - name: Vet
        run: go vet ./...

      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  seed:
    name: Seed quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: seed/go.mod
          cache-dependency-path: seed/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify shared GOSSO client registry release
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('./package.json', 'utf8'));
          const lock = JSON.parse(await readFile('./package-lock.json', 'utf8'));
          const client = lock.packages['node_modules/@gosso/client'];
          const source = manifest.dependencies?.['@gosso/client'];
          const exactVersion = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          const registryTarball = /^https:\/\/registry\.npmjs\.org\/@gosso\/client\/-\/client-[0-9A-Za-z.-]+\.tgz$/;
          if (!exactVersion.test(source || '') || !client || client.version !== source ||
              !registryTarball.test(client.resolved || '') || !client.integrity) {
            throw new Error('blog-frontend must use an exact @gosso/client registry version with lockfile integrity');
          }
          EOF

      - name: UI contract checks
        run: npm run lint:ui

      - name: Format, lint, typecheck, coverage and build
        run: npm run check && npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Docker Compose config validation
        run: docker compose config

      - name: Enforce immutable default images
        run: |
          docker compose config | awk '
            /image:/ && $2 !~ /^ghcr\.io\/rushairer\// && $2 !~ /@sha256:[a-f0-9]{64}$/ {
              print "image is not pinned by digest: " $2
              invalid = 1
            }
            END { exit invalid }
          '

      - name: Source override Compose config validation
        run: docker compose -f docker-compose.yml -f docker-compose.source.yml config

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2

name: Blog Showcase Parity

on:
  pull_request:
    paths:
      - "blog-frontend/**"
      - ".github/workflows/showcase-parity.yml"
  push:
    branches: [main]
    paths:
      - "blog-frontend/**"
      - ".github/workflows/showcase-parity.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-showcase-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Blog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout current Gouno UI main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rushairer/gouno-ui
          ref: main
          path: upstream-gouno-ui

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            blog-frontend/package-lock.json
            upstream-gouno-ui/package-lock.json

      - name: Install Blog dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Install Showcase dependencies
        working-directory: upstream-gouno-ui
        run: npm ci

      - name: Install isolated Playwright runtime
        working-directory: blog-frontend
        run: |
          PLAYWRIGHT_VERSION=1.55.0
          npm install --no-save --ignore-scripts @playwright/test@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium

      - name: Compare canonical rendered styles
        working-directory: blog-frontend
        run: npx playwright test --config=e2e/showcase-parity.config.mjs

      - name: Upload paired parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-showcase-parity-${{ github.run_id }}
          path: |
            blog-frontend/playwright-report-showcase-parity
            blog-frontend/test-results/showcase-parity
          if-no-files-found: ignore
          retention-days: 14

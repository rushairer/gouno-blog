name: AI legacy class cleanup once

on:
  push:
    branches:
      - ui/ai-legacy-class-cleanup-20260913

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconcile legacy product classes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }

          function write(path, source) {
            fs.writeFileSync(path, source);
          }

          function replaceRequired(path, before, after) {
            const source = read(path);
            if (!source.includes(before)) {
              throw new Error(`${path}: missing required anchor: ${before.slice(0, 80)}`);
            }
            write(path, source.replace(before, after));
          }

          function replaceAllRequired(path, before, after) {
            const source = read(path);
            const count = source.split(before).length - 1;
            if (count < 1) {
              throw new Error(`${path}: missing required repeated anchor: ${before}`);
            }
            write(path, source.split(before).join(after));
          }

          const root = 'blog-frontend/src';
          const monoFiles = [
            'components/agent/EmbeddingForm.tsx',
            'components/agent/ProposalPreview.tsx',
            'components/agent/ProviderForm.tsx',
            'components/agent/SkillForm.tsx',
            'components/agent/AgentForm.tsx',
            'pages/admin/PageEditor.tsx',
            'pages/admin/PostEditor.tsx',
            'components/agent/tools/RssFetchConfig.tsx',
            'components/agent/WorkflowWorkspace.tsx',
            'components/agent/WorkflowInputForm.tsx',
            'components/agent/tools/ToolBindingsEditor.tsx',
          ];

          for (const relativePath of monoFiles) {
            replaceAllRequired(`${root}/${relativePath}`, 'className="mono"', 'className="font-mono"');
          }

          replaceRequired(
            `${root}/components/editor/AiSuggestionControl.tsx`,
            'className={mono ? "mono" : undefined}',
            'className={mono ? "font-mono" : undefined}',
          );

          for (const relativePath of [
            'components/agent/AgentForm.tsx',
            'components/agent/ProviderForm.tsx',
            'components/agent/EmbeddingForm.tsx',
            'components/agent/SkillForm.tsx',
          ]) {
            replaceRequired(
              `${root}/${relativePath}`,
              '<Card padding="base" className="editor-panel">',
              '<Card padding="base">',
            );
          }

          replaceRequired(
            `${root}/components/agent/WorkflowWorkspace.tsx`,
            'className={["editor-panel", "p-4 md:p-6", className]',
            'className={["p-4 md:p-6", className]',
          );

          for (const relativePath of [
            'components/agent/AgentForm.tsx',
            'components/agent/ProviderForm.tsx',
            'components/agent/EmbeddingForm.tsx',
          ]) {
            replaceRequired(
              `${root}/${relativePath}`,
              '<label className="checkbox-label">',
              '<label className="inline-flex items-center gap-2 text-sm">',
            );
          }

          const agentFormPath = `${root}/components/agent/AgentForm.tsx`;
          replaceRequired(agentFormPath, '<div className="agent-limit-grid">', '<FormGrid columns={2}>');
          replaceRequired(
            agentFormPath,
            '        </div>\n\n        <label className="inline-flex items-center gap-2 text-sm">',
            '        </FormGrid>\n\n        <label className="inline-flex items-center gap-2 text-sm">',
          );

          const cssPath = `${root}/styles/agent-console.css`;
          let css = read(cssPath);
          const limitGrid = /\n  \.agent-limit-grid \{[\s\S]*?\n  \}\n\n  \.agent-capabilities \{/;
          if (!limitGrid.test(css)) throw new Error('agent-console.css: agent-limit-grid block not found');
          css = css.replace(limitGrid, '\n  .agent-capabilities {');
          write(cssPath, css);

          const contractPath = 'blog-frontend/scripts/check-ui-contracts.mjs';
          const contract = read(contractPath);
          const contractAnchor = `        const value = staticClassName(attribute);\n        if (/(^|\\s)btn(?:\\s|$)/.test(value)) {`;
          const contractReplacement = `        const value = staticClassName(attribute);\n        if (/(^|\\s)editor-panel(?:\\s|$)/.test(value)) {\n          failures.push(\n            \`${'${name}'}:${'${location(sourceFile, attribute)}'} retired editor-panel compatibility class must not be reintroduced; Card owns the container surface\`,\n          );\n        }\n        if (!connectorHold && /(^|\\s)mono(?:\\s|$)/.test(value)) {\n          failures.push(\n            \`${'${name}'}:${'${location(sourceFile, attribute)}'} retired mono compatibility class must not be reintroduced; use Tailwind font-mono\`,\n          );\n        }\n        if (!connectorHold && /(^|\\s)checkbox-label(?:\\s|$)/.test(value)) {\n          failures.push(\n            \`${'${name}'}:${'${location(sourceFile, attribute)}'} retired checkbox-label compatibility class must not be reintroduced; compose the canonical Checkbox with explicit layout utilities\`,\n          );\n        }\n        if (/(^|\\s)btn(?:\\s|$)/.test(value)) {`;
          if (!contract.includes(contractAnchor)) throw new Error('check-ui-contracts.mjs: class contract anchor not found');
          write(contractPath, contract.replace(contractAnchor, contractReplacement));
          NODE

      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src blog-frontend/scripts/check-ui-contracts.mjs
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(ui): remove retired product compatibility classes"
          git push

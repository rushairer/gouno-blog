name: Page domain alias retirement repair

on:
  push:
    branches:
      - refactor/page-domain-alias-retirement

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Apply corrected Page alias retirement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow_path = Path('.github/workflows/page-domain-alias-retirement-staging.yml')
          workflow = workflow_path.read_text()
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          assert marker in workflow and end_marker in workflow
          source = dedent(workflow.split(marker, 1)[1].split(end_marker, 1)[0])
          source = source.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 1)

          replacements = {
              "assert 'domain.PageStatus' not in text": "assert not re.search(r'\\bdomain\\.PageStatus', text)",
              "assert 'domain.Page{' not in text": "assert not re.search(r'\\bdomain\\.Page\\{', text)",
              "assert 'domain.AdminPageFilter' not in text": "assert not re.search(r'\\bdomain\\.AdminPageFilter', text)",
              "assert '[]*domain.Page' not in text": "assert not re.search(r'\\[\\]\\*domain\\.Page\\b', text)",
          }
          for old, new in replacements.items():
              assert old in source, old
              source = source.replace(old, new)

          exec(compile(source, '<page-domain-alias-retirement>', 'exec'), {})
          PY

      - name: Format
        working-directory: blog-backend
        run: gofmt -w internal/access/policy.go internal/access/policy_test.go internal/agent/approval.go internal/tool/blog_tools.go internal/tool/content_audit.go internal/page/domain/ownership_test.go

      - name: Focused tests
        working-directory: blog-backend
        run: go test ./internal/page/... ./internal/access ./internal/agent ./internal/tool

      - name: Focused vet
        working-directory: blog-backend
        run: go vet ./internal/page/... ./internal/access ./internal/agent ./internal/tool

      - name: Page ownership guards
        working-directory: blog-backend
        run: |
          test ! -e internal/domain/page.go
          go test ./internal/page/domain -run TestRootPageCompatibilityAliasesStayRetired -count=1

      - name: Security and hold diff guards
        run: |
          git diff --exit-code c03913ef41f24ed08613f4a267ea5d0b501bab85 -- \
            blog-backend/internal/controller/access_controller.go \
            blog-backend/internal/authbff \
            blog-backend/internal/connector

      - name: Commit validated source and self-clean
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm .github/workflows/page-domain-alias-retirement-staging.yml .github/workflows/page-domain-alias-retirement-repair.yml
          git add AGENTS.md blog-backend
          git commit -m "refactor(page): retire root domain aliases"
          git push origin HEAD:refactor/page-domain-alias-retirement

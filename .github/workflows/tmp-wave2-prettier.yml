name: Temporary Wave 2 Prettier

on:
  push:
    branches:
      - fix/blog-admin-core-manual-recertification-wave2-v3-20260920

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message == 'chore(format): request Wave 2 formatting' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wave 2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Format Wave 2 product pages
        working-directory: blog-frontend
        run: npx prettier --write src/pages/admin/Categories.tsx src/pages/admin/Tags.tsx src/pages/admin/Comments.tsx

      - name: Commit Wave 2 formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/admin/Categories.tsx blog-frontend/src/pages/admin/Tags.tsx blog-frontend/src/pages/admin/Comments.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style(ui): format Wave 2 parity changes"
          git push origin HEAD:fix/blog-admin-core-manual-recertification-wave2-v3-20260920

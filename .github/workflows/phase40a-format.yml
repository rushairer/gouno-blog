name: Phase 40A format connector

on:
  push:
    branches:
      - ui/connector-canonical-phase40

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/connector-canonical-phase40
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - working-directory: blog-frontend
        run: npm ci
      - working-directory: blog-frontend
        run: npx prettier --write src/components/agent/ConnectorWorkspace.tsx src/components/agent/__tests__/ConnectorWorkspace.test.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/components/agent/ConnectorWorkspace.tsx blog-frontend/src/components/agent/__tests__/ConnectorWorkspace.test.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style(ui): format connector canonical migration"
          git push origin HEAD:ui/connector-canonical-phase40

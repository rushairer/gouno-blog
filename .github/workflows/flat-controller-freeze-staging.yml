name: Flat controller freeze staging

on:
  push:
    branches:
      - refactor/flat-controller-freeze

permissions:
  contents: write

jobs:
  converge-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Rehome ownership tests and freeze flat controller bucket
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path.cwd()
          backend = root / 'blog-backend'
          flat = backend / 'internal' / 'controller'

          # This test exercises workflowplan only; keep it with that owner.
          draft_old = flat / 'workflow_draft_test.go'
          draft = draft_old.read_text()
          assert draft.startswith('package controller\n')
          draft = draft.replace('package controller\n', 'package workflowplan_test\n', 1)
          (backend / 'internal' / 'workflowplan' / 'draft_json_test.go').write_text(draft)
          draft_old.unlink()

          # These ownership assertions describe Agent's controller boundary. Fold them
          # into Agent's existing ownership suite instead of keeping a flat test owner.
          workflow_old = flat / 'workflow_ownership_test.go'
          workflow_guard = workflow_old.read_text()
          marker = 'func TestFlatAgentControllerDoesNotOwnWorkflowHTTP'
          assert marker in workflow_guard
          functions = workflow_guard[workflow_guard.index(marker):]
          functions = functions.replace('TestFlatAgentControllerDoesNotOwnWorkflowHTTP', 'TestAgentControllerDoesNotOwnWorkflowHTTP', 1)
          functions = functions.replace('TestFlatAgentControllerUsesNarrowWorkflowPort', 'TestAgentControllerUsesNarrowWorkflowPort', 1)
          functions = functions.replace('../agent/controller/generation.go', 'generation.go')
          functions = functions.replace('../agent/controller/controller.go', 'controller.go')
          agent_ownership_path = backend / 'internal' / 'agent' / 'controller' / 'ownership_test.go'
          agent_ownership = agent_ownership_path.read_text()
          assert 'TestAgentControllerDoesNotOwnWorkflowHTTP' not in agent_ownership
          agent_ownership_path.write_text(agent_ownership.rstrip() + '\n\n' + functions)
          workflow_old.unlink()

          # Freeze the remaining flat controller bucket. These entries are classified,
          # not a general-purpose home for future business transport.
          (backend / 'internal' / 'controllerutil' / 'flat_controller_boundary_test.go').write_text(dedent(r'''package controllerutil_test

          import (
          	"os"
          	"sort"
          	"testing"
          )

          func TestLegacyFlatControllerBucketIsFrozen(t *testing.T) {
          	allowed := map[string]string{
          		"access_controller.go":         "stable Access security boundary",
          		"agent_controller.go":          "Connector-held transitional shell",
          		"agent_connector_controller.go": "Connector-held transport",
          		"pagination.go":                "compatibility facade for held flat transport",
          		"pagination_test.go":           "compatibility facade regression test",
          		"response.go":                  "compatibility facade for held flat transport",
          	}

          	entries, err := os.ReadDir("../controller")
          	if err != nil {
          		t.Fatal(err)
          	}
          	unexpected := make([]string, 0)
          	seen := make(map[string]bool, len(entries))
          	for _, entry := range entries {
          		name := entry.Name()
          		seen[name] = true
          		if _, ok := allowed[name]; !ok {
          			unexpected = append(unexpected, name)
          		}
          	}
          	sort.Strings(unexpected)
          	if len(unexpected) != 0 {
          		t.Fatalf("legacy internal/controller bucket gained unclassified entries: %v", unexpected)
          	}
          	for name, classification := range allowed {
          		if !seen[name] {
          			t.Errorf("classified flat controller entry %s (%s) disappeared without updating the ownership map", name, classification)
          		}
          	}
          }
          '''))

          architecture_path = backend / 'ARCHITECTURE.md'
          architecture = architecture_path.read_text()
          old_arch = 'The legacy `internal/controller` package may temporarily expose compatibility facades while other controllers are moved out of the flat bucket. Those facades are migration scaffolding, not a destination for new business controllers.'
          new_arch = 'The legacy `internal/controller` package is now frozen to the stable Access security boundary, the Connector-held transitional shell/transport, and the small response/pagination compatibility facades still required by those held paths. `internal/controllerutil/flat_controller_boundary_test.go` enforces this allowlist. No new business controller or unrelated ownership test may be added to the flat bucket; new transport belongs to its capability-local controller package.'
          assert old_arch in architecture
          architecture_path.write_text(architecture.replace(old_arch, new_arch, 1))

          agents_path = root / 'AGENTS.md'
          agents = agents_path.read_text()
          old_agents = '- `blog-backend/internal/service` has been retired. `internal/domain` remains a deliberate shared-model migration boundary, while `internal/repository` and `internal/controller` are transitional flat-layer migration buckets. Do not add new business ownership to them when a capability-local home exists or can be introduced coherently.'
          new_agents = '- `blog-backend/internal/service` has been retired. `internal/domain` remains a deliberate shared-model migration boundary. `internal/repository` is retained only for the Connector-held transaction alias, while `internal/controller` is frozen to the stable Access security boundary, Connector-held transport/shell, and explicitly allowlisted compatibility helpers. `internal/controllerutil/flat_controller_boundary_test.go` rejects unclassified additions. Do not add new business ownership to either flat package.'
          assert old_agents in agents
          agents = agents.replace(old_agents, new_agents, 1)
          old_agents_http = '- Shared HTTP/controller primitives belong in `blog-backend/internal/controllerutil`; capability controllers may depend on this package. The legacy `internal/controller` package may expose compatibility facades during migration but is not the destination for new business controllers.'
          new_agents_http = '- Shared HTTP/controller primitives belong in `blog-backend/internal/controllerutil`; capability controllers may depend on this package. The legacy `internal/controller` allowlist is a frozen compatibility/security boundary, not a destination for new business controllers or ownership tests.'
          assert old_agents_http in agents
          agents_path.write_text(agents.replace(old_agents_http, new_agents_http, 1))

          convergence_path = backend / 'ARCHITECTURE_CONVERGENCE.md'
          convergence = convergence_path.read_text()
          shell_row = '| `internal/controller.AgentController` Connector-only transitional shell | Explicit Connector Hold | Connector routes/callback only; Agent, Workflow, Operations and Knowledge transport are capability-local | Retain unchanged until explicit Connector Hold lift; then move Connector transport with dedicated security review/tests. |'
          helper_row = '| `internal/controller` response/pagination compatibility helpers | Frozen compatibility facade | Stable Access controller plus Connector-held flat transport | Retire only in a dedicated Access/Connector boundary slice after the relevant security/Hold constraints are explicitly lifted; no new consumers are allowed. |'
          assert shell_row in convergence
          convergence = convergence.replace(shell_row, shell_row + '\n' + helper_row, 1)

          old_flat = '- **A — migrate to capability / retire facade:** Agent, Workflow, Operations, Knowledge and Feed HTTP ownership are canonical under capability controllers; flat Agent repository delegates are retired. Remaining non-held facades require consumer proof before deletion.'
          new_flat = '- **A — migrate to capability / retire facade:** Agent, Workflow, Operations, Knowledge and Feed HTTP ownership are canonical under capability controllers; flat Agent repository delegates are retired. The remaining `internal/controller` entries are explicitly classified and allowlist-frozen; there is no unclassified non-held business controller left in that bucket.'
          assert old_flat in convergence
          convergence = convergence.replace(old_flat, new_flat, 1)

          old_priority = '1. **Transitional layer retirement:** retire remaining non-held compatibility facades only after consumer proof and full gates; Connector controller/transactor compatibility remains explicitly blocked by Connector Module Hold.\n2. **Shared-model classification:** classify remaining root `internal/domain` models only where a real capability/shared-kernel decision is needed; never move them for directory symmetry.'
          new_priority = '1. **Held-boundary retirement:** non-held flat-controller ownership is converged and frozen. Connector controller/transactor compatibility remains explicitly blocked by Connector Module Hold; Access remains a stable security boundary rather than migration debt.\n2. **Shared-model classification:** classify remaining root `internal/domain` models only where a real capability/shared-kernel decision is needed; never move them for directory symmetry.'
          assert old_priority in convergence
          convergence = convergence.replace(old_priority, new_priority, 1)

          completed = 'and **Feed HTTP ownership convergence** now use canonical ownership boundaries'
          assert completed in convergence
          convergence = convergence.replace(completed, 'and **Feed HTTP ownership convergence**, and **flat-controller boundary freeze** now use canonical ownership boundaries', 1)

          anchor = '### Feed HTTP ownership convergence — 2026-09-14\n'
          assert anchor in convergence
          section = dedent('''\
          ### Flat-controller boundary freeze — 2026-09-14

          - The remaining `internal/controller` bucket is allowlist-frozen to the stable Access security boundary, Connector-held transport/shell, and response/pagination compatibility helpers required by those held paths.
          - Workflow draft parsing tests now live with `internal/workflowplan`; Agent/Workflow HTTP ownership assertions now live with `internal/agent/controller`. Tests no longer create false ownership for the flat package.
          - `internal/controllerutil/flat_controller_boundary_test.go` fails if an unclassified file is added to the flat controller bucket or a classified held entry disappears without updating the ownership map.
          - This does not authorize Access or Connector migration. Connector Module Hold, BFF/session rules and Access security behavior remain unchanged.


          ''')
          convergence_path.write_text(convergence.replace(anchor, section + anchor, 1))
          PY

      - name: Format
        working-directory: blog-backend
        run: gofmt -w internal/workflowplan/draft_json_test.go internal/agent/controller/ownership_test.go internal/controllerutil/flat_controller_boundary_test.go

      - name: Focused tests
        working-directory: blog-backend
        run: go test ./internal/workflowplan ./internal/agent/controller ./internal/controllerutil ./internal/controller

      - name: Focused vet
        working-directory: blog-backend
        run: go vet ./internal/workflowplan ./internal/agent/controller ./internal/controllerutil ./internal/controller

      - name: Boundary and hold guards
        run: |
          test ! -e blog-backend/internal/controller/workflow_draft_test.go
          test ! -e blog-backend/internal/controller/workflow_ownership_test.go
          test -e blog-backend/internal/workflowplan/draft_json_test.go
          test -e blog-backend/internal/controllerutil/flat_controller_boundary_test.go
          git diff --exit-code c0d2b2474e6dd792f780e986b712504245016cf2 -- \
            blog-backend/internal/controller/access_controller.go \
            blog-backend/internal/controller/agent_controller.go \
            blog-backend/internal/controller/agent_connector_controller.go \
            blog-backend/internal/controller/pagination.go \
            blog-backend/internal/controller/pagination_test.go \
            blog-backend/internal/controller/response.go

      - name: Commit validated source and self-clean
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm .github/workflows/flat-controller-freeze-staging.yml
          git add AGENTS.md blog-backend
          git commit -m "test(architecture): freeze flat controller boundary"
          git push origin HEAD:refactor/flat-controller-freeze

name: Temporary Select Test Migration

on:
  push:
    branches:
      - chore/restore-frontend-formatting

permissions:
  contents: write

jobs:
  migrate-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chore/restore-frontend-formatting
      - name: Migrate native select test interactions
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "blog-frontend/src/components/agent/__tests__/AgentForm.test.tsx": [
                  (
                      "    // Dropdown contains both the legacy bound version and the latest version\n    expect(\n      screen.getByRole(\"option\", {\n        name: /AI 每日资讯 · v2 \\\\(当前绑定 · 旧版本\\\\)/,\n      }),\n    ).toBeInTheDocument();\n",
                      "    // Open the canonical Select before asserting its listbox options.\n    fireEvent.click(screen.getAllByRole(\"combobox\")[1]);\n    expect(\n      screen.getByRole(\"option\", {\n        name: /AI 每日资讯 · v2 \\\\(当前绑定 · 旧版本\\\\)/,\n      }),\n    ).toBeInTheDocument();\n",
                  ),
              ],
              "blog-frontend/src/components/agent/__tests__/WorkflowInputForm.test.tsx": [
                  (
                      "import { render, screen, waitFor } from \"@testing-library/react\";\n",
                      "import { render, screen, waitFor, within } from \"@testing-library/react\";\n",
                  ),
                  (
                      "    await user.selectOptions(screen.getByLabelText(/输出格式/), \"faq\");\n",
                      "    await user.click(screen.getByRole(\"combobox\"));\n    await user.click(screen.getByRole(\"option\", { name: \"faq\" }));\n",
                  ),
                  (
                      "    await user.selectOptions(screen.getByLabelText(\"状态\"), \"published\");\n",
                      "    const statusFilter = screen.getByText(\"状态\").closest(\"label\");\n    expect(statusFilter).not.toBeNull();\n    await user.click(within(statusFilter as HTMLElement).getByRole(\"combobox\"));\n    await user.click(screen.getByRole(\"option\", { name: \"published\" }));\n",
                  ),
                  (
                      "    await user.selectOptions(screen.getByLabelText(\"Alt 文本\"), \"true\");\n",
                      "    const altFilter = screen.getByText(\"Alt 文本\").closest(\"label\");\n    expect(altFilter).not.toBeNull();\n    await user.click(within(altFilter as HTMLElement).getByRole(\"combobox\"));\n    await user.click(screen.getByRole(\"option\", { name: \"仅缺失 Alt\" }));\n",
                  ),
              ],
              "blog-frontend/src/components/agent/__tests__/WorkflowRunRecords.test.tsx": [
                  (
                      "    await user.selectOptions(screen.getByRole(\"combobox\"), \"inline\");\n",
                      "    await user.click(screen.getByRole(\"combobox\"));\n    await user.click(screen.getByRole(\"option\", { name: \"正文插图\" }));\n",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f\"expected snippet not found in {filename}: {old[:80]!r}\")
                  text = text.replace(old, new, 1)
              path.write_text(text)
      - name: Commit test migration
        run: |
          if git diff --quiet -- blog-frontend/src/components/agent/__tests__; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/components/agent/__tests__
          git commit -m "test(frontend): align Select interactions with canonical UI"
          git push origin HEAD:chore/restore-frontend-formatting

name: Taxonomy domain ownership staging

on:
  push:
    branches:
      - refactor/taxonomy-domain-models

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Apply Taxonomy domain migration
        run: python3 .github/scripts/taxonomy_domain_models.py

      - name: Format
        run: |
          gofmt -w blog-backend/internal/domain/post.go
          gofmt -w blog-backend/internal/taxonomy/domain
          gofmt -w blog-backend/internal/taxonomy/repository
          gofmt -w blog-backend/internal/taxonomy/service

      - name: Focused tests
        working-directory: blog-backend
        run: go test ./internal/taxonomy/...

      - name: Focused vet
        working-directory: blog-backend
        run: go vet ./internal/taxonomy/...

      - name: Ownership and diff guards
        run: |
          test -e blog-backend/internal/taxonomy/domain/model.go
          test -e blog-backend/internal/taxonomy/domain/ownership_test.go
          (
            cd blog-backend
            go test ./internal/taxonomy/domain -run TestRootTaxonomyModelsStayRetired -count=1
          )
          if git grep -nE '(^|[^[:alnum:]_])domain\.(Category|TagSummary)' -- 'blog-backend/**/*.go'; then
            echo 'Taxonomy-owned symbol still consumed through root internal/domain'
            exit 1
          fi
          git diff --exit-code 6e59dcbce9cac6b3ccc9b393f1b64e22ee22b888 -- \
            blog-backend/internal/access \
            blog-backend/internal/authbff \
            blog-backend/internal/connector \
            blog-backend/internal/controller \
            blog-backend/middleware \
            blog-backend/internal/agent \
            blog-backend/internal/workflow
          git diff --check

      - name: Commit validated source and self-clean
        run: |
          rm -f .github/scripts/taxonomy_domain_models.py
          rm -f .github/workflows/taxonomy-domain-models-staging.yml
          git config user.name 'Aben'
          git config user.email '5195693+rushairer@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(taxonomy): own capability domain models'
          git push origin HEAD:refactor/taxonomy-domain-models

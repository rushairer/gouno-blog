name: Temporary Workflow Locale Assertion Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-fix-workflow-locale-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Replace library-default placeholder assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("blog-frontend/src/components/agent/__tests__/WorkflowWorkspace.test.tsx")
          source = path.read_text()
          old = '''    expect(\n      screen.getByRole("combobox", { name: "批量绑定 Agent" }),\n    ).toHaveTextContent("请选择");\n'''
          new = '''    const bulkAgentBinding = screen.getByRole("combobox", {\n      name: "批量绑定 Agent",\n    });\n    expect(bulkAgentBinding).not.toHaveTextContent("Writer Agent");\n    expect(bulkAgentBinding).not.toHaveTextContent("Image Agent");\n'''
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one placeholder assertion, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Verify targeted workflow regression
        working-directory: blog-frontend
        run: |
          npm ci
          npx vitest run src/components/agent/__tests__/WorkflowWorkspace.test.tsx
      - name: Commit semantic assertion
        shell: bash
        run: |
          git add blog-frontend/src/components/agent/__tests__/WorkflowWorkspace.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ui): decouple workflow binding from select locale default"
          git push origin HEAD:main

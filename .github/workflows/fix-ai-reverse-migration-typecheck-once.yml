name: Fix AI reverse migration typecheck once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ai-reverse-migration-typecheck-once.yml

permissions:
  contents: write

jobs:
  fix-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Apply targeted TypeScript fixes
        working-directory: blog-frontend
        run: |
          set -euo pipefail
          npm ci
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          async function edit(path, mutate) {
            const before = await readFile(path, 'utf8');
            const after = mutate(before);
            if (after === before) throw new Error(`No change applied to ${path}`);
            await writeFile(path, after);
          }

          function replaceOnce(source, from, to, label) {
            const index = source.indexOf(from);
            if (index < 0) throw new Error(`Missing ${label}`);
            if (source.indexOf(from, index + from.length) >= 0) {
              throw new Error(`Ambiguous ${label}`);
            }
            return source.slice(0, index) + to + source.slice(index + from.length);
          }

          await edit('src/components/agent/DecisionInboxWorkspace.tsx', (source) => {
            source = replaceOnce(source, '  CircleAlert,\n', '', 'unused CircleAlert import');
            source = replaceOnce(source, '  OperationsMeta,\n', '', 'unused OperationsMeta import');
            return source;
          });

          await edit('src/components/agent/WorkflowRunRecords.tsx', (source) => {
            source = replaceOnce(
              source,
              'import { Ban, Eye, Trash2, X } from "lucide-react";\n',
              'import { X } from "lucide-react";\n',
              'run-center icon imports',
            );
            source = replaceOnce(source, '  Card,\n', '', 'unused Card import');
            source = replaceOnce(source, '  CardContent,\n', '', 'unused CardContent import');
            source = replaceOnce(source, '  IconButton,\n', '', 'unused IconButton import');
            return source;
          });

          await edit('src/components/agent/WorkflowWorkspace.tsx', (source) => {
            source = replaceOnce(source, '  CardContent,\n', '', 'unused Workflow CardContent import');
            const from = `                          {\n                            label: locale === "zh" ? "累计运行" : "Total runs",\n                            value: metric?.runs || 0,\n                            detail: latestRun\n                              ? (locale === "zh" ? "最近 " : "Latest ") +\n                                statusLabel(latestRun.status, locale)\n                              : labels.never,\n                          },`;
            const to = `                          {\n                            label:\n                              locale === "zh"\n                                ? "最近正式运行"\n                                : "Latest live run",\n                            value: latestRun\n                              ? statusLabel(latestRun.status, locale)\n                              : labels.never,\n                            detail: latestDryRun\n                              ? (locale === "zh"\n                                  ? "最近试运行："\n                                  : "Latest dry-run: ") +\n                                statusLabel(latestDryRun.status, locale)\n                              : locale === "zh"\n                                ? (metric?.runs || 0) + " 次累计运行"\n                                : (metric?.runs || 0) + " total runs",\n                          },`;
            source = replaceOnce(source, from, to, 'latest run summary metric');
            return source;
          });

          await edit('src/pages/admin/AIOperations.tsx', (source) => {
            const overviewFrom = `            editorialTasks={editorialTasks}\n            formatDateTime={formatDateTime}\n            onNavigate={selectTab}`;
            const overviewTo = `            editorialTasks={editorialTasks}\n            formatDateTime={(value) =>\n              value ? formatDateTime(value) : "—"\n            }\n            onNavigate={selectTab}`;
            source = replaceOnce(source, overviewFrom, overviewTo, 'overview optional date formatter');

            const inboxFrom = `            onRefresh={refresh}\n            formatDateTime={formatDateTime}\n          />`;
            const inboxTo = `            onRefresh={refresh}\n            formatDateTime={(value) =>\n              value ? formatDateTime(value) : "—"\n            }\n          />`;
            source = replaceOnce(source, inboxFrom, inboxTo, 'inbox optional date formatter');
            return source;
          });
          NODE

          npx prettier --write \
            src/components/agent/DecisionInboxWorkspace.tsx \
            src/components/agent/WorkflowRunRecords.tsx \
            src/components/agent/WorkflowWorkspace.tsx \
            src/pages/admin/AIOperations.tsx
          npx tsc -b

      - name: Commit fixes
        run: |
          set -euo pipefail
          git add blog-frontend/src/components/agent/DecisionInboxWorkspace.tsx \
                  blog-frontend/src/components/agent/WorkflowRunRecords.tsx \
                  blog-frontend/src/components/agent/WorkflowWorkspace.tsx \
                  blog-frontend/src/pages/admin/AIOperations.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ai-ops): resolve reverse migration typecheck regressions"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

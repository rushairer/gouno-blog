name: Management Dependency Refactor

on:
  push:
    branches: [refactor/management-dependency-model]

permissions:
  contents: write

concurrency:
  group: management-dependency-refactor
  cancel-in-progress: true

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: blog-backend/go.mod
          cache-dependency-path: blog-backend/go.sum

      - name: Align script selectors with current source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/refactor_management_dependencies.py')
          text = path.read_text()
          old = '\\t"github.com/rushairer/blog-backend/internal/media/service"\\n\\t"github.com/rushairer/blog-backend/internal/operations"\\n'
          new = '\\tmediaservice "github.com/rushairer/blog-backend/internal/media/service"\\n\\t"github.com/rushairer/blog-backend/internal/operations"\\n'
          if old not in text:
              raise SystemExit('expected unaliased media import matcher not found')
          text = text.replace(old, new, 1)
          old_assertion = 'if "repository.NewAgentRepository" in resource_test or \'internal/repository"\' in resource_test:'
          new_assertion = 'if "agentservice.NewManagementService(repository." in resource_test or \'internal/repository"\' in resource_test:'
          if old_assertion not in text:
              raise SystemExit('expected broad flat repository assertion not found')
          path.write_text(text.replace(old_assertion, new_assertion, 1))
          PY

      - name: Apply fail-closed Management dependency cutover
        run: python3 .github/scripts/refactor_management_dependencies.py

      - name: Migrate remaining legacy test consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{label}: expected match')
              return text.replace(old, new, 1)

          # Preserve the existing media-service alias after the import insertion.
          web_path = Path('blog-backend/cmd/gouno/web.go')
          web = web_path.read_text()
          web = replace_once(
              web,
              '\t"github.com/rushairer/blog-backend/internal/media/service"\n',
              '\tmediaservice "github.com/rushairer/blog-backend/internal/media/service"\n',
              'media service alias',
          )
          web_path.write_text(web)

          # The validation-only unit test with capability lists has a non-all-nil tail.
          management_test_path = Path('blog-backend/internal/agent/management_test.go')
          management_test = management_test_path.read_text()
          if management_test.count('NewManagementService(nil,') != 1:
              raise SystemExit('expected exactly one remaining nil ManagementService dependency constructor')
          management_test_path.write_text(
              management_test.replace(
                  'NewManagementService(nil,',
                  'NewManagementService(ManagementServiceDependencies{},',
                  1,
              )
          )

          # Identity migration coverage should validate canonical Agent repositories,
          # not keep the flat aggregate alive solely for tests.
          identity_path = Path('blog-backend/internal/migrations/identity_backfill_integration_test.go')
          identity = identity_path.read_text()
          identity = replace_once(
              identity,
              '\t"github.com/rushairer/blog-backend/internal/identitybackfill"\n\t"github.com/rushairer/blog-backend/internal/repository"\n',
              '\tagentrepository "github.com/rushairer/blog-backend/internal/agent/repository"\n\t"github.com/rushairer/blog-backend/internal/identitybackfill"\n',
              'identity canonical import',
          )
          identity = replace_once(
              identity,
              'repo := repository.NewAgentRepository(db)',
              'starterPackRepo := agentrepository.NewAgentRepository(db)\n\tdefinitionRepo := agentrepository.NewDefinitionRepository(db)',
              'identity starter pack repository',
          )
          identity = identity.replace('repo.BootstrapStarterPack(ctx)', 'starterPackRepo.BootstrapStarterPack(ctx)', 2)
          identity = replace_once(identity, 'agents, err := repo.ListAgents(ctx)', 'agents, err := definitionRepo.ListAgents(ctx)', 'identity definition repository')
          identity = replace_once(
              identity,
              'repo := repository.NewAgentRepository(db)',
              'skillRepo := agentrepository.NewSkillRepository(db)',
              'identity skill repository',
          )
          for old, new in [
              ('repo.ListSkills(ctx)', 'skillRepo.ListSkills(ctx)'),
              ('repo.UpdateSkill(ctx, skill)', 'skillRepo.UpdateSkill(ctx, skill)'),
              ('repo.GetSkill(ctx, skill.ID)', 'skillRepo.GetSkill(ctx, skill.ID)'),
              ('repo.GetSkillVersion(ctx, skill.VersionID)', 'skillRepo.GetSkillVersion(ctx, skill.VersionID)'),
          ]:
              identity = replace_once(identity, old, new, f'identity {old}')
          if 'repository.NewAgentRepository' in identity or 'repo.ListSkills' in identity:
              raise SystemExit('identity tests still use flat AgentRepository')
          identity_path.write_text(identity)

          # Fresh-install migration bootstrap is the canonical starter-pack repository.
          migrate_path = Path('blog-backend/internal/migrations/migrate_integration_test.go')
          migrate = migrate_path.read_text()
          migrate = replace_once(
              migrate,
              '\t"github.com/rushairer/blog-backend/internal/repository"\n',
              '\tagentrepository "github.com/rushairer/blog-backend/internal/agent/repository"\n',
              'migrate canonical import',
          )
          migrate = replace_once(
              migrate,
              'repository.NewAgentRepository(db).BootstrapStarterPack(ctx)',
              'agentrepository.NewAgentRepository(db).BootstrapStarterPack(ctx)',
              'migrate starter pack repository',
          )
          migrate_path.write_text(migrate)

          # Provider revocation integration coverage belongs to Provider persistence.
          provider_test_path = Path('blog-backend/internal/repository/agent_repository_integration_test.go')
          provider_test = provider_test_path.read_text()
          provider_test = replace_once(
              provider_test,
              '\tagentrepository "github.com/rushairer/blog-backend/internal/agent/repository"\n',
              '\tagentrepository "github.com/rushairer/blog-backend/internal/agent/repository"\n\tproviderrepository "github.com/rushairer/blog-backend/internal/provider/repository"\n',
              'provider integration canonical import',
          )
          provider_test = replace_once(provider_test, 'repo := NewAgentRepository(db)', 'providerRepo := providerrepository.New(db)', 'provider integration repository')
          provider_test = replace_once(provider_test, 'repo.CreateProvider(ctx, profile)', 'providerRepo.CreateProvider(ctx, profile)', 'provider create')
          provider_test = replace_once(provider_test, 'repo.DeleteProvider(ctx, profile.ID)', 'providerRepo.DeleteProvider(ctx, profile.ID)', 'provider delete')
          provider_test_path.write_text(provider_test)
          PY

      - name: Format changed Go files
        run: |
          gofmt -w \
            blog-backend/internal/agent/management.go \
            blog-backend/internal/agent/management_ports.go \
            blog-backend/internal/agent/management_test.go \
            blog-backend/cmd/gouno/web.go \
            blog-backend/internal/workflow/resource_query_integration_test.go \
            blog-backend/internal/migrations/identity_backfill_integration_test.go \
            blog-backend/internal/migrations/migrate_integration_test.go \
            blog-backend/internal/repository/agent_repository.go \
            blog-backend/internal/repository/agent_repository_integration_test.go

      - name: Enforce ownership cutover
        run: |
          ! grep -q 's\.repo\.' blog-backend/internal/agent/management.go
          ! grep -q 'internal/repository"' blog-backend/internal/agent/management.go
          ! grep -R -q 'NewManagementService(repository.NewAgentRepository' blog-backend
          ! grep -R -q 'repository.NewAgentRepository(db).BootstrapStarterPack' blog-backend/internal/migrations
          ! grep -q 'repo.CreateProvider' blog-backend/internal/repository/agent_repository_integration_test.go
          test ! -e blog-backend/internal/repository/provider_repository.go
          test ! -e blog-backend/internal/repository/skill_repository.go
          grep -q 'Providers: providerRepo' blog-backend/cmd/gouno/web.go
          grep -q 'Runner still depends on flat `repository.AgentRepository`' blog-backend/ARCHITECTURE_CONVERGENCE.md
          git diff --check

      - name: Test
        working-directory: blog-backend
        run: go test ./...

      - name: Race detector
        working-directory: blog-backend
        run: go test -race ./...

      - name: Vet
        working-directory: blog-backend
        run: go vet ./...

      - name: Check known Go vulnerabilities
        working-directory: blog-backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Commit verified business changes
        run: |
          rm -f .github/scripts/refactor_management_dependencies.py
          rm -f .github/workflows/management-dependency-refactor.yml
          git add -A
          git diff --cached --check
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git commit -m "refactor(agent): narrow ManagementService dependencies"
          git push origin HEAD:refactor/management-dependency-model

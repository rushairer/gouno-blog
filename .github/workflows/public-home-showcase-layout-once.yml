name: Public Home Showcase layout once

on:
  push:
    branches:
      - ui/public-home-showcase-layout-20260913

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Align public Home composition to Showcase
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const homePath = 'blog-frontend/src/pages/Home.tsx';
          let home = fs.readFileSync(homePath, 'utf8');
          const oldFeatured = `              <div
                className={\`featured-layout featured-layout--\${Math.min(posts.length - 1, 4)}\`}
              >
                {posts.length >= 5 ? (
                  <>
                    <div className="featured-layout__column">
                      {posts.slice(1, 3).map((post) => (
                        <ArticleTeaser post={post} key={post.id} />
                      ))}
                    </div>
                    <div className="featured-layout__secondary">
                      {posts.slice(3, 5).map((post) => (
                        <ArticleTeaser post={post} key={post.id} />
                      ))}
                    </div>
                  </>
                ) : (
                  posts
                    .slice(1, 5)
                    .map((post) => <ArticleTeaser post={post} key={post.id} />)
                )}
              </div>`;
          const newFeatured = `              <div className="grid gap-x-8 md:grid-cols-2">
                {posts.slice(1, 5).map((post) => (
                  <ArticleTeaser post={post} key={post.id} />
                ))}
              </div>`;
          if (!home.includes(oldFeatured)) throw new Error('Home featured layout anchor not found');
          home = home.replace(oldFeatured, newFeatured);
          home = home.replace('className="mb-7 flex items-center justify-between gap-4"', 'className="mb-2 flex items-center justify-between gap-4"');
          home = home.replace('<h2 className="mb-7 text-lg font-semibold">最新文章</h2>', '<h2 className="mb-2 text-lg font-semibold">最新文章</h2>');
          fs.writeFileSync(homePath, home);

          const teaserPath = 'blog-frontend/src/components/reading/ArticleTeaser.tsx';
          let teaser = fs.readFileSync(teaserPath, 'utf8');
          const teaserBefore = '"editorial-story group grid min-w-0 gap-5 border-b py-6"';
          const teaserAfter = '"group grid min-w-0 gap-5 border-b py-6"';
          if (!teaser.includes(teaserBefore)) throw new Error('ArticleTeaser legacy class anchor not found');
          teaser = teaser.replace(teaserBefore, teaserAfter);
          fs.writeFileSync(teaserPath, teaser);

          const testPath = 'blog-frontend/src/pages/__tests__/Home.test.tsx';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace('    const { container } = renderHome();\n\n    expect(\n      await screen.findByRole("heading", { name: /记录探索与思考/ }),', '    renderHome();\n\n    expect(\n      await screen.findByRole("heading", { name: /记录探索与思考/ }),');
          test = test.replace('    expect(container.querySelector(".featured-layout")).toHaveClass(\n      "featured-layout--1",\n    );\n', '');

          const threeBefore = `    const { container } = renderHome();

    await screen.findAllByRole("heading", { name: "No Cover Post" });
    const featuredLayout = container.querySelector(".featured-layout");
    expect(featuredLayout).toHaveClass("featured-layout--2");
    expect(
      featuredLayout?.querySelectorAll(":scope > .editorial-story"),
    ).toHaveLength(2);
    expect(featuredLayout?.querySelector("img")).toBeNull();`;
          const threeAfter = `    renderHome();

    await screen.findAllByRole("heading", { name: "No Cover Post" });
    const featuredSection = screen
      .getByRole("heading", { name: "精选文章" })
      .closest("section");
    const featuredGrid = featuredSection?.querySelector("div.grid");
    expect(featuredGrid).toHaveClass("gap-x-8", "md:grid-cols-2");
    expect(featuredSection?.querySelectorAll("article")).toHaveLength(2);
    expect(featuredSection?.querySelector("img")).toBeNull();`;
          if (!test.includes(threeBefore)) throw new Error('Home three-post test anchor not found');
          test = test.replace(threeBefore, threeAfter);

          const fiveBefore = `    const { container } = renderHome();

    await screen.findAllByAltText("Featured cover");
    const featuredLayout = container.querySelector(".featured-layout");
    expect(featuredLayout).toHaveClass("featured-layout--4");
    expect(featuredLayout?.querySelectorAll(".editorial-story")).toHaveLength(
      4,
    );
    expect(
      featuredLayout?.querySelectorAll(".featured-layout__column"),
    ).toHaveLength(1);
    expect(
      featuredLayout?.querySelector(".featured-layout__secondary"),
    ).toBeInTheDocument();`;
          const fiveAfter = `    renderHome();

    await screen.findAllByAltText("Featured cover");
    const featuredSection = screen
      .getByRole("heading", { name: "精选文章" })
      .closest("section");
    const featuredGrid = featuredSection?.querySelector("div.grid");
    expect(featuredGrid).toHaveClass("gap-x-8", "md:grid-cols-2");
    expect(featuredSection?.querySelectorAll("article")).toHaveLength(4);`;
          if (!test.includes(fiveBefore)) throw new Error('Home five-post test anchor not found');
          test = test.replace(fiveBefore, fiveAfter);
          fs.writeFileSync(testPath, test);
          NODE

      - name: Install dependencies
        working-directory: blog-frontend
        run: npm ci

      - name: Verify Blog frontend quality
        working-directory: blog-frontend
        run: npm run quality

      - name: Commit parity fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-frontend/src/pages/Home.tsx blog-frontend/src/components/reading/ArticleTeaser.tsx blog-frontend/src/pages/__tests__/Home.test.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(ui): align public Home grid with Showcase"
          git push

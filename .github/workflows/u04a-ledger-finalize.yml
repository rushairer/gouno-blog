name: U04a Ledger Finalize

on:
  push:
    branches:
      - ui/u04a-browser-acceptance-20260913
    paths:
      - .github/workflows/u04a-ledger-finalize.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/u04a-browser-acceptance-20260913
          fetch-depth: 0
      - name: Reconcile U04a ledgers
        run: |
          python3 scripts/finalize-u04a-ledger.py
          python3 -m json.tool docs/ui-redesign/migration.json >/dev/null
          git diff --check
      - name: Commit ledger result
        run: |
          rm -f scripts/finalize-u04a-ledger.py .github/workflows/u04a-ledger-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(ui): reconcile U04a verification ledgers"
          git push origin HEAD:ui/u04a-browser-acceptance-20260913

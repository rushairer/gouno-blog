name: Gosso Release BFF Compatibility

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/gosso-release-bff-compat.yml"
      - "docker-compose.yml"
      - "docker-compose.source.yml"
      - "Caddyfile"
      - "seed/**"
      - "blog-backend/**"
      - "scripts/check-auth-deployment-contract.mjs"
      - "scripts/check-gosso-release-bff-compat.sh"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/gosso-release-bff-compat.yml"
      - "docker-compose.yml"
      - "docker-compose.source.yml"
      - "Caddyfile"
      - "seed/**"
      - "blog-backend/**"
      - "scripts/check-auth-deployment-contract.mjs"
      - "scripts/check-gosso-release-bff-compat.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: gosso-release-bff-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  GOSSO_RELEASE_VERSION: "1.7.0"
  GOSSO_RELEASE_DIGEST: "sha256:cdf81b3e6f532455aa8964e7921355c54e3bfca72bf5910cd21689d87fe80cbb"
  GOSSO_RELEASE_IMAGE: ghcr.io/rushairer/gosso:v1.7.1@sha256:cdf81b3e6f532455aa8964e7921355c54e3bfca72bf5910cd21689d87fe80cbb

jobs:
  gosso-1-7-1-bff:
    name: Gosso v1.7.1 BFF acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect published Gosso runtime identity
        shell: bash
        run: |
          set -euo pipefail
          runtime_uid="$(docker run --rm --entrypoint id "$GOSSO_RELEASE_IMAGE" -u)"
          echo "GOSSO_RUNTIME_UID=${runtime_uid}" >> "$GITHUB_ENV"
          echo "Published Gosso runtime UID: ${runtime_uid}"

      - name: Verify released Gosso and current Blog BFF compatibility
        run: bash scripts/check-gosso-release-bff-compat.sh

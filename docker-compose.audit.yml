services:
  db:
    image: pgvector/pgvector:0.8.6-pg15@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    container_name: !reset null
    ports: !reset []

  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: !reset null
    ports: !reset []

  mailpit:
    container_name: !reset null
    ports: !reset []
    restart: "no"

  gosso:
    image: gouno-release-audit-gosso:local
    pull_policy: build
    container_name: !reset null
    build:
      context: ${AUDIT_GOSSO_SOURCE:?set AUDIT_GOSSO_SOURCE}
      dockerfile: Dockerfile
    environment:
      GOUNO_AUTH_ISSUER: https://localhost:18443
      GOUNO_AUTH_PASSWORD_RESET_BASE_URL: https://localhost:18443/identity-admin/reset-password
      GOUNO_AUTH_WEBAUTHN_RP_ORIGIN: https://localhost:18443

  gosso-admin-seed:
    image: gouno-release-audit-admin-seed:local
    pull_policy: build
    container_name: !reset null
    build:
      context: ${AUDIT_GOSSO_ADMIN_SOURCE:?set AUDIT_GOSSO_ADMIN_SOURCE}/seed
      dockerfile: Dockerfile
    environment:
      OAUTH2_CLIENT_REDIRECT_URIS: https://localhost:18443/identity-admin/callback

  blog-client-seed:
    container_name: !reset null
    environment:
      BLOG_OAUTH_REDIRECT_URIS: https://localhost:18443/callback

  blog-backend:
    container_name: !reset null
    environment:
      SSO_TOKEN_ISSUER: https://localhost:18443

  blog-frontend:
    container_name: !reset null
    build:
      args:
        VITE_GOSSO_ISSUER: https://localhost:18443

  gosso-admin-frontend:
    image: gouno-release-audit-admin-frontend:local
    pull_policy: build
    container_name: !reset null
    build:
      context: ${AUDIT_GOSSO_ADMIN_SOURCE:?set AUDIT_GOSSO_ADMIN_SOURCE}/gosso-admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_BASE_PATH: /identity-admin

  gateway:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:18443:18443"
    volumes: !override
      - ./Caddyfile.audit:/etc/caddy/Caddyfile:ro
      - ./certs/localhost.pem:/etc/caddy/certs/localhost.pem:ro
      - ./certs/localhost-key.pem:/etc/caddy/certs/localhost-key.pem:ro

networks:
  default:
    ipam: !reset null

          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        category_id:
          type: integer
          nullable: true
        cover_url:
          type: string
        cover_alt:
          type: string
        seo_title:
          type: string
        seo_description:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
        published_at:
          type: string
          format: date-time
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Comment:
      type: object

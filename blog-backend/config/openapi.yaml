          type: string
          format: date-time
    CreatePostRequest:
      type: object
      properties:
        title:
          type: string
          example: "Getting Started with GoUno"
        slug:
          type: string
          example: "getting-started-with-gouno"
        summary:
          type: string
          example: "An introductory guide to GoUno backend development."
        content:
          type: string
          example: "GoUno is a highly modular Go framework built for developers..."
        tags:
          type: array
          items:
            type: string
          example: ["Go", "Framework", "Backend"]
        category_id:
          type: integer
          nullable: true
        cover_url:
          type: string
          example: "/media/article-cover.webp"
        cover_alt:
          type: string
        seo_title:
          type: string
          maxLength: 255
        seo_description:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
          default: draft
        scheduled_at:
          type: string
          format: date-time
          description: Required for scheduled posts; interpreted and displayed in Asia/Shanghai by the admin UI.
    CreateCommentRequest:

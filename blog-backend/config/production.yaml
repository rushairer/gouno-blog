web_server:
    address: 0.0.0.0
    port: 8082
    idle_timeout: 60s
    read_timeout: 5s
    read_header_timeout: 2s
    write_timeout: 6m
    request_timeout: 10s
    # The AI workspace fans out into several authorized read requests and can
    # legitimately retry transient Provider failures; keep operator bursts out
    # of the global 429 path without removing rate limiting.
    rate_limit_per_minute: 300
    trusted_proxies:
        - "172.16.0.0/12"
    # Same-origin requests need no CORS configuration. Add only explicit public origins here.
    cors_allowed_origins: []
    secure_cookies: true
database:
    default: postgres
    drivers:
        sqlite:
            name: sqlite
            driver: sqlite3
            dsn: ./data/blog.db
            log_level: 1 #日志级别, 1:Silent 2:Error 3:Warn 4:Info
        mysql:
            name: mysql
            driver: mysql
            dsn: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local
            log_level: 1 #日志级别, 1:Silent 2:Error 3:Warn 4:Info
        postgres:
            name: postgres
            driver: postgres
            # Required through GOUNO_DATABASE_DRIVERS_POSTGRES_DSN at runtime.
            dsn: ""
            log_level: 1 #日志级别, 1:Silent 2:Error 3:Warn 4:Info
redis:
    dsn: redis://redis:6379/0
    max_active_conns: 6000
    pool_timeout_seconds: 60
bigcache:
    hard_max_cache_size: 6
task_pipeline:
    flush_size: 32
    buffer_size: 64
    flush_interval: 1s
smtp:
    host: localhost
    port: 1025
    username: ""
    password: ""
    from: noreply@blog.com
captcha:
    type: math
log:
    level: 0 #日志级别, -1: Debug, 0: Info, 1: Warn, 2: Error, 3: DPanic, 4: Panic, 5: Fatal
ai_agents:
    enabled: false
    allowed_upstream_hosts: []
    scheduler_interval: 30s

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Gouno Blog, Blog Admin and GOSSO As-Is Architecture</title><desc id="d">Caddy serves two origins; one Blog React application, a Go backend embedding an OIDC BFF and Blog APIs, a distinct GOSSO Admin React frontend and GOSSO Go identity provider, with separate logical PostgreSQL databases and shared Redis.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6" fill="none" stroke="#4c617c" stroke-width="1.5"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#162941}.hdr{fill:#fff;font-size:33px;font-weight:bold}.h{font-size:23px;font-weight:bold}.b{font-size:18px}.s{font-size:16px;fill:#4e6177}.box{fill:#fff;stroke:#b9ccdf;stroke-width:2;rx:14}.flow{stroke:#4c617c;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="1000" fill="#f5f8fc"/><rect width="1600" height="105" fill="#152641"/><text x="45" y="51" class="hdr">GOUNO  /  BLOG + BLOG ADMIN + GOSSO</text><text x="45" y="85" style="fill:#cfdeec;font-size:17px">AS-IS source review • main: 2026-11-11 • Not a live-production attestation</text>
<rect x="40" y="135" width="890" height="170" class="box" stroke="#3478b8"/><text x="62" y="172" class="h">blog.io84.com — ONE React/Vite SPA</text><rect x="65" y="189" width="385" height="82" rx="12" fill="#e8f4ff"/><text x="86" y="225" class="h">Public Blog   /</text><text x="86" y="253" class="s">Articles, search, comments</text><rect x="471" y="189" width="430" height="82" rx="12" fill="#f1eafd"/><text x="493" y="225" class="h">Blog Admin   /admin/*</text><text x="493" y="253" class="s">Content, media, AI, settings</text><text x="62" y="294" class="s">@gosso/client BFF Cookie mode; no browser OAuth tokens</text>
<rect x="958" y="135" width="602" height="170" class="box" stroke="#20865e"/><text x="980" y="172" class="h">sso.io84.com — GOSSO Admin SPA</text><rect x="980" y="189" width="555" height="82" rx="12" fill="#e8f8ee"/><text x="1000" y="225" class="h">Login / Account / SSO Admin</text><text x="1000" y="253" class="s">gosso-admin-frontend • separate from Blog Admin</text><text x="980" y="294" class="s">GOSSO origin host-only identity Cookies</text>
<path d="M485 305 V359 M1255 305 V359" class="flow"/><rect x="40" y="364" width="1520" height="126" class="box" stroke="#12918a"/><text x="63" y="405" class="h">Caddy HTTPS gateway — CSP, security headers, host/path reverse proxy</text><text x="63" y="448" class="b">Blog: /api/* /media/* feeds → backend :8082; pages and assets → frontend :8081</text><text x="63" y="474" class="b">SSO: /oauth2/* /oidc/* /.well-known/* /api/v1/* → gosso :8080; other paths → SSO frontend :8083</text>
<path d="M485 490 V551 M1255 490 V551" class="flow"/><rect x="40" y="556" width="890" height="262" class="box" stroke="#3478b8"/><text x="62" y="594" class="h">Blog Backend: ONE Go/Gin process</text><rect x="62" y="615" width="405" height="181" rx="12" fill="#fff0f2" stroke="#bf3850" stroke-width="2.6"/><text x="82" y="649" class="h" style="fill:#ac2742">CONFIDENTIAL BFF</text><text x="82" y="679" class="s">internal/authbff • /api/auth/*</text><text x="82" y="710" class="b">Code + PKCE; state/nonce</text><text x="82" y="740" class="b">OIDC token exchange and verify</text><text x="82" y="771" class="b">Encrypted Redis sessions; Cookie</text><rect x="489" y="615" width="419" height="181" rx="12" fill="#e8f4ff" stroke="#3478b8"/><text x="510" y="649" class="h">Blog Capability APIs</text><text x="510" y="679" class="s">Public /api/* and protected /api/admin/*</text><text x="510" y="710" class="b">Local membership + permissions</text><text x="510" y="740" class="b">Posts • media • AI • workflows</text><text x="510" y="771" class="s">External /api/external/v1/*: API Key</text>
<rect x="958" y="556" width="602" height="262" class="box" stroke="#20865e"/><text x="980" y="594" class="h">GOSSO Backend: independent Go/Gin IdP</text><rect x="980" y="615" width="556" height="181" rx="12" fill="#e8f8ee"/><text x="1000" y="649" class="h">OAuth2 / OIDC and identity</text><text x="1000" y="679" class="b">/.well-known/*, /oauth2/*, /oidc/*</text><text x="1000" y="710" class="b">Code, token, JWKS, revoke, logout</text><text x="1000" y="741" class="b">/api/v1/auth/* — MFA, Passkeys</text><text x="1000" y="772" class="b">/api/v1/admin/* — users and clients</text>
<path d="M930 684 H957" class="flow"/><text x="949" y="674" class="s" text-anchor="end">BFF ↔ IdP</text>
<rect x="40" y="847" width="1520" height="124" class="box"/><text x="62" y="880" class="h">Production Compose: one PostgreSQL/pgvector service + one Redis service</text><text x="62" y="911" class="b">PostgreSQL logical databases: blog + gosso (separate); Redis: BFF encrypted sessions and GOSSO state</text><text x="62" y="940" class="b">Media: local volume (default), S3 compatible (optional) • CMS origin reserved 404, not deployed</text></svg>
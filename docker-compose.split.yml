services:
  gosso:
    pull_policy: never
    environment:
      - GOUNO_AUTH_ISSUER=https://sso.dev.local
      - GOUNO_AUTH_LOGIN_URL=/login
      - GOUNO_AUTH_PASSWORD_RESET_BASE_URL=https://sso.dev.local/reset-password
      - GOUNO_AUTH_WEBAUTHN_RP_ID=sso.dev.local
      - GOUNO_AUTH_WEBAUTHN_RP_NAME=gosso-sso-local
      - GOUNO_AUTH_WEBAUTHN_RP_ORIGIN=https://sso.dev.local
      - GOUNO_AUTH_ENFORCE_PKCE_FOR_CONFIDENTIAL=true
      - GOUNO_CORS_ALLOWED_ORIGINS=https://sso.dev.local,https://sso.local.test

  gosso-admin-seed:
    pull_policy: missing
    environment:
      - OAUTH2_CLIENT_REDIRECT_URIS=https://sso.dev.local/callback,https://sso.dev.local/admin/callback

  gosso-admin-frontend:
    image: ghcr.io/rushairer/gosso-admin-frontend:main
    pull_policy: never

  blog-frontend:
    pull_policy: missing

  blog-media-init:
    pull_policy: missing

  blog-client-seed:
    pull_policy: never
    environment:
      - BLOG_OAUTH_CLIENT_ID=blog-bff
      - BLOG_OAUTH_CONFIDENTIAL=true
      - BLOG_OAUTH_CLIENT_SECRET=blog-bff-secret-local
      - BLOG_OAUTH_REDIRECT_URIS=https://blog.dev.local/api/auth/callback
      - BLOG_OAUTH_POST_LOGOUT_REDIRECT_URIS=https://blog.dev.local/
      - BLOG_OAUTH_BACKCHANNEL_LOGOUT_URI=http://blog-backend:8082/api/auth/backchannel-logout
      - BLOG_OAUTH_ALLOWED_RESOURCES=https://blog.dev.local/api,https://blog.local.test/api

  blog-backend:
    pull_policy: never
    environment:
      - SSO_TOKEN_ISSUER=https://sso.dev.local
      - SSO_TOKEN_AUDIENCE=https://blog.dev.local/api
      - SSO_CLIENT_ID=blog-bff
      - BLOG_BOOTSTRAP_OWNER_ISSUER=https://sso.dev.local
      - BLOG_IDENTITY_ISSUER_MIGRATIONS={"https://sso.dev.local":"https://localhost:8443","https://sso.local.test":"https://localhost:8443"}
      - BLOG_BFF_ENABLED=true
      - BLOG_OIDC_ISSUER=https://sso.dev.local
      - BLOG_OIDC_CLIENT_ID=blog-bff
      - BLOG_OIDC_CLIENT_SECRET=blog-bff-secret-local
      - BLOG_OIDC_REDIRECT_URL=https://blog.dev.local/api/auth/callback
      - BLOG_OIDC_POST_LOGOUT_URL=https://blog.dev.local/
      - BLOG_OIDC_RESOURCE=https://blog.dev.local/api
      - BLOG_OIDC_SCOPES=openid profile email
      - BLOG_OIDC_INTERNAL_ENDPOINT=http://gosso:8080
      - BLOG_BFF_TINK_KEYSET_PATH=/run/secrets/blog-bff-tink.json
    volumes:
      - ./secrets/blog-bff-tink.json:/run/secrets/blog-bff-tink.json:ro

  gateway:
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    volumes:
      - ./Caddyfile.local-split:/etc/caddy/Caddyfile:ro
      - ${LOCAL_TLS_CERT_FILE:-./certs/localhost.pem}:/etc/caddy/certs/localhost.pem:ro
      - ${LOCAL_TLS_KEY_FILE:-./certs/localhost-key.pem}:/etc/caddy/certs/localhost-key.pem:ro

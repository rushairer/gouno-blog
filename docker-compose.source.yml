services:
  blog-client-seed:
    image: gouno-blog-seed:local
    pull_policy: build
    build:
      context: ./seed
      dockerfile: Dockerfile

  blog-backend:
    image: gouno-blog-backend:local
    pull_policy: build
    build:
      context: .
      dockerfile: blog-backend/Dockerfile

  blog-media-init:
    image: gouno-blog-backend:local
    pull_policy: never

  blog-frontend:
    image: gouno-blog-frontend:local
    pull_policy: build
    build:
      context: ./blog-frontend
      dockerfile: Dockerfile
      args:
        VITE_GOSSO_ISSUER: ${VITE_GOSSO_ISSUER:-https://sso.dev.local}
        VITE_GOSSO_CLIENT_ID: ${VITE_GOSSO_CLIENT_ID:-blog-bff}
        VITE_GOSSO_SCOPE: ${VITE_GOSSO_SCOPE:-openid profile email}
